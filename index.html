.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:15px}.weekday{text-align:center;font-size:12px;font-weight:700;color:#71807d;padding:8px 0}.cal-day{min-height:108px;border:1px solid #e4eae6;border-radius:9px;padding:7px;background:#fff;overflow:hidden}.cal-day.other{opacity:.35}.cal-day.off{background:#f4f2ed}.cal-day.today{border:2px solid #2b6868}.cal-number{font-size:12px;font-weight:700}.cal-event{display:block;width:100%;border:0;text-align:left;border-radius:5px;background:#e8f2ef;color:#27504c;font-size:11px;padding:5px;margin-top:5px;overflow-wrap:anywhere}.cal-event.overdue{background:#fbe7e1;color:#9c4832}.cal-holiday{font-size:10px;color:#946b3e;margin-top:4px}.cal-legend{font-size:12px;color:#65736d;margin-top:10px}.cal-controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.cal-controls select{max-width:180px}@media(max-width:650px){.cal-day{min-height:78px;padding:3px}.cal-event{font-size:9px;padding:3px}.cal-number{font-size:11px}.calendar-grid{gap:2px}.cal-holiday{font-size:9px}} .cal-start{background:#e8edf8;color:#354f80}.cal-office{background:#fff1d9;color:#82571d}.cal-client{background:#e8f2ed;color:#245b42}.cal-event.overdue{background:#fbe7e1;color:#9c4832}.cal-day{min-height:132px}.cal-events{display:grid;gap:4px;margin-top:6px}.cal-event{margin-top:0}.cal-owner{font-weight:700;font-size:11px;display:block;margin-bottom:2px}.cal-count{font-size:10px;color:#5b6967;margin-top:4px}.cal-event.done{opacity:.65}.cal-day:has(.cal-events) {overflow:visible}@media(max-width:650px){.cal-day{min-height:100px}.cal-owner{font-size:9px}}.cal-day{min-width:0;min-height:116px;overflow:hidden!important}.cal-daytop{display:flex;justify-content:space-between;align-items:center}.cal-count{margin:0;font-size:10px;background:#e8efec;border-radius:20px;padding:2px 6px}.cal-more{background:none;border:0;color:#276b /* Santrelle | identidade visual premium */
:root{--marfim:#F1E5DC;--taupe:#8B7663;--areia:#E2D6CB;--fendi:#AF9E8E;--marrom:#625245;--offwhite:#FAF8F5;--grafite:#3F3832;--linha:#E8DED5;font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;color:var(--grafite);background:var(--offwhite);font-synthesis:none}
body{background:var(--offwhite);color:var(--grafite);line-height:1.5}
aside{background:var(--marrom);color:var(--offwhite);border-right:1px solid #79695C;padding:32px 19px}
aside h2{letter-spacing:.11em;font-size:20px;font-weight:700}
aside small{color:#F1E5DC;letter-spacing:.04em}
nav{gap:7px}
nav button{color:#F1E5DC;border-radius:9px;font-weight:500;transition:background .18s ease}
nav button.active,nav button:hover{background:#8B7663;color:#fff}
main{max-width:1700px;padding:36px 42px}
h1,h2,h3{color:var(--grafite);letter-spacing:-.025em}
h1{font-size:30px;font-weight:650}
h3{font-weight:650}
.muted{color:#807165}
.cards{gap:17px}
.card,.panel{background:#fff;border:1px solid var(--linha);border-radius:16px;box-shadow:0 5px 20px rgba(98,82,69,.045)}
.card{transition:box-shadow .2s ease,border-color .2s ease}
.card:hover{border-color:var(--fendi);box-shadow:0 8px 25px rgba(98,82,69,.09)}
.card strong{color:var(--marrom);font-weight:650}
.primary{background:var(--marrom);color:#fff;border:1px solid var(--marrom);border-radius:9px;font-weight:600;transition:background .18s ease}
.primary:hover{background:#493C32}
.secondary{background:#fff;color:var(--marrom);border:1px solid var(--areia);border-radius:9px}
.secondary:hover{background:var(--offwhite);border-color:var(--taupe)}
input,select,textarea{background:#fff;color:var(--grafite);border:1px solid var(--areia);border-radius:9px}
input:focus-visible,select:focus-visible,button:focus-visible,.click:focus-visible{outline:2px solid var(--taupe);outline-offset:2px}
.phase{background:var(--offwhite);border:1px solid var(--linha);border-radius:13px}
.sub{background:#fff;border-left:3px solid var(--fendi);border-radius:0 8px 8px 0}
table{border-collapse:separate;border-spacing:0}
th{background:var(--offwhite);color:var(--taupe);font-weight:650;letter-spacing:.015em}
td,th{border-bottom:1px solid #F0E9E3;padding:14px 13px}
tbody tr:hover{background:#FCFAF8}
.click{color:var(--marrom);text-decoration-color:var(--fendi);text-underline-offset:3px}
.tag{background:var(--marfim);color:var(--marrom);font-weight:600}
.tag.late,.late{background:#F5E5DF;color:#95584B}
.tag.waiting,.waiting{background:#F7EFDC;color:#806A42}
.tag.good,.good{background:#EAECE3;color:#5B6951}
.note{background:#F7F0E5;color:var(--marrom);border:1px solid #EEE1D0}
.weekday{color:var(--taupe);letter-spacing:.025em}
.cal-day{background:#fff;border:1px solid var(--linha);border-radius:9px}
.cal-day.off{background:#F4F0EB}
.cal-day.today{border:2px solid var(--taupe);background:#FFFCF9}
.cal-number{color:var(--grafite)}
.cal-holiday{color:#876C55}
.cal-start{background:#EFE7E0;color:#695443}
.cal-office{background:#E7D6C5;color:#584437}
.cal-client{background:#E7E7DE;color:#5B604E}
.cal-event.overdue{background:#F5E3DE;color:#95584B}
.cal-event{border:1px solid transparent;border-radius:6px;line-height:1.3}
.cal-event:hover{border-color:var(--taupe)}
.cal-count{background:var(--marfim);color:var(--marrom)}
.cal-more{color:var(--marrom)}
.cal-agenda{background:var(--offwhite);border:1px solid var(--areia)}
.cal-legend{color:#7C6D61}
.table-scroll{border-radius:9px}
@media(max-width:850px){aside{padding:18px 16px}main{padding:22px 17px}nav{gap:5px}.cards{gap:10px}.card,.panel{padding:17px}}
@media(max-width:520px){h1{font-size:25px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card strong{font-size:25px}.calendar-head{gap:14px}.cal-controls{gap:5px}.cal-controls .primary,.cal-controls .secondary{padding:8px 10px;font-size:12px}.cal-day{border-radius:5px}.cal-agenda{padding:12px}.inline{gap:8px}}

/* Ficha cadastral do novo projeto */
.reg-intro{color:var(--taupe);margin:14px 0 19px;max-width:840px}
.reg-card{margin:17px 0;padding:25px;background:white;border:1px solid var(--linha);border-radius:16px;box-shadow:0 4px 17px rgba(98,82,69,.04)}
.reg-heading{display:flex;gap:12px;align-items:center;margin:0 0 8px}
.reg-heading h2{font-size:19px;margin:0}
.reg-number{background:var(--marfim);color:var(--marrom);display:grid;place-items:center;border-radius:50%;height:32px;width:32px;flex:none;font-weight:700}
.reg-helper{color:var(--taupe);font-size:13px;margin:0 0 20px}
.reg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 20px}
.reg-field{display:flex;flex-direction:column;gap:6px;color:var(--marrom);font-size:13px;font-weight:600}
.reg-field input,.reg-field select,.reg-field textarea{width:100%;max-width:100%;font-size:14px;font-weight:400;min-height:43px;padding:10px;color:var(--grafite);background:white}
.reg-field textarea{min-height:81px;resize:vertical}
.reg-wide{grid-column:1/-1}
.reg-required{color:#9C6255}
.reg-stage{padding:16px 0;border-top:1px solid var(--linha)}
.reg-stage:first-of-type{border-top:0}
.reg-stage h3{font-size:16px;color:var(--marrom);margin:0 0 11px}
.reg-stage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.reg-stage-total{margin-top:13px;display:flex;gap:10px;flex-wrap:wrap}
.reg-stage-total span{background:var(--offwhite);border:1px solid var(--linha);padding:8px 11px;border-radius:8px;font-size:13px;color:var(--marrom)}
.reg-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin:21px 0}
.reg-warning{margin-top:15px;padding:13px 16px;background:#F7F0E5;border:1px solid #EBDFD3;color:var(--marrom);border-radius:10px;font-size:13px}
.reg-summary{background:var(--marfim);border-radius:9px;padding:12px 15px;margin:14px 0;color:var(--marrom);font-weight:650}
@media(max-width:700px){.reg-card{padding:16px}.reg-grid{grid-template-columns:1fr}.reg-stage-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.reg-actions button{flex:1}}
@media(max-width:420px){.reg-stage-grid{grid-template-columns:1fr}}

/* Ficha: prazos contratuais por etapa, sem coluna de dias adicionais */
.reg-contract-table{border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:#fff;margin-top:15px}
.reg-contract-header,.reg-contract-row{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;align-items:center;padding:13px 18px}
.reg-contract-header{background:var(--offwhite);font-size:12px;font-weight:700;color:var(--taupe);letter-spacing:.015em}
.reg-contract-row{border-top:1px solid var(--linha)}
.reg-contract-name{color:var(--marrom);font-weight:600}
.reg-contract-row .reg-field{display:grid;grid-template-columns:1fr 100px;align-items:center;gap:8px}
.reg-contract-row .reg-field input{min-width:0;text-align:center}
@media(max-width:640px){.reg-contract-header,.reg-contract-row{grid-template-columns:minmax(0,1fr) 160px;gap:9px;padding:11px 10px}.reg-contract-row .reg-field{grid-template-columns:1fr;gap:2px}.reg-contract-row .reg-field span{font-size:11px}.reg-contract-header{font-size:11px}}

.reg-contract-subrow{background:#FAF8F5}
.reg-contract-subrow .reg-contract-name{padding-left:19px;color:#8B7663;font-weight:500;position:relative}
.reg-contract-subrow .reg-contract-name::before{content:"↳";position:absolute;left:0;color:#AF9E8E}
.reg-contract-total{padding:9px 18px 12px;text-align:right;background:#F5EEE9;border-top:1px solid var(--linha);font-size:12px;color:#625245}
@media(max-width:640px){.reg-contract-total{padding:9px 10px}.reg-contract-subrow .reg-contract-name{padding-left:14px}}
.reg-optional-note{display:block;font-size:11px;font-weight:400;color:#8B7663;margin-top:3px;line-height:1.4}.br-date-input{font-variant-numeric:tabular-nums;letter-spacing:.025em;min-width:130px}.br-date-input::placeholder{color:#9A8A7D;opacity:1}
/* Equipe: diretório compacto e compromissos individuais em ordem cronológica. */
.tag.active{background:#E5EDF3;color:#456C86}
.team-directory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:17px 0}
.team-person{display:flex;align-items:center;gap:14px;min-width:0;width:100%;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:18px 19px;text-align:left;color:var(--grafite);transition:box-shadow .18s,border-color .18s,transform .18s}
.team-person:hover{border-color:var(--fendi);box-shadow:0 7px 23px rgba(98,82,69,.09);transform:translateY(-1px)}
.team-avatar{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--marfim);color:var(--marrom);font-size:14px;font-weight:750;letter-spacing:.02em}
.team-person-text{display:flex;flex-direction:column;min-width:0;flex:1;gap:3px}.team-person-text strong{font-size:15px;color:var(--grafite);overflow-wrap:anywhere}
.team-person-text .muted{font-size:12px}
.team-arrow{margin-left:auto;font-size:24px;line-height:1;color:var(--taupe);font-weight:350}
.team-overdue-count{font-size:11px;font-weight:700;color:#98554D;white-space:nowrap}
.team-member-heading{justify-content:space-between}
.team-summary{display:flex;flex-wrap:wrap;gap:10px;margin-top:17px}
.team-summary span{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid var(--linha);border-radius:9px;font-size:12px;background:#fff}
.team-summary span strong{font-size:17px}
.team-summary-late,.team-status-late{color:#A14E48!important}
.team-summary-active,.team-status-active{color:#466F8A!important}
.team-summary-good,.team-status-good{color:#4C765A!important}
.team-timeline-panel{padding-bottom:12px}
.team-timeline{display:flex;flex-direction:column;margin-top:16px}
.team-commitment{display:flex;align-items:center;gap:15px;width:100%;padding:16px 9px;background:transparent;border:0;border-bottom:1px solid var(--linha);text-align:left;border-radius:0;color:var(--grafite)}
.team-commitment:last-child{border-bottom:0}
.team-commitment:hover{background:var(--offwhite)}
.team-date{flex:none;width:108px;font-weight:650;font-size:13px;font-variant-numeric:tabular-nums;color:var(--marrom)}
.team-commitment-body{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.team-commitment-body strong{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.team-commitment-body .muted{font-size:12px}
.team-status{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;font-size:11px;font-weight:700;padding:7px 10px;border-radius:8px}
.team-status-late{background:#F5E5E2}
.team-status-active{background:#E7EFF4}
.team-status-good{background:#E8F0E9}
@media(max-width:780px){.team-directory{grid-template-columns:1fr}.team-person{padding:15px}.team-date{width:90px}.team-commitment{gap:10px}.team-summary{gap:6px}}
@media(max-width:520px){.team-commitment{display:grid;grid-template-columns:1fr auto;gap:7px 10px;padding:13px 4px}.team-date{grid-column:1;grid-row:1;width:auto;font-size:12px}.team-commitment-body{grid-column:1;grid-row:2}.team-status{grid-column:2;grid-row:1;white-space:nowrap;font-size:10px;padding:5px 7px}.team-commitment .team-arrow{grid-column:2;grid-row:2;justify-self:end}.team-person{gap:10px}.team-overdue-count{font-size:10px}.team-member-heading button{font-size:12px}}

/* Responsaveis por subetapa: painel do projeto */
.project-substage{margin-top:17px;padding:16px;border:1px solid var(--linha);border-radius:12px;background:var(--offwhite)}
.project-substage-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.project-substage-title strong{font-size:16px;color:var(--marrom)}
.project-subtask{padding:15px 16px;background:#fff;border:1px solid var(--linha);border-radius:10px;margin:10px 0}
.project-subtask-heading{display:flex;align-items:center;justify-content:space-between;gap:14px}
.project-subtask-heading strong{font-size:14px;color:var(--grafite)}
.project-subtask-heading .muted{font-size:12px;margin-top:5px}
.project-subtask-waiting{background:#F5EFDF;color:#7D6B43}
.project-subtask-controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-top:14px}
.project-subtask-controls label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--taupe);font-weight:600}
.project-subtask-controls label:first-child{flex:1 1 195px;min-width:160px}
.project-subtask-controls select{min-width:160px;max-width:100%}
.project-subtask-days{display:flex;gap:7px;align-items:center;color:var(--grafite);font-weight:400}
.project-subtask-days input{width:76px;padding:9px}
.project-subtask-buttons{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.project-subtask-buttons button{padding:9px 11px;font-size:12px}
.project-add-subtask{margin-top:10px}
@media(max-width:650px){.project-substage{padding:10px}.project-subtask{padding:12px}.project-subtask-controls{gap:10px}.project-subtask-controls label:first-child{flex:1 1 100%}.project-subtask-controls select{width:100%}.project-subtask-buttons{margin-left:0;width:100%}.project-subtask-buttons button{flex:1}.project-subtask-heading{align-items:flex-start}.project-subtask-heading .team-status{margin-top:3px}}

/* Subetapas no projeto: mesma linha compacta do modelo, com responsável por atividade. */
.project-subpanel-heading{justify-content:space-between;align-items:center;margin-bottom:20px}
.project-subpanel-intro{flex:1;min-width:240px}
.project-substage{padding:0;border:0;background:transparent;margin:24px 0 0}
.project-substage-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px;padding:0 3px}
.project-substage-title strong{font-size:15px}
.project-subrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:7px 0;padding:12px 13px;background:#fff;border:1px solid #F1E9E3;border-left:3px solid var(--fendi);border-radius:4px}
.project-subrow-name{min-width:190px;flex:1 1 34%;display:flex;flex-direction:column;gap:4px}
.project-subrow-name strong{font-size:13px;color:var(--grafite);font-weight:550;line-height:1.4}
.project-subrow-name .muted{font-size:11px}
.project-subrow-controls{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex:0 1 auto}
.project-subrow-controls select{width:185px;min-width:145px;padding:10px 9px;font-size:12px}
.project-sub-days{display:inline-flex;align-items:center;gap:8px;color:var(--grafite);white-space:nowrap;font-size:12px}
.project-sub-days input{width:72px;min-width:60px;padding:9px;font-size:13px}
.project-subrow-controls .secondary{padding:9px 10px;font-size:12px}
.project-completion{display:grid;place-items:center;flex:none;border:0;border-radius:8px;width:33px;height:34px;font-size:18px;cursor:pointer}
.project-completion:hover{filter:brightness(.95)}
.project-remove-sub{font-size:17px!important;min-width:33px}
.project-add-subtask{margin-top:7px;font-size:13px}

.pw-file-document{display:flex;justify-content:center;align-items:center;font-size:21px;font-weight:700;color:#9C7269;letter-spacing:2px}
.pw-file-name{font-size:10px;color:var(--marrom);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-file-link small{color:var(--taupe);font-size:10px}
.pw-file-delete{font-size:10px;background:#fff;border:1px solid var(--linha);color:#A0574B;border-radius:6px;margin-top:6px;padding:5px 8px;cursor:pointer;width:100%}
.pw-file-delete:hover{background:#FFF0EC;border-color:#E4C4BC}
.pw-file-error{color:#A0574B;font-size:11px}
@media(max-width:620px){.pw-header-actions{width:100%;justify-content:stretch}.pw-header-actions button{flex:1 1 100%}.pw-file-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}

.pw-direct-add{display:inline-flex;align-items:center;justify-content:center;border:1px solid #C6B5A7;background:#F6EEE7;color:var(--marrom);padding:8px 11px;border-radius:8px;font-size:12px;cursor:pointer}
.pw-direct-add:hover{background:#EFE1D5;border-color:#A89180}
.pw-direct-add:focus-within{outline:2px solid var(--fendi)}

.pw-file-download{display:block;margin-top:7px;text-align:center;font-size:10px;color:var(--marrom);text-decoration:underline;text-underline-offset:2px}
.pw-file-download:hover{color:#8F644E}

/* Cronograma por ciclos: datas não automáticas permanecem a definir */
.flex-summary .sched-preview-stage{margin-bottom:12px}
.flex-info{border:1px solid #DED1C4;background:#F8F4EE;border-radius:10px;padding:12px 15px;margin:12px 0 18px;color:#6A594C;font-size:12px;line-height:1.55}
.flex-item{background:#fff;border:1px solid #DFD3C8;border-radius:10px;margin:10px 0;padding:13px}
.flex-item-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.flex-item-top strong{font-size:13px;color:#625245}
.flex-item-top span{font-size:11px}
.flex-item label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:650;color:#796456}
.flex-item input{width:min(100%,180px);height:38px;background:#FAF8F5;border:1px solid #D4C4B7;border-radius:7px;padding:8px 10px;font-size:13px}
.flex-item-result{margin-top:9px;font-size:11px;color:#8B7663}
.flex-item-result strong{font-size:13px;color:#625245}
.flex-item p{margin:9px 0 0;font-size:11px;line-height:1.5}
.flex-detail{margin-top:16px}
.flex-detail-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#FAF8F5;border:1px solid #E2D6CB;border-radius:8px;padding:10px 13px;margin:8px 0;font-size:12px}
.flex-detail-row strong{min-width:40px;color:#625245}
.flex-detail-row span:not(.tag){color:#8B7663}
@media(max-width:600px){.flex-item-top{align-items:flex-start;flex-direction:column;gap:4px}.flex-detail-row{flex-direction:column;align-items:flex-start}}

</style><link rel="stylesheet" href="portal-cliente.css"><link rel="stylesheet" href="projeto-painel.css"></head><body><aside><h2>SANTRELLE</h2><small>ARQUITETURA · Gestão</small><nav id="nav"><button data-page="painel" class="active">▦ Painel geral</button><button data-page="projetos">▤ Projetos ativos</button><button data-page="concluidos">✓ Projetos concluídos</button><button data-page="postobra">▣ Pós-obra</button><button data-page="portal">◫ Área do Cliente</button><button data-page="equipe">♙ Equipe</button><button data-page="modelos">⚙ Etapas e modelos</button></nav></aside><main><div class="top"><div><h1 id="title">Painel geral</h1><div class="muted">Acompanhe projetos, responsáveis e prazos em um só lugar.</div></div><button class="primary" onclick="newProject()">+ Novo projeto</button></div><div id="content"></div><div class="note">Protótipo demonstrativo: os dados desta versão são exemplos e ficam somente neste navegador. Ainda não há conexão com Supabase nem autenticação.</div></main><script>
const seed=[{id:1,name:'Residência Jardim',client:'Cliente exemplo A',owner:'Ana',status:'Em andamento',phase:'Anteprojeto',deadline:'2026-11-12'},{id:2,name:'Apartamento Praia',client:'Cliente exemplo B',owner:'Joyce',status:'Atrasado',phase:'Briefing',deadline:'2026-10-19'},{id:3,name:'Loja Conceito',client:'Cliente exemplo C',owner:'Leonardo',status:'Aguardando aprovação',phase:'Projeto executivo',deadline:'2026-11-02'}];
const initial=[{name:'Briefing',days:3,subs:[{name:'Conversa com cliente',days:1},{name:'Levantamento de necessidades e materiais',days:1},{name:'Consolidar briefing e encaminhar para projeto',days:1}]},{name:'Levantamento',days:2,subs:[{name:'Medição no local',days:1},{name:'Organizar levantamento',days:1}]},{name:'Anteprojeto',days:10,subs:[{name:'Desenvolver proposta',days:7},{name:'Revisão interna',days:3}]},{name:'Projeto executivo',days:20,subs:[{name:'Compatibilizar medidas',days:4},{name:'Detalhamentos técnicos',days:16}]},{name:'Acompanhamento de obra',days:60,subs:[{name:'Planejamento da obra',days:5},{name:'Acompanhamento e visitas',days:55}]}];
let projects=JSON.parse(localStorage.getItem('santrelle_projects')||'null')||seed;let phases=JSON.parse(localStorage.getItem('santrelle_phases')||'null')||initial;let page='painel',filter='Todos',selected=null,registrationEditId=null,teamSelectedOwner=null,schedulePreviewState=null,archiveQuery='',postWorkSelected=null,postWorkEditing=null,postWorkFilter='abertos';let calendarMonth=new Date().getMonth(),calendarYear=new Date().getFullYear(),calendarOwner='Todos',expandedDay=null;let employees=JSON.parse(localStorage.getItem('santrelle_employees')||'null')||[{name:'Ana'},{name:'Joyce'},{name:'Leonardo'}];let deliveries=JSON.parse(localStorage.getItem('santrelle_deliveries')||'[]');let extraHolidays=JSON.parse(localStorage.getItem('santrelle_holidays')||'[]');let postWorks=JSON.parse(localStorage.getItem('santrelle_postobra')||'[]');const el=document.getElementById('content');function save(){localStorage.setItem('santrelle_projects',JSON.stringify(projects));localStorage.setItem('santrelle_phases',JSON.stringify(phases));localStorage.setItem('santrelle_deliveries',JSON.stringify(deliveries));localStorage.setItem('santrelle_holidays',JSON.stringify(extraHolidays));localStorage.setItem('santrelle_employees',JSON.stringify(employees));localStorage.setItem('santrelle_postobra',JSON.stringify(postWorks))}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tag(s){return '<span class="tag '+(s==='Atrasado'?'late':s==='Em andamento'?'active':s==='Concluído'?'good':'waiting')+'">'+esc(s)+'</span>'}function go(p){if(typeof projectDashboardReset==='function')projectDashboardReset();page=p;selected=null;teamSelectedOwner=null;postWorkSelected=null;postWorkEditing=null;if(typeof portalProjectId!=="undefined"){portalProjectId=null;portalView="manager";portalFolderId=null}document.body.classList.remove("portal-is-preview");document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));

/* Pós-obra separado do estado do projeto e persistido no navegador. */
function pwFind(id){return postWorks.find(w=>String(w.id)===String(id))}
function pwProject(w){return projects.find(p=>String(p.id)===String(w.projectId))}
function pwByProject(projectId){return postWorks.find(w=>String(w.projectId)===String(projectId))}
function pwNow(){return new Date().toISOString()}
function pwToday(){const d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())}
function pwId(){return String(Date.now())+'-'+Math.random().toString(36).slice(2,9)}
function pwStats(w){const items=w.items||[],today=pwToday();return {total:items.length,open:items.filter(x=>!x.done).length,done:items.filter(x=>x.done).length,late:items.filter(x=>!x.done&&x.dueDate&&x.dueDate<today).length,waiting:items.filter(x=>!x.done&&x.status==='Aguardando fornecedor').length}}
function pwOpen(id){
 if(!pwFind(id))return;
 page='postobra';selected=null;postWorkSelected=id;postWorkEditing=null;postWorkFilter='abertos';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='postobra'));
 render();if(typeof window!=='undefined'&&typeof window.scrollTo==='function')window.scrollTo(0,0)
}
function pwStart(projectId){
 const p=projects.find(x=>String(x.id)===String(projectId));
 if(!p){alert('Selecione um projeto cadastrado.');return}
 let w=pwByProject(p.id);
 if(!w){w={id:pwId(),projectId:p.id,createdAt:pwNow(),closedAt:null,items:[]};postWorks.push(w);save()}
 pwOpen(w.id)
}
function pwStartSelected(){const id=document.getElementById('pwSelectProject')?.value;if(id)pwStart(id);else alert('Selecione o projeto para iniciar o pós-obra.')}
function pwProjectShortcut(p){
 const w=pwByProject(p.id),stats=w?pwStats(w):null;
 return '<div class="pw-shortcut"><div><strong>Pós-obra</strong><p>'+(w?(w.closedAt?'Acompanhamento encerrado':stats.open+' pendência'+(stats.open===1?'':'s')+' em aberto'):'Nenhum acompanhamento iniciado')+'. Independente da conclusão do projeto.</p></div>'
 +'<button class="secondary" onclick="'+(w?'pwOpen('+esc(JSON.stringify(w.id))+')':'pwStart('+esc(JSON.stringify(p.id))+')')+'">'+(w?'Abrir pós-obra':'Iniciar pós-obra')+'</button></div>'
}
function pwSummary(){
 const all=postWorks.flatMap(w=>w.items||[]),today=pwToday(),active=postWorks.filter(w=>!w.closedAt).length;
 const cards=[['Acompanhamentos ativos',active],['Pendências em aberto',all.filter(x=>!x.done).length],['Atrasadas',all.filter(x=>!x.done&&x.dueDate&&x.dueDate<today).length],['Aguardando fornecedor',all.filter(x=>!x.done&&x.status==='Aguardando fornecedor').length],['Concluídas',all.filter(x=>x.done).length]]
  .map(([label,num])=>'<div class="pw-stat"><span>'+label+'</span><strong>'+num+'</strong></div>').join('');
 const available=projects.filter(p=>!pwByProject(p.id)).sort((a,b)=>String(a.name).localeCompare(String(b.name),'pt-BR'));
 const selector=projects.length?'<div class="pw-create"><label>Iniciar pós-obra de um projeto já cadastrado</label><div class="inline"><select id="pwSelectProject"><option value="">Selecione o projeto</option>'
  +available.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('')+'</select><button class="primary" '+(!available.length?'disabled ':'')+'onclick="pwStartSelected()">+ Iniciar pós-obra</button></div></div>'
  :'<div class="pw-create"><p>É preciso cadastrar um projeto antes de iniciar seu pós-obra.</p><button class="secondary" onclick="newProject()">+ Novo projeto</button></div>';
 const ordered=postWorks.slice().sort((a,b)=>Number(!!a.closedAt)-Number(!!b.closedAt)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
 return '<section class="panel"><h3>Controle interno de pós-obra</h3><p class="muted">Cada ajuste recebe um check independente. O pós-obra continua aberto até todas as pendências serem resolvidas.</p><div class="pw-stats">'+cards+'</div>'+selector+'</section>'
  +'<section class="panel"><h3>Acompanhamentos</h3>'+(ordered.length?'<div class="pw-project-list">'+ordered.map(w=>{
   const p=pwProject(w),stats=pwStats(w);
   return '<button class="pw-project" onclick="pwOpen('+esc(JSON.stringify(w.id))+')"><span><strong>'+esc(p?.name||'Projeto não encontrado')+'</strong><small>'+esc(p?.client||'')+' · '+esc(p?.status||'')+'</small></span>'
    +'<span class="pw-badges"><span class="pw-badge '+(w.closedAt?'pw-good':'pw-active')+'">'+(w.closedAt?'Pós-obra encerrado':'Em acompanhamento')+'</span><span class="pw-badge">'+stats.open+' em aberto</span><span class="pw-badge pw-good">'+stats.done+' concluída'+(stats.done===1?'':'s')+'</span>'
    +(stats.late?'<span class="pw-badge pw-late">'+stats.late+' atrasada'+(stats.late===1?'':'s')+'</span>':'')+'</span><span class="pw-arrow">›</span></button>'
  }).join('')+'</div>':'<div class="pw-empty">Nenhum pós-obra iniciado. Escolha um projeto para começar.</div>')+'</section>';
}
function pwOwnerOptions(current){
 const names=[...new Set([...employees.map(e=>e.name),...(current&&current!=='Não definido'?[current]:[])])];
 return '<option value="">Não definido</option>'+names.map(x=>'<option value="'+esc(x)+'"'+(x===current?' selected':'')+'>'+esc(x)+'</option>').join('')
}
function pwForm(w){
 const item=(w.items||[]).find(x=>String(x.id)===String(postWorkEditing)),status=item?.status||'Pendente';
 const inp=(id,label,value,required)=>'<label for="'+id+'">'+label+(required?' *':'')+'</label><input id="'+id+'" value="'+esc(value||'')+'" '+(required?'required ':'')+'maxlength="280">';
 const statuses=['Pendente','Em andamento','Aguardando fornecedor','Aguardando material','Agendado'];
 return '<form id="pwForm" class="pw-form" onsubmit="pwSaveItem(event,'+esc(JSON.stringify(w.id))+')"><div class="pw-form-title"><h3>'+(item?'Editar pendência':'Adicionar pendência')+'</h3>'
  +(item?'<button class="secondary" type="button" onclick="pwCancelEdit()">Cancelar edição</button>':'')+'</div><div class="pw-fields">'
  +'<div>'+inp('pwEnvironment','Ambiente',item?.environment,true)+'</div>'
  +'<div class="pw-wide">'+inp('pwDescription','Pendência / ajuste necessário',item?.description,true)+'</div>'
  +'<div>'+inp('pwSupplier','Fornecedor',item?.supplier,false)+'</div>'
  +'<div><label for="pwOwner">Responsável interno</label><select id="pwOwner">'+pwOwnerOptions(item?.owner||'')+'</select></div>'
  +'<div><label for="pwDueDate">Prazo (DD/MM/AAAA)</label><input id="pwDueDate" class="br-date-input" type="text" maxlength="10" placeholder="DD/MM/AAAA" inputmode="numeric" value="'+esc(formatDateBR(item?.dueDate||''))+'" oninput="maskDateBR(this)" onblur="validateDateBRInput(this)"></div>'
  +'<div><label for="pwStatus">Andamento</label><select id="pwStatus">'+statuses.map(x=>'<option'+(status===x?' selected':'')+'>'+x+'</option>').join('')+'</select></div>'
  +'<div class="pw-wide"><label for="pwNotes">Observações e contatos</label><textarea id="pwNotes" maxlength="4000" rows="3">'+esc(item?.notes||'')+'</textarea></div>'
  +'</div>'
  +'<p class="muted pw-hint">Registre os ajustes por ambiente, com descrição, responsável, prazo e andamento. O relatório para o cliente apresenta as pendências e seus status.</p>'
  +'<div class="pw-form-actions"><button class="primary" type="submit">'+(item?'Salvar alterações':'Adicionar pendência')+'</button></div></form>'
}
function pwIssue(w,item){
 const done=!!item.done,today=pwToday(),late=!done&&item.dueDate&&item.dueDate<today;
 const status=done?'Concluído':late?'Atrasado':item.status||'Pendente';
 const statusClass=done?'pw-good':late?'pw-late':item.status==='Aguardando fornecedor'?'pw-wait':'pw-active';
 const meta=[item.supplier?'Fornecedor: '+item.supplier:'',item.owner?'Responsável: '+item.owner:'',item.dueDate?'Prazo: '+formatDateBR(item.dueDate):'Sem prazo'].filter(Boolean);

 return '<div class="pw-item '+(done?'pw-item-done':'')+'"><label class="pw-check"><input type="checkbox" '+(done?'checked ':'')+'aria-label="'+esc((done?'Reabrir':'Concluir')+' pendência: '+item.description)+'" onchange="pwToggle('+esc(JSON.stringify(w.id))+','+esc(JSON.stringify(item.id))+',this.checked)">'
  +'<span>'+(done?'Resolvida':'Marcar resolvida')+'</span></label><div class="pw-item-content">'
  +'<div class="pw-item-heading"><div><small>'+esc(item.environment)+'</small><h4>'+esc(item.description)+'</h4></div><span class="pw-badge '+statusClass+'">'+esc(status)+'</span></div>'
  +'<div class="pw-meta">'+meta.map(s=>'<span>'+esc(s)+'</span>').join('')+'</div>'
  +(item.notes?'<p class="pw-notes">'+esc(item.notes)+'</p>':'')
  +(done?'<p class="pw-done-note">✓ Concluída em '+esc(new Date(item.completedAt||item.updatedAt||item.createdAt).toLocaleDateString('pt-BR'))+'</p>':'')
  +'<div class="pw-item-actions">'
  +(w.closedAt?'':'<button class="secondary" onclick="pwEdit('+esc(JSON.stringify(w.id))+','+esc(JSON.stringify(item.id))+')">Editar</button>')
  +(w.closedAt?'':'<button class="secondary" onclick="pwRemove('+esc(JSON.stringify(w.id))+','+esc(JSON.stringify(item.id))+')">Excluir</button>')
  +(item.history?.length?'<details><summary>Histórico ('+item.history.length+')</summary>'
    +item.history.slice().reverse().slice(0,25).map(h=>'<p>'+esc(new Date(h.at).toLocaleString('pt-BR'))+' · '+esc(h.text)+'</p>').join('')+'</details>':'')
  +'</div></div></div>';
}
function pwDetail(w){
 const p=pwProject(w);if(!p)return '<section class="panel"><p>Projeto vinculado não encontrado.</p><button onclick="postWorkSelected=null;render()">Voltar</button></section>';
 const stats=pwStats(w),open=(w.items||[]).filter(x=>!x.done).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
 const done=(w.items||[]).filter(x=>x.done).sort((a,b)=>String(b.completedAt||'').localeCompare(String(a.completedAt||'')));
 const shown=postWorkFilter==='todos'?[...open,...done]:postWorkFilter==='concluidos'?done:open;
 const tab=(value,label)=>'<button class="pw-tab '+(postWorkFilter===value?'pw-tab-selected':'')+'" onclick="pwFilter('+esc(JSON.stringify(value))+')">'+label+'</button>';
 return '<section class="panel"><div class="pw-header"><button class="secondary" onclick="postWorkSelected=null;postWorkEditing=null;render()">← Voltar aos pós-obras</button><div class="pw-header-actions"><button id="pwGeneratePDF" class="primary" type="button" onclick="pwGenerateClientPDF('+esc(JSON.stringify(w.id))+')">Gerar PDF para o cliente</button><button class="secondary" onclick="openProject('+esc(JSON.stringify(p.id))+')">Ver projeto ↗</button></div></div>'
  +'<h2>'+esc(p.name)+'</h2><p class="muted">Cliente: '+esc(p.client||'')+' · Projeto: '+esc(p.status||'')+' — o pós-obra tem situação independente.</p>'
  +(w.closedAt?'<div class="pw-closed"><strong>✓ Acompanhamento encerrado em '+esc(new Date(w.closedAt).toLocaleDateString('pt-BR'))+'</strong><p>O histórico e os checks permanecem disponíveis.</p></div>':'')
  +'<div class="pw-counts"><span><strong>'+stats.open+'</strong> abertas</span><span><strong>'+stats.late+'</strong> atrasadas</span><span><strong>'+stats.waiting+'</strong> aguardando fornecedor</span><span><strong>'+stats.done+'</strong> concluídas</span></div>'
  +'<div class="pw-close">'+(w.closedAt?'<button class="secondary" onclick="pwReopen('+esc(JSON.stringify(w.id))+')">Reabrir acompanhamento</button>':'<button class="secondary" onclick="pwClose('+esc(JSON.stringify(w.id))+')" '+(!stats.total||stats.open?'disabled ':'')+'>✓ Encerrar acompanhamento</button>')
  +'<span class="muted">'+(w.closedAt?'O projeto principal não é alterado.':stats.open?'É necessário marcar todas as pendências antes de encerrar.':stats.total?'Todas resolvidas: acompanhamento pronto para encerrar.':'Cadastre a primeira pendência abaixo.')+'</span></div></section>'
  +(w.closedAt?'':'<section class="panel">'+pwForm(w)+'</section>')
  +'<section class="panel"><div class="pw-list-header"><h3>Pendências</h3><div class="pw-tabs">'+tab('abertos','Em aberto ('+stats.open+')')+tab('concluidos','Concluídas ('+stats.done+')')+tab('todos','Todas ('+stats.total+')')+'</div></div>'
  +(shown.length?'<div class="pw-items">'+shown.map(item=>pwIssue(w,item)).join('')+'</div>':'<div class="pw-empty">'+(postWorkFilter==='concluidos'?'Nenhuma pendência concluída.':'Nenhuma pendência nesta visualização.')+'</div>')+'</section>';
}
function renderPostWork(){
 const w=pwFind(postWorkSelected);
 el.innerHTML=w?pwDetail(w):pwSummary();
}
function pwFilter(value){if(['abertos','concluidos','todos'].includes(value)){postWorkFilter=value;render()}}
function pwEdit(workId,itemId){
 const w=pwFind(workId);if(!w||w.closedAt||!w.items.some(x=>String(x.id)===String(itemId)))return;
 postWorkEditing=itemId;render();
 const form=document.getElementById('pwForm');if(form&&typeof form.scrollIntoView==='function')form.scrollIntoView({behavior:'smooth',block:'start'})
}
function pwCancelEdit(){postWorkEditing=null;render()}
function pwSaveItem(event,workId){
 event?.preventDefault?.();
 const w=pwFind(workId);if(!w||w.closedAt)return;
 const field=id=>String(document.getElementById(id)?.value||'').trim();
 const environment=field('pwEnvironment'),description=field('pwDescription'),dueDate=parseDateBR(field('pwDueDate'));
 if(!environment||!description){alert('Informe o ambiente e a pendência.');return}
 if(dueDate===null){alert('Use uma data válida DD/MM/AAAA ou deixe o prazo em branco.');return}
 const existing=w.items.find(x=>String(x.id)===String(postWorkEditing));
 const at=pwNow();
 const details={environment,description,supplier:field('pwSupplier'),owner:field('pwOwner'),dueDate,status:field('pwStatus'),notes:field('pwNotes'),updatedAt:at};
 if(existing){
  Object.assign(existing,details);
  existing.history=existing.history||[];
  existing.history.push({at,text:'Informações atualizadas'});
 }else{
  w.items.push({id:pwId(),...details,reference:'',done:false,createdAt:at,completedAt:null,history:[{at,text:'Pendência cadastrada'}]});
 }
 postWorkEditing=null;
 postWorkFilter='abertos';
 save();render();
}

function pwToggle(workId,itemId,checked){
 const w=pwFind(workId),item=w?.items?.find(x=>String(x.id)===String(itemId));if(!item||w.closedAt)return;
 const done=!!checked;if(item.done===done)return;
 const at=pwNow();item.done=done;item.completedAt=done?at:null;item.updatedAt=at;
 item.history=item.history||[];item.history.push({at,text:done?'Pendência marcada como concluída':'Pendência reaberta'});
 save();render()
}
async function pwRemove(workId,itemId){
 const w=pwFind(workId),item=w?.items?.find(x=>String(x.id)===String(itemId));
 if(!w||w.closedAt||!item)return;
 if(!confirm('Excluir a pendência "'+item.description+'" e seu histórico? Se houver anexos antigos vinculados, eles também serão removidos deste navegador.'))return;
 try{
  if(typeof pwFileDeleteForItem==='function')await pwFileDeleteForItem(itemId);
 }catch(err){

function changeProjectStatus(p,newStatus,origin){

  p.completedAt=iso(now.getFullYear(),now.getMonth()+1,now.getDate());

/* Responsabilidade pertence a cada subetapa do projeto, nunca à etapa inteira. */
function projectSteps(p){return p.steps||phases}
function projectSubOwner(p,i,j){
 const sub=projectSteps(p)[i]?.subs?.[j];
 if(!sub)return 'Não definido';
 if(Object.prototype.hasOwnProperty.call(sub,'owner'))return sub.owner||'Não definido';
 // Preserva atribuições feitas antes da migração da etapa para as subetapas.
 return projectSteps(p)[i]?.owner||p.schedule?.[i]?.owner||'Não definido';
}
function subIsOptionalRevision(step,sub){
 if(!step||!sub||!registrationHasOptionalReview(step))return false;
 return sub.reviewOptional===true||(!Object.prototype.hasOwnProperty.call(sub,'reviewOptional')&&/revis/i.test((sub.name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')));
}
function subIsCompatibility(step,sub){
 if(!step||!sub||!registrationIsCompatibility(step))return false;
 return sub.compatibility===true||(!Object.prototype.hasOwnProperty.call(sub,'compatibility')&&/compatibil/i.test((sub.name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')));
}
function substepDueDate(p,i,j){
 const stage=p.schedule?.[i],step=projectSteps(p)[i],sub=step?.subs?.[j];
 if(!stage||!sub||!/^\d{4}-\d{2}-\d{2}$/.test(stage.start||''))return '';
 if(subIsOptionalRevision(step,sub))return stage.revisionRequested?stage.revisionDeadline||'':'';
 if(subIsCompatibility(step,sub))return stage.clientDeadline||stage.deadline||'';
 const eligible=(step.subs||[]).map((s,k)=>({s,k})).filter(x=>!subIsOptionalRevision(step,x.s)&&!subIsCompatibility(step,x.s));
 const position=eligible.findIndex(x=>x.k===j);if(position<0)return '';
 const total=eligible.reduce((sum,x)=>sum+Math.max(1,Math.floor(Number(x.s.days)||1)),0);
 const until=eligible.slice(0,position+1).reduce((sum,x)=>sum+Math.max(1,Math.floor(Number(x.s.days)||1)),0);
 const days=Math.max(1,Math.floor(Number(stage.days)||1));
 if(position===eligible.length-1&&/^\d{4}-\d{2}-\d{2}$/.test(stage.deadline||''))return stage.deadline;
 return addBusinessDays(stage.start,Math.min(days-1,Math.max(0,Math.ceil(until/total*days)-1)));
}
function projectSubstepEntries(p){
 const entries=[],steps=projectSteps(p);
 for(let i=0;i<steps.length;i++){
  for(let j=0;j<(steps[i]?.subs||[]).length;j++){
   const sub=steps[i].subs[j],owner=projectSubOwner(p,i,j),date=substepDueDate(p,i,j),stage=p.schedule?.[i];
   if(!date||!owner||owner==='Não definido'||owner==='Sem responsável')continue;
   const isRevision=subIsOptionalRevision(steps[i],sub);
   const completed=sub.completed===true||(sub.completed===undefined&&(isRevision?!!stage?.revisionCompleted:!!stage?.completed));
   entries.push({id:'u'+p.id+'_'+i+'_'+j,name:(sub.name||'Subetapa')+' · '+steps[i].name+' · '+p.name,
    owner,date,projectId:p.id,stageIndex:i,subIndex:j,completed,kind:'suboffice'});
  }
 }
 return entries;
}
function projectAssignedOwners(p){
 const names=new Set();
 const steps=projectSteps(p);
 for(let i=0;i<steps.length;i++)for(let j=0;j<(steps[i].subs||[]).length;j++){
  const name=projectSubOwner(p,i,j);
  if(name&&name!=='Não definido'&&name!=='Sem responsável')names.add(name);
 }
 if(!names.size&&!p.schedule?.length&&p.owner&&p.owner!=='Não definido')names.add(p.owner);
 return [...names];
}

 for(let owner of source){
  if(typeof owner!=='string')continue;

  if(!clean||clean==='Não definido'||clean==='Sem responsável')continue;
  const key=clean.toLocaleLowerCase('pt-BR');

 }

}

function iso(y,m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function parseISO(s){let a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)}
/* Datas visíveis em DD/MM/AAAA; armazenamento e cálculos permanecem em AAAA-MM-DD. */
function formatDateBR(value){
 const v=String(value||'');

function parseDateBR(value){

 const d=new Date(year,month-1,day,12);

function easter(y){let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k+7)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=(h+l-7*m+114)%31+1;return new Date(y,month-1,day,12)}

/* Feriados oficiais do Brasil, estado de São Paulo e município de Santos.
   Fontes: Portaria MGI 11.460/2025, Lei estadual SP 9.497/1997 e
   art. 245 da Lei Orgânica de Santos / Decreto municipal 11.111/2025.
   Pontos facultativos não entram automaticamente no cálculo. */
const SANTRELLE_HOLIDAY_CALENDAR_VERSION='Santos-SP-2026-v1';
const officialHolidayCache=new Map();
function officialHolidays(y){
 if(officialHolidayCache.has(y))return officialHolidayCache.get(y);
 const holidaysByDate={};
 const set=(mmdd,name,type)=>holidaysByDate[mmdd]={name,type};
 const fixedNational={
  '01-01':'Confraternização Universal',
  '04-21':'Tiradentes',
  '05-01':'Dia do Trabalho',
  '09-07':'Independência do Brasil',
  '10-12':'Nossa Senhora Aparecida',
  '11-02':'Finados',
  '11-15':'Proclamação da República',
  '11-20':'Dia Nacional de Zumbi e da Consciência Negra',
  '12-25':'Natal'
 };
 for(const [date,name] of Object.entries(fixedNational))set(date,name,'nacional');
 set('07-09','Revolução Constitucionalista de 1932','estadual');
 set('01-26','Aniversário da Cidade de Santos','municipal');
 set('09-08','Nossa Senhora do Monte Serrat — Padroeira de Santos','municipal');
 const pascoa=easter(y);
 set(offsetDay(pascoa,-2).slice(5),'Sexta-feira Santa (Paixão de Cristo)','municipal');
 set(offsetDay(pascoa,60).slice(5),'Corpus Christi','municipal');
 officialHolidayCache.set(y,holidaysByDate);
 return holidaysByDate
}
function holidayInfo(date){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return null;
 const official=officialHolidays(Number(date.slice(0,4)))[date.slice(5)];
 const extra=extraHolidays.filter(x=>x.date===date);
 if(official)return {...official,other:extra.map(x=>x.name)};
 if(extra.length)return {name:extra.map(x=>x.name).join(' / '),type:'escritorio',other:[]};
 return null
}
function holidays(y){
 const byName=Object.fromEntries(Object.entries(officialHolidays(y)).map(([day,info])=>[day,info.name]));
 for(const folga of extraHolidays)if(folga.date.startsWith(String(y)))byName[folga.date.slice(5)]=[byName[folga.date.slice(5)],folga.name].filter(Boolean).join(' / ');
 return byName
}
function holidayName(date){
 const info=holidayInfo(date);
 return info?[info.name,...info.other].join(' / '):''
}
function businessDay(date){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return false;
 const d=parseISO(date);
 return d.getDay()!==0&&d.getDay()!==6&&!holidayInfo(date)
}
function nextBusiness(date){let d=date;for(let i=0;i<370&&!businessDay(d);i++)d=offsetDay(parseISO(d),1);return d}
function addBusinessDays(start,count){let d=start;for(let i=0;i<count;i++){d=offsetDay(parseISO(d),1);d=nextBusiness(d)}return d}
function calendarEntries(){let entries=[];for(let p of projects){let completed=p.status==='Concluído';let valid=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'');if(valid(p.startDate))entries.push({id:'p'+p.id,name:'Início: '+p.name,owner:p.owner,date:p.startDate,projectId:p.id,completed:true,kind:'start'});if(valid(p.officeDate))entries.push({id:'p'+p.id,name:'Prazo escritório: '+p.name,owner:p.owner,date:p.officeDate,projectId:p.id,completed,kind:'office'});let client=p.clientDate||(valid(p.deadline)?p.deadline:'');if(valid(client))entries.push({id:'p'+p.id,name:'Entrega cliente: '+p.name,owner:p.owner,date:client,projectId:p.id,completed,kind:'client'});for(let [i,step] of (p.schedule||[]).entries()){if(valid(step.deadline))entries.push({id:'s'+p.id+'_'+i,name:'Etapa escritório: '+step.name+' · '+p.name,owner:projectSteps(p)?.length?'Equipe':(step.owner||p.owner),date:step.deadline,projectId:p.id,completed:completed||!!step.completed,kind:'office'});if(valid(step.clientDeadline))entries.push({id:'s'+p.id+'_'+i,name:(registrationIsCompatibility(step)&&step.contractualParts?.secondary>0?'Entrega e compatibilização: '+step.name:'Apresentação ao cliente: '+step.name)+' · '+p.name,owner:projectSteps(p)?.length?'Equipe':(step.owner||p.owner),date:step.clientDeadline,projectId:p.id,completed:completed||!!step.completed,kind:'client'});if(registrationHasOptionalReview(step)&&step.revisionRequested&&valid(step.revisionDeadline))entries.push({id:'r'+p.id+'_'+i,name:'Revisão solicitada: '+step.name+' · '+p.name,owner:projectSteps(p)?.length?'Equipe':(step.owner||p.owner),date:step.revisionDeadline,projectId:p.id,completed:completed||!!step.revisionCompleted,kind:'client'})}entries.push(...projectSubstepEntries(p).map(entry=>({...entry,completed:completed||!!entry.completed})))}return entries.concat(deliveries.map(d=>({...d,id:'d'+d.id,kind:'delivery',completed:!!d.completed||(projects.some(p=>String(p.id)===String(d.projectId)&&p.status==='Concluído'))})),pwEvents())}
function monthHolidayHTML(y,m){
 const total=new Date(y,m+1,0).getDate(),days=[];
 for(let n=1;n<=total;n++){
  const date=iso(y,m+1,n),info=holidayInfo(date);
  if(info)days.push({date,...info});
 }
 const labels={nacional:'Nacional',estadual:'Estadual · SP',municipal:'Municipal · Santos',escritorio:'Folga do escritório'};
 return '<div class="holiday-month-overview"><div class="holiday-month-heading"><strong>Feriados e folgas deste mês</strong><span class="muted">'+days.length+' '+(days.length===1?'data':'datas')+'</span></div>'
 +(days.length?'<div class="holiday-month-list">'+days.map(h=>'<div class="holiday-month-item"><span class="holiday-month-date">'+formatDateBR(h.date)+'</span><span class="holiday-month-name">'+esc([h.name,...h.other].join(' / '))+extraHolidays.map((x,index)=>({x,index})).filter(a=>a.x.date===h.date).map(a=>' <button class="holiday-month-delete" onclick="removeOfficeHoliday('+a.index+')" title="Remover folga do escritório">Remover folga</button>').join('')+'</span><span class="holiday-type holiday-type-'+h.type+'">'+labels[h.type]+'</span></div>').join('')+'</div>':'<p class="muted" style="margin:10px 0 0">Nenhum feriado ou folga neste mês.</p>')
 +'<p class="holiday-month-footnote">Os feriados nacionais, estaduais de São Paulo e municipais de Santos não contam como dias úteis. Carnaval, emendas e outros pontos facultativos só serão descontados quando cadastrados como folga do escritório.</p></div>';
}
function calendarHTML(){
 const first=new Date(calendarYear,calendarMonth,1),offset=(first.getDay()+6)%7,total=new Date(calendarYear,calendarMonth+1,0).getDate();
 const owners=['Todos',...new Set([...employees.map(e=>e.name),...projects.flatMap(p=>projectAssignedOwners(p)),...deliveries.map(d=>d.owner)].filter(Boolean))];
 const entries=calendarEntries().filter(e=>calendarOwner==='Todos'||e.owner===calendarOwner);
 const today=new Date(),todayISO=iso(today.getFullYear(),today.getMonth()+1,today.getDate());
 const kindClass=e=>e.kind==='start'?'cal-start':e.kind==='office'||e.kind==='suboffice'?'cal-office':e.kind==='client'?'cal-client':'';
 const eventHTML=e=>'<button class="cal-event '+kindClass(e)+(!e.completed&&e.date<todayISO?' overdue':'')+'" title="'+esc(e.name+' · '+e.owner)+'" onclick="calendarOpen(\''+e.id+'\')"><span class="cal-owner">'+esc(e.owner||'Sem responsável')+'</span><span>'+esc(e.name)+'</span></button>';
 let days='';
 for(let i=0;i<Math.ceil((offset+total)/7)*7;i++){
  const date=offsetDay(first,i-offset),parsed=parseISO(date),n=parsed.getDate();
  const outside=parsed.getMonth()!==calendarMonth,info=holidayInfo(date),holiday=holidayName(date),off=!businessDay(date);
  const items=entries.filter(e=>e.date===date).sort((a,b)=>(a.owner||'').localeCompare(b.owner||'')||({start:0,stage:1,office:2,client:3,delivery:4}[a.kind]??5)-({start:0,stage:1,office:2,client:3,delivery:4}[b.kind]??5));
  const expanded=expandedDay===date,limit=2,visible=expanded?items:items.slice(0,limit);
  days+='<div class="cal-day '+(outside?'other ':'')+(off?'off ':'')+(date===todayISO?'today ':'')+(info?'holiday-'+info.type:'')+'"><div class="cal-daytop"><span class="cal-number">'+n+'</span>'+(items.length?'<span class="cal-count">'+items.length+'</span>':'')+'</div>'
   +(holiday?'<div class="cal-holiday" title="'+esc(holiday)+'">'+esc(holiday)+'</div>':'')
   +'<div class="cal-events">'+visible.map(eventHTML).join('')+'</div>'
   +(items.length?'<button class="cal-more '+(items.length<=limit?'cal-more-mobile':'')+'" onclick="toggleCalendarDay(\''+date+'\')">'+(expanded?'Mostrar menos':items.length>limit?'+'+(items.length-limit)+' atividades':'Ver '+items.length+' '+(items.length===1?'atividade':'atividades'))+'</button>':'')
   +'</div>';
 }
 const selected=expandedDay?entries.filter(e=>e.date===expandedDay):[];
 return '<section class="panel"><div class="calendar-head"><div><h3 style="margin-bottom:4px">Calendário de entregas</h3><div class="muted">Prazos internos e entregas · Feriados Brasil, SP e Santos incluídos</div></div>'
 +'<div class="cal-controls"><button class="secondary" onclick="shiftMonth(-1)">‹</button><strong>'+first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'</strong><button class="secondary" onclick="shiftMonth(1)">›</button>'
 +'<select onchange="calendarOwner=this.value;render()">'+owners.map(o=>'<option '+(o===calendarOwner?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select><button class="primary" onclick="addDelivery()">+ Entrega</button><button class="secondary" onclick="addHoliday()">+ Folga do escritório</button></div></div>'
 +'<div class="calendar-grid">'+['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>'<div class="weekday">'+x+'</div>').join('')+days+'</div>'
 +(expandedDay&&selected.length?'<div class="cal-agenda"><div class="inline"><strong style="flex:1">Atividades de '+formatDateBR(expandedDay)+'</strong><button class="secondary" onclick="toggleCalendarDay(null)">Fechar</button></div><div class="cal-agenda-list">'+selected.map(eventHTML).join('')+'</div></div>':'')
 +'<div class="cal-legend">Feriados e folgas aparecem destacados · Início, prazos internos, entregas ao cliente e atrasos têm cores distintas. Dias não úteis são desconsiderados no cálculo.</div>'
 +monthHolidayHTML(calendarYear,calendarMonth)+'</section>';
}
function toggleCalendarDay(date){expandedDay=expandedDay===date?null:date;render()}
function shiftMonth(n){expandedDay=null;let d=new Date(calendarYear,calendarMonth+n,1);calendarYear=d.getFullYear();calendarMonth=d.getMonth();render()}
function addDelivery(){
 let name=prompt('O que precisa ser entregue?');if(!name?.trim())return;
 let owner=prompt('Responsável pela entrega:','')||'Não definido';
 let project=prompt('Número do projeto (opcional):\n'+projects.map(p=>p.id+' - '+p.name).join('\n'),'')||'';
 let defaultDate=iso(calendarYear,calendarMonth+1,Math.min(new Date().getDate(),28));
 let raw=promptDateBR('Data prevista',defaultDate);if(!raw)return;
 let date=nextBusiness(raw);
 if(date!==raw)alert('A data escolhida não é um dia útil. Ajustei para '+formatDateBR(date)+'.');
 deliveries.push({id:Date.now(),name:name.trim(),owner,date,projectId:projects.some(p=>String(p.id)===project)?+project:null,completed:false});
 save();calendarYear=+date.slice(0,4);calendarMonth=+date.slice(5,7)-1;render()
}
function invalidateProjectSchedulesForHolidays(){
 let count=0;
 for(const p of projects){if(p.schedule?.length){p.holidayCalendarVersion='';count++}}
 return count
}
function addHoliday(){
 let date=promptDateBR('Data da folga ou ponto facultativo do escritório');
 if(!date)return;
 let name=prompt('Nome da folga do escritório:');if(!name?.trim())return;
 if(extraHolidays.some(x=>x.date===date)&&!confirm('Já existe uma folga nesta data. Deseja cadastrar outra?'))return;
 extraHolidays.push({date,name:name.trim()});
 for(const d of deliveries)if(!d.completed&&!businessDay(d.date))d.date=nextBusiness(d.date);
 const affected=invalidateProjectSchedulesForHolidays();
 save();render();
 if(affected)alert('Folga cadastrada. Para atualizar as datas dos '+affected+' cronogramas existentes, abra cada projeto e clique em Gerar cronograma. Os prazos anteriores foram preservados.')
}
function removeOfficeHoliday(index){
 const item=extraHolidays[index];if(!item)return;
 if(!confirm('Remover a folga "'+item.name+'" de '+formatDateBR(item.date)+'?'))return;
 extraHolidays.splice(index,1);
 const affected=invalidateProjectSchedulesForHolidays();
 save();render();
 if(affected)alert('Folga removida. Os cronogramas existentes continuam com as datas antigas até você clicar em Gerar cronograma dentro de cada projeto.')
}
function calendarOpen(id){
 let e=calendarEntries().find(x=>x.id===id);if(!e)return;
 if(e.kind==='postwork'){pwOpen(e.postWorkId);return}
 if(id[0]==='p'||id[0]==='s'||id[0]==='r'||id[0]==='u'){openProject(e.projectId);return}
 let choice=prompt(e.name+'\nResponsável: '+e.owner+'\nPrazo: '+formatDateBR(e.date)+'\n\nDigite 1 para concluir, 2 para reagendar, 3 para abrir projeto ou 4 para excluir:');
 let d=deliveries.find(x=>x.id===+id.slice(1));if(!d)return;
 if(choice==='1')d.completed=true;
 else if(choice==='2'){let date=promptDateBR('Nova data',d.date);if(!date)return;d.date=nextBusiness(date)}
 else if(choice==='3'&&d.projectId){openProject(d.projectId);return}
 else if(choice==='4'&&confirm('Excluir esta entrega?'))deliveries=deliveries.filter(x=>x!==d);
 save();render()
}
function addEmployee(){let name=prompt('Nome do funcionário:');if(!name?.trim())return;name=name.trim();if(employees.some(e=>e.name.toLowerCase()===name.toLowerCase())){alert('Funcionário já cadastrado.');return}employees.push({name});save();render()}function removeEmployee(name){if(!confirm('Excluir '+name+' da lista da equipe? Os projetos e entregas existentes continuarão vinculados ao nome.'))return;employees=employees.filter(e=>e.name!==name);save();render()}function phaseOfficeDays(p){return (p.subs||[]).reduce((total,s)=>total+Math.max(1,Math.floor(Number(s.days)||1)),0)}function models(){el.innerHTML='<section class="panel"><h3>Modelo padrão de etapas e subetapas</h3><p class="muted">O prazo do escritório é a soma das subetapas. O prazo do cliente soma os dias adicionais ao prazo interno. Todos em dias úteis.</p>'+phases.map((p,i)=>'<div class="phase"><div class="inline"><strong>'+esc(p.name)+'</strong><span class="muted">Prazo do escritório: <strong>'+phaseOfficeDays(p)+' dias úteis</strong></span><label>Dias adicionais até entrega ao cliente <input type="number" min="0" style="width:75px" value="'+(p.clientExtraDays||0)+'" onchange="setClientExtraDays('+i+',this.value)"> dias</label><span class="muted">Total cliente: '+(phaseOfficeDays(p)+Number(p.clientExtraDays||0))+' dias úteis</span><button class="secondary" onclick="renamePhase('+i+')">Renomear</button><button class="secondary" onclick="movePhase('+i+',-1)">↑</button><button class="secondary" onclick="movePhase('+i+',1)">↓</button><button class="secondary" onclick="removePhase('+i+')">Excluir</button></div>'+p.subs.map((s,j)=>'<div class="sub"><span>'+esc(s.name)+'</span><div class="inline"><input aria-label="Dias úteis" type="number" min="1" style="width:75px" value="'+s.days+'" onchange="setSubDays('+i+','+j+',this.value)"> dias <button class="secondary" onclick="renameSub('+i+','+j+')">Editar</button><button class="secondary" onclick="moveSub('+i+','+j+')">Mover</button><button class="secondary" onclick="removeSub('+i+','+j+')">×</button></div></div>').join('')+'<button class="secondary" onclick="addSub('+i+')">+ Adicionar subetapa</button></div>').join('')+'<button class="primary" onclick="addPhase()">+ Adicionar etapa</button></section>'}function setClientExtraDays(i,v){phases[i].clientExtraDays=Math.max(0,Math.floor(Number(v)||0));save();render()}function setSubDays(i,j,v){phases[i].subs[j].days=Math.max(1,+v||1);save();render()}function addPhase(){let name=prompt('Nome da nova etapa:');if(!name?.trim())return;let days=+(prompt('Duração prevista em dias úteis:', '3')||3);phases.push({name:name.trim(),days:Math.max(1,days),clientExtraDays:0,subs:[]});save();render()}function addSub(i){let name=prompt('Nome da nova subetapa:');if(!name?.trim())return;let days=+(prompt('Duração prevista em dias úteis:', '1')||1);phases[i].subs.push({name:name.trim(),days:Math.max(1,days)});save();render()}function renamePhase(i){let v=prompt('Nome da etapa:',phases[i].name);if(v?.trim()){phases[i].name=v.trim();save();render()}}function renameSub(i,j){let v=prompt('Nome da subetapa:',phases[i].subs[j].name);if(v?.trim()){phases[i].subs[j].name=v.trim();save();render()}}function removePhase(i){if(confirm('Excluir etapa e todas as subetapas?')){phases.splice(i,1);save();render()}}function removeSub(i,j){phases[i].subs.splice(j,1);save();render()}function movePhase(i,d){let n=i+d;if(n<0||n>=phases.length)return;[phases[i],phases[n]]=[phases[n],phases[i]];save();render()}function moveSub(i,j){let to=prompt('Mover para qual etapa?\n'+phases.map((p,k)=>(k+1)+' - '+p.name).join('\n'),String(i+1));let k=+to-1;if(!phases[k])return;phases[k].subs.push(phases[i].subs.splice(j,1)[0]);save();render()}
function newProject(){registrationEditId=null;selected=null;page='cadastro';render();window.scrollTo(0,0)}
function editRegistration(id){if(!projects.some(p=>p.id===id))return;registrationEditId=id;selected=null;page='cadastro';render();window.scrollTo(0,0)}
function cancelRegistration(){registrationEditId=null;go('projetos')}
function defaultRegistrationSteps(){
 // Cada cliente recebe uma cópia de todas as subetapas do modelo do escritório.
 // Responsáveis e estados ficam independentes por projeto.
 const normalize=name=>String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const definitions=[
  {name:'Levantamento',match:'levantamento',fallback:[{name:'Levantamento',days:2}]},
  {name:'Estudo preliminar',match:'estudo preliminar',fallback:[{name:'Desenvolvimento do estudo preliminar',days:7},{name:'Revisão',days:3}]},
  {name:'Anteprojeto',match:'anteprojeto',fallback:[{name:'Desenvolvimento do anteprojeto',days:7},{name:'Revisão',days:3}]},
  {name:'Projeto executivo',match:'executivo',fallback:[{name:'Desenvolvimento do executivo',days:16},{name:'Compatibilização com projeto dos móveis planejados',days:4}]}
 ];
 return definitions.map(def=>{
  const model=phases.find(p=>normalize(p.name).includes(def.match));
  const subs=(model?.subs?.length?model.subs:def.fallback).map(sub=>({
   name:String(sub.name||'Subetapa'),
   days:Math.max(1,Math.floor(Number(sub.days)||1)),
   owner:'Não definido',
   ...(sub.reviewOptional===true?{reviewOptional:true}:{}),
   ...(sub.compatibility===true?{compatibility:true}:{})
  }));
  return {name:def.name,subs,clientExtraDays:0};
 })
}
function registrationStageLabel(step){let n=(step?.name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();if(n.includes('estudo preliminar'))return 'Estudo preliminar';if(n.includes('anteprojeto'))return 'Anteprojeto';if(n.includes('executivo'))return 'Projeto executivo';return step?.name||'Etapa'}
function registrationHasSecondary(step){let n=registrationStageLabel(step).toLowerCase();return n.includes('estudo preliminar')||n.includes('anteprojeto')||n.includes('executivo')}
function registrationSecondaryLabel(step){let n=registrationStageLabel(step).toLowerCase();if(n.includes('estudo preliminar'))return 'Revisão do estudo preliminar';if(n.includes('anteprojeto'))return 'Revisão do anteprojeto';if(n.includes('executivo'))return 'Compatibilização com projeto dos móveis planejados';return ''}
function registrationContractParts(step){
 if(!step)return {main:1,secondary:0};
 let old=Number(step.contractualDays)>=1?Math.floor(Number(step.contractualDays)):Math.max(1,phaseOfficeDays(step)+Math.max(0,Number(step.clientExtraDays)||0));
 if(step.contractualParts&&Number(step.contractualParts.main)>=1){
   let main=Math.max(1,Math.floor(Number(step.contractualParts.main))),secondary=registrationHasSecondary(step)?Math.max(0,Math.floor(Number(step.contractualParts.secondary)||0)):0;
   return {main,secondary};
 }
 if(!registrationHasSecondary(step))return {main:old,secondary:0};
 let secondary=Math.min(Math.max(0,Math.floor(Number(step.subs?.at(-1)?.days)||0)),Math.max(0,old-1));
 return {main:old-secondary,secondary};
}
function registrationIsCompatibility(step){return registrationStageLabel(step).toLowerCase().includes('executivo')}
function registrationHasOptionalReview(step){return registrationHasSecondary(step)&&!registrationIsCompatibility(step)}
function registrationContractDays(step){let p=registrationContractParts(step);return p.main+(registrationIsCompatibility(step)?p.secondary:0)}
function registrationSteps(){let p=projects.find(x=>x.id===registrationEditId);return p?.steps?.length?p.steps:defaultRegistrationSteps()}

return '<label class="reg-field'+(wide?' reg-wide':'')+'"><span>'+label+(required?' <span class="reg-required">*</span>':'')+'</span><input id="reg_'+key+'" type="'+kind+'" name="'+key+'" value="'+esc(value??'')+'"'+attrs+' maxlength="350"></label>'
}

function registrationForm(){
let p=projects.find(x=>x.id===registrationEditId),info=p?.clientRegistration||{},condo=p?.condominium||{},steps=registrationSteps();
let stageHTML='<div class="reg-contract-table"><div class="reg-contract-header"><span>Etapa / atividade</span><span>Prazo contratual (dias úteis)</span></div>'+steps.map((stage,i)=>{

function buildScheduleForRegistration(p,start){
 let cursor=nextBusiness(start),previous=new Map((p.schedule||[]).map(s=>[s.name,s]));
 p.startDate=cursor;p.schedule=[];
 let awaitingClient=false;
 for(let i=0;i<p.steps.length;i++){
  const step=p.steps[i],parts=registrationContractParts(step),base=registrationContractDays(step);
  const norm=String(step.name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const isStudy=norm.includes('estudo preliminar');
  const manual=p.clientTimelineDates?.['step_'+i]?.start;
  // Depois da primeira apresentação do estudo preliminar, as etapas
  // não recebem datas automaticamente: dependem de agendamento explícito.
  const stageStart=awaitingClient?(manual&&businessDay(manual)?manual:''):cursor;
  const end=stageStart?addBusinessDays(stageStart,parts.main-1):'';
  const clientDeadline=stageStart?addBusinessDays(stageStart,base-1):'';
  const before=previous.get(step.name)||{};
  const revisionRequested=registrationHasOptionalReview(step)&&!!(step.revisionRequested??before.revisionRequested);
  const reviewDays=revisionRequested?parts.secondary:0;
  const revisionStart=reviewDays&&clientDeadline?nextBusiness(offsetDay(parseISO(clientDeadline),1)):'';
  const revisionDeadline=reviewDays&&revisionStart?addBusinessDays(revisionStart,reviewDays-1):'';
  p.schedule.push({name:step.name,owner:step.owner||before.owner||'Não definido',start:stageStart,deadline:end,clientDeadline,days:parts.main,contractualDays:base,contractualParts:parts,clientExtraDays:0,completed:!!before.completed,history:before.history||[],revisionRequested,revisionStart,revisionDeadline,revisionCompleted:revisionRequested?!!before.revisionCompleted:false});
  if(isStudy)awaitingClient=true;
  if(!awaitingClient&&clientDeadline)cursor=nextBusiness(offsetDay(parseISO(revisionDeadline||clientDeadline),1));
 }
 p.officeDate=p.schedule.at(-1)?.deadline||'';
 p.clientDate=p.schedule.at(-1)?.revisionDeadline||p.schedule.at(-1)?.clientDeadline||'';
 p.deadline=p.clientDate||'A definir';
 p.phase=p.schedule.find(s=>!s.completed)?.name||p.schedule[0]?.name||'A definir';
 p.holidayCalendarVersion=SANTRELLE_HOLIDAY_CALENDAR_VERSION;
}

 let main=Math.max(1,Math.floor(Number(val('contract_'+i+'_main'))||1));

});
let contractChanged=!!old&&steps.some((step,i)=>{

buildScheduleForRegistration(p,startDate);p.scheduleVersion=3
