<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Santrelle Arquitetura</title><meta name="theme-color" content="#233d40"><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#24343a;background:#f5f6f3}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}aside{background:#203b3d;color:white;width:240px;min-height:100vh;padding:28px 18px;position:fixed}aside h2{font-size:21px;margin:0 0 5px}aside small{color:#c0d2ce}nav{margin-top:42px;display:grid;gap:9px}nav button{border:0;background:transparent;color:#dce8e4;text-align:left;padding:13px;border-radius:10px}nav button.active,nav button:hover{background:#36565a;color:white}main{margin-left:240px;padding:35px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.muted{color:#748084}.cards{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:15px;margin:25px 0}.card,.panel{background:white;border:1px solid #e3e9e5;border-radius:15px;padding:21px;box-shadow:0 4px 16px #203b3d09}.card{text-align:left}.card strong{display:block;font-size:32px;margin-top:9px}.card:hover{border-color:#86aaa4}.panel{margin:16px 0}h1{font-size:29px;margin:0 0 7px}h3{margin:0 0 17px}table{border-collapse:collapse;width:100%}td,th{padding:13px;text-align:left;border-bottom:1px solid #edf0ee}th{font-size:13px;color:#7c8989}.tag{padding:6px 9px;border-radius:20px;background:#edf3f1;font-size:12px;white-space:nowrap}.late{background:#fff0ec;color:#a04d35}.waiting{background:#fff6df;color:#876622}.good{background:#e9f5ee;color:#39734d}.primary{background:#254c4c;color:white;border:0;padding:11px 17px;border-radius:9px}.secondary{background:white;border:1px solid #cddbd6;padding:10px 13px;border-radius:9px}.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}input,select{border:1px solid #d5ded9;border-radius:8px;padding:10px;background:white;max-width:100%}.phase{border:1px solid #e3e9e5;border-radius:12px;margin:12px 0;padding:16px;background:#fbfcfb}.sub{padding:10px;margin:7px 0 7px 20px;border-left:3px solid #bdd0c9;background:white;display:flex;justify-content:space-between;gap:10px;align-items:center}.hidden{display:none}.click{color:#246465;text-decoration:underline;cursor:pointer}.note{font-size:13px;background:#fff8e8;border-radius:9px;padding:11px;margin-top:15px}@media(max-width:850px){aside{position:static;width:100%;min-height:0;padding:16px}nav{display:flex;overflow:auto;margin-top:14px}nav button{white-space:nowrap}main{margin:0;padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}table{display:block;overflow-x:auto}}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:15px}.weekday{text-align:center;font-size:12px;font-weight:700;color:#71807d;padding:8px 0}.cal-day{min-height:108px;border:1px solid #e4eae6;border-radius:9px;padding:7px;background:#fff;overflow:hidden}.cal-day.other{opacity:.35}.cal-day.off{background:#f4f2ed}.cal-day.today{border:2px solid #2b6868}.cal-number{font-size:12px;font-weight:700}.cal-event{display:block;width:100%;border:0;text-align:left;border-radius:5px;background:#e8f2ef;color:#27504c;font-size:11px;padding:5px;margin-top:5px;overflow-wrap:anywhere}.cal-event.overdue{background:#fbe7e1;color:#9c4832}.cal-holiday{font-size:10px;color:#946b3e;margin-top:4px}.cal-legend{font-size:12px;color:#65736d;margin-top:10px}.cal-controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.cal-controls select{max-width:180px}@media(max-width:650px){.cal-day{min-height:78px;padding:3px}.cal-event{font-size:9px;padding:3px}.cal-number{font-size:11px}.calendar-grid{gap:2px}.cal-holiday{font-size:9px}} .cal-start{background:#e8edf8;color:#354f80}.cal-office{background:#fff1d9;color:#82571d}.cal-client{background:#e8f2ed;color:#245b42}.cal-event.overdue{background:#fbe7e1;color:#9c4832}.cal-day{min-height:132px}.cal-events{display:grid;gap:4px;margin-top:6px}.cal-event{margin-top:0}.cal-owner{font-weight:700;font-size:11px;display:block;margin-bottom:2px}.cal-count{font-size:10px;color:#5b6967;margin-top:4px}.cal-event.done{opacity:.65}.cal-day:has(.cal-events) {overflow:visible}@media(max-width:650px){.cal-day{min-height:100px}.cal-owner{font-size:9px}}.cal-day{min-width:0;min-height:116px;overflow:hidden!important}.cal-daytop{display:flex;justify-content:space-between;align-items:center}.cal-count{margin:0;font-size:10px;background:#e8efec;border-radius:20px;padding:2px 6px}.cal-more{background:none;border:0;color:#276b69;font-size:11px;font-weight:700;padding:6px 2px;text-align:left}.cal-event{display:flex;flex-direction:column;gap:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis}.cal-events{min-width:0}.cal-agenda{margin-top:15px;padding:16px;border-radius:12px;background:#f6f9f7;border:1px solid #d9e5df}.cal-agenda-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:12px}.cal-agenda-list .cal-event{padding:10px;font-size:13px}@media(max-width:700px){.calendar-grid{grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}.cal-day{min-height:75px;padding:3px}.cal-day .cal-event{display:none}.cal-day .cal-events{display:none}.cal-day .cal-more{font-size:9px;padding:3px 0}.cal-day .cal-count{font-size:9px;padding:1px 3px}.cal-holiday{font-size:8px;overflow-wrap:anywhere}.calendar-head{align-items:flex-start}.cal-controls{width:100%}.cal-agenda-list{grid-template-columns:1fr}.cal-day:has(.cal-count){cursor:pointer}} .table-scroll{overflow-x:auto;width:100%}.table-scroll table{min-width:850px}.table-scroll th{white-space:nowrap}.table-scroll td{white-space:nowrap}</style></head><body><aside><h2>SANTRELLE</h2><small>ARQUITETURA · Gestão</small><nav id="nav"><button data-page="painel" class="active">▦ Painel geral</button><button data-page="projetos">▤ Projetos</button><button data-page="equipe">♙ Equipe</button><button data-page="modelos">⚙ Etapas e modelos</button></nav></aside><main><div class="top"><div><h1 id="title">Painel geral</h1><div class="muted">Acompanhe projetos, responsáveis e prazos em um só lugar.</div></div><button class="primary" onclick="newProject()">+ Novo projeto</button></div><div id="content"></div><div class="note">Protótipo demonstrativo: os dados desta versão são exemplos e ficam somente neste navegador. Ainda não há conexão com Supabase nem autenticação.</div></main><script>
const seed=[{id:1,name:'Residência Jardim',client:'Cliente exemplo A',owner:'Ana',status:'Em andamento',phase:'Anteprojeto',deadline:'2026-11-12'},{id:2,name:'Apartamento Praia',client:'Cliente exemplo B',owner:'Joyce',status:'Atrasado',phase:'Briefing',deadline:'2026-10-19'},{id:3,name:'Loja Conceito',client:'Cliente exemplo C',owner:'Leonardo',status:'Aguardando aprovação',phase:'Projeto executivo',deadline:'2026-11-02'}];
const initial=[{name:'Briefing',days:3,subs:[{name:'Conversa com cliente',days:1},{name:'Levantamento de necessidades e materiais',days:1},{name:'Consolidar briefing e encaminhar para projeto',days:1}]},{name:'Levantamento',days:2,subs:[{name:'Medição no local',days:1},{name:'Organizar levantamento',days:1}]},{name:'Anteprojeto',days:10,subs:[{name:'Desenvolver proposta',days:7},{name:'Revisão interna',days:3}]},{name:'Projeto executivo',days:20,subs:[{name:'Compatibilizar medidas',days:4},{name:'Detalhamentos técnicos',days:16}]},{name:'Acompanhamento de obra',days:60,subs:[{name:'Planejamento da obra',days:5},{name:'Acompanhamento e visitas',days:55}]}];
let projects=JSON.parse(localStorage.getItem('santrelle_projects')||'null')||seed;let phases=JSON.parse(localStorage.getItem('santrelle_phases')||'null')||initial;let page='painel',filter='Todos',selected=null;let calendarMonth=new Date().getMonth(),calendarYear=new Date().getFullYear(),calendarOwner='Todos',expandedDay=null;let employees=JSON.parse(localStorage.getItem('santrelle_employees')||'null')||[{name:'Ana'},{name:'Joyce'},{name:'Leonardo'}];let deliveries=JSON.parse(localStorage.getItem('santrelle_deliveries')||'[]');let extraHolidays=JSON.parse(localStorage.getItem('santrelle_holidays')||'[]');const el=document.getElementById('content');function save(){localStorage.setItem('santrelle_projects',JSON.stringify(projects));localStorage.setItem('santrelle_phases',JSON.stringify(phases));localStorage.setItem('santrelle_deliveries',JSON.stringify(deliveries));localStorage.setItem('santrelle_holidays',JSON.stringify(extraHolidays));localStorage.setItem('santrelle_employees',JSON.stringify(employees))}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tag(s){return '<span class="tag '+(s==='Atrasado'?'late':s==='Aguardando aprovação'?'waiting':'good')+'">'+esc(s)+'</span>'}function go(p){page=p;selected=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));function rows(list){let fmt=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'')?x.split('-').reverse().join('/'):'—';return '<div class="table-scroll"><table><thead><tr><th>Projeto</th><th>Etapa</th><th>Responsável</th><th>Início</th><th>Prazo escritório</th><th>Prazo cliente</th><th>Situação</th></tr></thead><tbody>'+list.map(p=>'<tr><td><a class="click" onclick="openProject('+p.id+')">'+esc(p.name)+'</a><div class="muted">'+esc(p.client)+'</div></td><td>'+esc(p.phase)+'</td><td>'+esc(p.owner)+'</td><td>'+fmt(p.startDate)+'</td><td>'+fmt(p.officeDate)+'</td><td>'+fmt(p.clientDate||p.deadline)+'</td><td>'+tag(p.status)+'</td></tr>').join('')+'</tbody></table></div>'}
function render(){document.getElementById('title').textContent=selected?'Detalhes do projeto':({painel:'Painel geral',projetos:'Projetos',equipe:'Equipe',modelos:'Etapas e modelos'})[page];if(selected){detail();return}if(page==='painel'){let entries=calendarEntries().filter(e=>!e.completed).sort((a,b)=>a.date.localeCompare(b.date));let today=iso(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate());let overdue=entries.filter(e=>e.date<today);let soon=entries.filter(e=>e.date>=today&&e.date<=offsetDay(parseISO(today),7));const metrics=[['Projetos ativos',projects.filter(p=>p.status!=='Concluído').length,'Todos'],['Entregas atrasadas',overdue.length,'Atrasado'],['Próximos 7 dias',soon.length,'Todos'],['Aguardando aprovação',projects.filter(p=>p.status==='Aguardando aprovação').length,'Aguardando aprovação']];el.innerHTML='<div class="cards">'+metrics.map(m=>'<button class="card" onclick="filter=\''+m[2]+'\';go(\'projetos\')"><span>'+m[0]+'</span><strong>'+m[1]+'</strong><span class="muted">Ver projetos →</span></button>').join('')+'</div>'+calendarHTML()+'<section class="panel"><div class="calendar-head"><div><h3 style="margin-bottom:5px">Entregas que precisam de atenção</h3><div class="muted">Atrasadas primeiro, depois as próximas entregas da equipe</div></div></div>'+attentionHTML(entries,today)+'</section>'}if(page==='projetos'){let list=projects.filter(p=>filter==='Todos'||p.status===filter);el.innerHTML='<section class="panel"><div class="inline"><strong>Filtrar por situação</strong><select id="filter" onchange="filter=this.value;render()">'+['Todos','Em andamento','Atrasado','Aguardando aprovação'].map(x=>'<option '+(filter===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'+rows(list)+'</section>'}if(page==='equipe'){let owners=[...new Set([...employees.map(e=>e.name),...projects.map(p=>p.owner)])];el.innerHTML='<section class="panel"><div class="inline"><h3 style="margin:0;flex:1">Equipe e entregas</h3><button class="primary" onclick="addEmployee()">+ Funcionário</button></div><p class="muted">Acompanhe as entregas de cada pessoa e gerencie os integrantes da equipe.</p></section><div class="grid2">'+owners.map(o=>'<section class="panel"><div class="inline"><h3 style="flex:1">'+esc(o)+'</h3><button class="secondary" onclick="removeEmployee('+JSON.stringify(o).replace(/"/g,'&quot;')+')">Excluir</button></div>'+calendarEntries().filter(e=>e.owner===o&&!e.completed).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>'<p><a class="click" onclick="calendarOpen(\''+e.id+'\')">'+esc(e.name)+'</a><br><small>'+esc(e.date)+' · '+(e.date<iso(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate())?'Atrasado':'Pendente')+'</small></p>').join('')+(calendarEntries().filter(e=>e.owner===o&&!e.completed).length?'':'<p class="muted">Sem entregas pendentes.</p>')+'</section>').join('')+'</div>'}if(page==='modelos')models()}
function iso(y,m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function parseISO(s){let a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)}
function easter(y){let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k+7)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=(h+l-7*m+114)%31+1;return new Date(y,month-1,day,12)}
function offsetDay(dt,n){let x=new Date(dt);x.setDate(x.getDate()+n);return iso(x.getFullYear(),x.getMonth()+1,x.getDate())}
function holidays(y){let h={'01-01':'Confraternização Universal','04-21':'Tiradentes','05-01':'Dia do Trabalho','09-07':'Independência','10-12':'Nossa Senhora Aparecida','11-02':'Finados','11-15':'Proclamação da República','11-20':'Consciência Negra','12-25':'Natal'};let eas=easter(y);let goodFriday=offsetDay(eas,-2).slice(5);h[goodFriday]='Sexta-feira Santa';for(let x of extraHolidays){if(x.date.startsWith(String(y)))h[x.date.slice(5)]=x.name}return h}
function holidayName(date){return holidays(+date.slice(0,4))[date.slice(5)]||''}
function businessDay(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return false;let d=parseISO(date);return d.getDay()!==0&&d.getDay()!==6&&!holidayName(date)}
function nextBusiness(date){let d=date;for(let i=0;i<370&&!businessDay(d);i++)d=offsetDay(parseISO(d),1);return d}
function addBusinessDays(start,count){let d=start;for(let i=0;i<count;i++){d=offsetDay(parseISO(d),1);d=nextBusiness(d)}return d}
function calendarEntries(){let entries=[];for(let p of projects){let completed=p.status==='Concluído';let valid=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'');if(valid(p.startDate))entries.push({id:'p'+p.id,name:'Início: '+p.name,owner:p.owner,date:p.startDate,projectId:p.id,completed:true,kind:'start'});if(valid(p.officeDate))entries.push({id:'p'+p.id,name:'Prazo escritório: '+p.name,owner:p.owner,date:p.officeDate,projectId:p.id,completed,kind:'office'});let client=p.clientDate||(valid(p.deadline)?p.deadline:'');if(valid(client))entries.push({id:'p'+p.id,name:'Entrega cliente: '+p.name,owner:p.owner,date:client,projectId:p.id,completed,kind:'client'});for(let [i,step] of (p.schedule||[]).entries()){if(valid(step.deadline))entries.push({id:'s'+p.id+'_'+i,name:'Etapa escritório: '+step.name+' · '+p.name,owner:step.owner||p.owner,date:step.deadline,projectId:p.id,completed:!!step.completed,kind:'office'});if(valid(step.clientDeadline)&&step.clientDeadline!==step.deadline)entries.push({id:'s'+p.id+'_'+i,name:'Etapa cliente: '+step.name+' · '+p.name,owner:step.owner||p.owner,date:step.clientDeadline,projectId:p.id,completed:!!step.completed,kind:'client'})}}return entries.concat(deliveries.map(d=>({...d,id:'d'+d.id,kind:'delivery'})))}
function calendarHTML(){let first=new Date(calendarYear,calendarMonth,1),offset=(first.getDay()+6)%7,total=new Date(calendarYear,calendarMonth+1,0).getDate();let owners=['Todos',...new Set([...employees.map(e=>e.name),...projects.map(p=>p.owner),...deliveries.map(d=>d.owner)].filter(Boolean))];let entries=calendarEntries().filter(e=>calendarOwner==='Todos'||e.owner===calendarOwner);let today=new Date(),todayISO=iso(today.getFullYear(),today.getMonth()+1,today.getDate());let days='';let kindClass=e=>e.kind==='start'?'cal-start':e.kind==='office'?'cal-office':e.kind==='client'?'cal-client':'';let eventHTML=e=>'<button class="cal-event '+kindClass(e)+(!e.completed&&e.date<todayISO?' overdue':'')+'" title="'+esc(e.name+' · '+e.owner)+'" onclick="calendarOpen(\''+e.id+'\')"><span class="cal-owner">'+esc(e.owner||'Sem responsável')+'</span><span>'+esc(e.name)+'</span></button>';for(let i=0;i<Math.ceil((offset+total)/7)*7;i++){let date=offsetDay(first,i-offset),n=parseISO(date).getDate(),outside=parseISO(date).getMonth()!==calendarMonth,holiday=holidayName(date),off=!businessDay(date),items=entries.filter(e=>e.date===date).sort((a,b)=>(a.owner||'').localeCompare(b.owner||'')||({start:0,stage:1,office:2,client:3,delivery:4}[a.kind]??5)-({start:0,stage:1,office:2,client:3,delivery:4}[b.kind]??5));let expanded=expandedDay===date,limit=2,visible=expanded?items:items.slice(0,limit);days+='<div class="cal-day '+(outside?'other ':'')+(off?'off ':'')+(date===todayISO?'today':'')+'"><div class="cal-daytop"><span class="cal-number">'+n+'</span>'+(items.length?'<span class="cal-count">'+items.length+'</span>':'')+'</div>'+(holiday?'<div class="cal-holiday" title="'+esc(holiday)+'">'+esc(holiday)+'</div>':'')+'<div class="cal-events">'+visible.map(eventHTML).join('')+'</div>'+(items.length>limit?'<button class="cal-more" onclick="toggleCalendarDay(\''+date+'\')">'+(expanded?'Mostrar menos':'+'+(items.length-limit)+' atividades')+'</button>':'')+'</div>'}let selected=expandedDay?entries.filter(e=>e.date===expandedDay):[];return '<section class="panel"><div class="calendar-head"><div><h3 style="margin-bottom:4px">Calendário de entregas</h3><div class="muted">Compromissos organizados por pessoa e por tipo de prazo</div></div><div class="cal-controls"><button class="secondary" onclick="shiftMonth(-1)">‹</button><strong>'+first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'</strong><button class="secondary" onclick="shiftMonth(1)">›</button><select onchange="calendarOwner=this.value;render()">'+owners.map(o=>'<option '+(o===calendarOwner?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select><button class="primary" onclick="addDelivery()">+ Entrega</button><button class="secondary" onclick="addHoliday()">+ Feriado/folga</button></div></div><div class="calendar-grid">'+['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>'<div class="weekday">'+x+'</div>').join('')+days+'</div>'+(expandedDay&&selected.length?'<div class="cal-agenda"><div class="inline"><strong style="flex:1">Atividades de '+esc(expandedDay.split('-').reverse().join('/'))+'</strong><button class="secondary" onclick="toggleCalendarDay(null)">Fechar</button></div><div class="cal-agenda-list">'+selected.map(eventHTML).join('')+'</div></div>':'')+'<div class="cal-legend">Azul: início · Amarelo: escritório · Verde: cliente · Vermelho: vencidas. Dias cinza: não úteis. Clique em + atividades para ver todos os compromissos do dia.</div></section>'}
function toggleCalendarDay(date){expandedDay=expandedDay===date?null:date;render()}
function shiftMonth(n){expandedDay=null;let d=new Date(calendarYear,calendarMonth+n,1);calendarYear=d.getFullYear();calendarMonth=d.getMonth();render()}
function addDelivery(){let name=prompt('O que precisa ser entregue?');if(!name?.trim())return;let owner=prompt('Responsável pela entrega:','')||'Não definido';let project=prompt('Número do projeto (opcional):\n'+projects.map(p=>p.id+' - '+p.name).join('\n'),'')||'';let raw=prompt('Data prevista (AAAA-MM-DD):',iso(calendarYear,calendarMonth+1,Math.min(new Date().getDate(),28)));if(!raw||!/^\d{4}-\d{2}-\d{2}$/.test(raw)||isNaN(parseISO(raw).getTime())){alert('Informe uma data válida no formato AAAA-MM-DD.');return}let date=nextBusiness(raw);if(date!==raw)alert('O dia escolhido não é útil. A entrega foi ajustada para '+date+'.');deliveries.push({id:Date.now(),name:name.trim(),owner,date,projectId:projects.some(p=>String(p.id)===project)?+project:null,completed:false});save();calendarYear=+date.slice(0,4);calendarMonth=+date.slice(5,7)-1;render()}
function addHoliday(){let date=prompt('Data do feriado municipal, estadual ou folga (AAAA-MM-DD):');if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date)||isNaN(parseISO(date).getTime()))return;let name=prompt('Nome do feriado ou folga:');if(!name?.trim())return;extraHolidays.push({date,name:name.trim()});for(let d of deliveries){if(!d.completed&&!businessDay(d.date))d.date=nextBusiness(d.date)}save();render()}
function calendarOpen(id){let e=calendarEntries().find(x=>x.id===id);if(!e)return;if(id[0]==='p'||id[0]==='s'){openProject(e.projectId);return}let choice=prompt(e.name+'\nResponsável: '+e.owner+'\nPrazo: '+e.date+'\n\nDigite 1 para concluir, 2 para reagendar, 3 para abrir projeto ou 4 para excluir:');let d=deliveries.find(x=>x.id===+id.slice(1));if(choice==='1')d.completed=true;else if(choice==='2'){let date=prompt('Nova data (AAAA-MM-DD):',d.date);if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date)||isNaN(parseISO(date).getTime()))return;d.date=nextBusiness(date)}else if(choice==='3'&&d.projectId){openProject(d.projectId);return}else if(choice==='4'&&confirm('Excluir esta entrega?'))deliveries=deliveries.filter(x=>x!==d);save();render()}
function addEmployee(){let name=prompt('Nome do funcionário:');if(!name?.trim())return;name=name.trim();if(employees.some(e=>e.name.toLowerCase()===name.toLowerCase())){alert('Funcionário já cadastrado.');return}employees.push({name});save();render()}function removeEmployee(name){if(!confirm('Excluir '+name+' da lista da equipe? Os projetos e entregas existentes continuarão vinculados ao nome.'))return;employees=employees.filter(e=>e.name!==name);save();render()}function models(){el.innerHTML='<section class="panel"><h3>Modelo padrão de etapas e subetapas</h3><p class="muted">Prazos em dias úteis. O prazo do cliente é calculado somando os dias adicionais ao prazo interno da etapa.</p>'+phases.map((p,i)=>'<div class="phase"><div class="inline"><strong>'+esc(p.name)+'</strong><label>Prazo da etapa <input type="number" min="1" style="width:85px" value="'+p.days+'" onchange="setDays('+i+',this.value)"> dias</label><label>Dias adicionais até entrega ao cliente <input type="number" min="0" style="width:75px" value="'+(p.clientExtraDays||0)+'" onchange="setClientExtraDays('+i+',this.value)"> dias</label><span class="muted">Total cliente: '+(Number(p.days)+Number(p.clientExtraDays||0))+' dias úteis</span><button class="secondary" onclick="renamePhase('+i+')">Renomear</button><button class="secondary" onclick="movePhase('+i+',-1)">↑</button><button class="secondary" onclick="movePhase('+i+',1)">↓</button><button class="secondary" onclick="removePhase('+i+')">Excluir</button></div>'+p.subs.map((s,j)=>'<div class="sub"><span>'+esc(s.name)+'</span><div class="inline"><input aria-label="Dias úteis" type="number" min="1" style="width:75px" value="'+s.days+'" onchange="setSubDays('+i+','+j+',this.value)"> dias <button class="secondary" onclick="renameSub('+i+','+j+')">Editar</button><button class="secondary" onclick="moveSub('+i+','+j+')">Mover</button><button class="secondary" onclick="removeSub('+i+','+j+')">×</button></div></div>').join('')+'<button class="secondary" onclick="addSub('+i+')">+ Adicionar subetapa</button></div>').join('')+'<button class="primary" onclick="addPhase()">+ Adicionar etapa</button></section>'}function setDays(i,v){phases[i].days=Math.max(1,+v||1);save()}function setClientExtraDays(i,v){phases[i].clientExtraDays=Math.max(0,Math.floor(Number(v)||0));save();render()}function setSubDays(i,j,v){phases[i].subs[j].days=Math.max(1,+v||1);save()}function addPhase(){let name=prompt('Nome da nova etapa:');if(!name?.trim())return;let days=+(prompt('Duração prevista em dias úteis:', '3')||3);phases.push({name:name.trim(),days:Math.max(1,days),clientExtraDays:0,subs:[]});save();render()}function addSub(i){let name=prompt('Nome da nova subetapa:');if(!name?.trim())return;let days=+(prompt('Duração prevista em dias úteis:', '1')||1);phases[i].subs.push({name:name.trim(),days:Math.max(1,days)});save();render()}function renamePhase(i){let v=prompt('Nome da etapa:',phases[i].name);if(v?.trim()){phases[i].name=v.trim();save();render()}}function renameSub(i,j){let v=prompt('Nome da subetapa:',phases[i].subs[j].name);if(v?.trim()){phases[i].subs[j].name=v.trim();save();render()}}function removePhase(i){if(confirm('Excluir etapa e todas as subetapas?')){phases.splice(i,1);save();render()}}function removeSub(i,j){phases[i].subs.splice(j,1);save();render()}function movePhase(i,d){let n=i+d;if(n<0||n>=phases.length)return;[phases[i],phases[n]]=[phases[n],phases[i]];save();render()}function moveSub(i,j){let to=prompt('Mover para qual etapa?\n'+phases.map((p,k)=>(k+1)+' - '+p.name).join('\n'),String(i+1));let k=+to-1;if(!phases[k])return;phases[k].subs.push(phases[i].subs.splice(j,1)[0]);save();render()}function newProject(){let name=prompt('Nome do projeto:');if(!name?.trim())return;let client=prompt('Cliente:','')||'';let owner=prompt('Responsável:','')||'Não definido';let p={id:Date.now(),name:name.trim(),client,owner,status:'Em andamento',phase:phases[0]?.name||'A definir',deadline:'A definir',steps:structuredClone(phases),schedule:[]};projects.push(p);save();openProject(p.id)}function openProject(id){selected=projects.find(p=>p.id===id);page='projetos';render()}function detail(){let p=selected,steps=p.steps||phases;let schedule=p.schedule||[];el.innerHTML='<section class="panel"><button class="secondary" onclick="go(\'projetos\')">← Voltar</button><h2>'+esc(p.name)+'</h2><p class="muted">'+esc(p.client)+' · Responsável: '+esc(p.owner)+'</p><div class="inline"><label>Situação <select id="st">'+['Em andamento','Atrasado','Aguardando aprovação','Concluído'].map(s=>'<option '+(p.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label>Início <input id="startDate" type="date" value="'+esc(p.startDate||'')+'"></label><label>Prazo do escritório <input id="officeDate" type="date" value="'+esc(p.officeDate||'')+'"></label><label>Prazo do cliente <input id="clientDate" type="date" value="'+esc(p.clientDate||(/^\d{4}-/.test(p.deadline)?p.deadline:''))+'"></label><button class="primary" onclick="updateProject('+p.id+')">Salvar alterações</button></div></section><section class="panel"><div class="calendar-head"><div><h3>Planejamento e prazos das etapas</h3><p class="muted">As etapas seguem em sequência e consideram dias úteis e feriados. O prazo de acompanhamento de obra pode ser ajustado individualmente.</p></div><div class="inline"><button class="primary" onclick="createSchedule('+p.id+')">Gerar cronograma</button><button class="secondary" onclick="addProjectStep('+p.id+')">+ Entrega avulsa</button></div></div>'+(!schedule.length?'<p class="muted">Nenhum cronograma gerado. Clique em Gerar cronograma para calcular as datas.</p>':'')+schedule.map((s,i)=>'<div class="phase"><div class="inline"><strong style="flex:1">'+esc(s.name)+'</strong><span class="tag '+(s.completed?'good':'')+'">'+(s.completed?'Concluída':'Pendente')+'</span><button class="secondary" onclick="editProjectStep('+p.id+','+i+')">Editar prazo</button><button class="secondary" onclick="completeProjectStep('+p.id+','+i+')">'+(s.completed?'Reabrir':'Concluir')+'</button></div><div class="muted">'+esc(s.owner||p.owner)+' · '+esc(s.start||'')+' até '+esc(s.deadline||'')+' · '+s.days+' dias úteis internos · Cliente: '+esc(s.clientDeadline||s.deadline||'')+' (+'+(s.clientExtraDays||0)+' dias úteis)</div></div>').join('')+'</section><section class="panel"><h3>Modelo de etapas e subetapas deste projeto</h3><p class="muted">As durações abaixo podem ser ajustadas antes de gerar o cronograma.</p>'+steps.map((s,i)=>'<div class="phase"><div class="inline"><strong style="flex:1">'+esc(s.name)+'</strong><label>Duração <input type="number" min="1" style="width:80px" value="'+s.days+'" onchange="changeProjectPhaseDays('+p.id+','+i+',this.value)"> dias úteis</label><label>Adicional cliente <input type="number" min="0" style="width:70px" value="'+(s.clientExtraDays||0)+'" onchange="changeProjectClientDays('+p.id+','+i+',this.value)"> dias</label></div>'+s.subs.map(sub=>'<div class="sub">'+esc(sub.name)+' · '+sub.days+' dias úteis</div>').join('')+'</div>').join('')+'</section>'}function attentionHTML(entries,today){let visible=entries.filter(e=>e.date<=offsetDay(parseISO(today),14)).slice(0,15);if(!visible.length)return '<p class="muted">Nenhuma entrega atrasada ou prevista para os próximos 14 dias.</p>';return '<table><thead><tr><th>Entrega / projeto</th><th>Responsável</th><th>Prazo</th><th>Situação</th></tr></thead><tbody>'+visible.map(e=>'<tr><td><a class="click" onclick="calendarOpen(\''+e.id+'\')">'+esc(e.name)+'</a></td><td>'+esc(e.owner||'Não definido')+'</td><td>'+esc(e.date.split('-').reverse().join('/'))+'</td><td><span class="tag '+(e.date<today?'late':'waiting')+'">'+(e.date<today?'Atrasada':'Próxima')+'</span></td></tr>').join('')+'</tbody></table>'}
function changeProjectClientDays(id,i,value){let p=projects.find(x=>x.id===id);p.steps=p.steps||structuredClone(phases);p.steps[i].clientExtraDays=Math.max(0,Math.floor(Number(value)||0));save();render()}function changeProjectPhaseDays(id,i,value){let p=projects.find(x=>x.id===id);p.steps=p.steps||structuredClone(phases);p.steps[i].days=Math.max(1,Number(value)||1);save()}
function createSchedule(id){let p=projects.find(x=>x.id===id);let start=prompt('Data de início do cronograma (AAAA-MM-DD):',iso(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate()));if(!start||!/^\d{4}-\d{2}-\d{2}$/.test(start))return;if((p.schedule||[]).length&&!confirm('Substituir cronograma atual?'))return;let cursor=nextBusiness(start);p.startDate=cursor;p.schedule=[];for(let phase of (p.steps||phases)){let end=addBusinessDays(cursor,Math.max(1,phase.days)-1);let extra=Math.max(0,Number(phase.clientExtraDays)||0);let clientDeadline=extra?addBusinessDays(end,extra):end;p.schedule.push({name:phase.name,owner:p.owner,start:cursor,deadline:end,clientDeadline,clientExtraDays:extra,days:phase.days,completed:false});cursor=nextBusiness(offsetDay(parseISO(clientDeadline),1))}p.phase=p.schedule[0]?.name||p.phase;p.officeDate=p.schedule.at(-1)?.deadline||p.officeDate;p.clientDate=p.schedule.at(-1)?.clientDeadline||p.clientDate||'';p.deadline=p.clientDate||p.officeDate||'A definir';save();render()}function addProjectStep(id){let p=projects.find(x=>x.id===id),name=prompt('Nome da entrega:');if(!name?.trim())return;let owner=prompt('Responsável:',p.owner)||p.owner;let date=prompt('Prazo (AAAA-MM-DD):',iso(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate()));if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;date=nextBusiness(date);p.schedule=p.schedule||[];p.schedule.push({name:name.trim(),owner,start:date,deadline:date,days:1,completed:false});save();render()}function editProjectStep(id,i){let p=projects.find(x=>x.id===id),s=p.schedule[i];let owner=prompt('Responsável:',s.owner);if(owner===null)return;let date=prompt('Nova data da entrega (AAAA-MM-DD):',s.deadline);if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;let reason=prompt('Motivo da alteração (opcional):','');if(reason===null)return;s.history=s.history||[];s.history.push({old:s.deadline,new:nextBusiness(date),reason});s.owner=owner;s.deadline=nextBusiness(date);save();render()}function completeProjectStep(id,i){let p=projects.find(x=>x.id===id),s=p.schedule[i];s.completed=!s.completed;let next=p.schedule.find(x=>!x.completed);if(next)p.phase=next.name;else if(p.schedule.length)p.status='Concluído';save();render()}function updateProject(id){let p=projects.find(x=>x.id===id);let status=document.getElementById('st').value;let startDate=document.getElementById('startDate').value;let officeDate=document.getElementById('officeDate').value;let clientDate=document.getElementById('clientDate').value;if(startDate&&officeDate&&officeDate<startDate){alert('O prazo do escritório não pode ser anterior ao início.');return}if(officeDate&&clientDate&&clientDate<officeDate){alert('O prazo do cliente não pode ser anterior ao prazo do escritório.');return}if((officeDate&&!businessDay(officeDate))||(clientDate&&!businessDay(clientDate))){alert('O prazo do escritório e o do cliente precisam ser dias úteis. Ajuste a data considerando os feriados.');return}let changed=p.officeDate!==officeDate||(p.clientDate||(/^\\d{4}-/.test(p.deadline)?p.deadline:''))!==clientDate;if(changed&&(p.officeDate||p.clientDate)){let reason=prompt('Motivo da alteração dos prazos:');if(reason===null)return;p.history=p.history||[];p.history.push({previousOffice:p.officeDate,previousClient:p.clientDate,nextOffice:officeDate,nextClient:clientDate,reason,date:new Date().toISOString()})}p.startDate=startDate;p.officeDate=officeDate;p.clientDate=clientDate;p.deadline=clientDate||'A definir';p.status=status;save();render()}render();
</script></body></html>
