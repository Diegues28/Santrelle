<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Santrelle Arquitetura</title><meta name="theme-color" content="#233d40"><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#24343a;background:#f5f6f3}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}aside{background:#203b3d;color:white;width:240px;min-height:100vh;padding:28px 18px;position:fixed}aside h2{font-size:21px;margin:0 0 5px}aside small{color:#c0d2ce}nav{margin-top:42px;display:grid;gap:9px}nav button{border:0;background:transparent;color:#dce8e4;text-align:left;padding:13px;border-radius:10px}nav button.active,nav button:hover{background:#36565a;color:white}main{margin-left:240px;padding:35px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.muted{color:#748084}.cards{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:15px;margin:25px 0}.card,.panel{background:white;border:1px solid #e3e9e5;border-radius:15px;padding:21px;box-shadow:0 4px 16px #203b3d09}.card{text-align:left}.card strong{display:block;font-size:32px;margin-top:9px}.card:hover{border-color:#86aaa4}.panel{margin:16px 0}h1{font-size:29px;margin:0 0 7px}h3{margin:0 0 17px}table{border-collapse:collapse;width:100%}td,th{padding:13px;text-align:left;border-bottom:1px solid #edf0ee}th{font-size:13px;color:#7c8989}.tag{padding:6px 9px;border-radius:20px;background:#edf3f1;font-size:12px;white-space:nowrap}.late{background:#fff0ec;color:#a04d35}.waiting{background:#fff6df;color:#876622}.good{background:#e9f5ee;color:#39734d}.primary{background:#254c4c;color:white;border:0;padding:11px 17px;border-radius:9px}.secondary{background:white;border:1px solid #cddbd6;padding:10px 13px;border-radius:9px}.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}input,select{border:1px solid #d5ded9;border-radius:8px;padding:10px;background:white;max-width:100%}.phase{border:1px solid #e3e9e5;border-radius:12px;margin:12px 0;padding:16px;background:#fbfcfb}.sub{padding:10px;margin:7px 0 7px 20px;border-left:3px solid #bdd0c9;background:white;display:flex;justify-content:space-between;gap:10px;align-items:center}.hidden{display:none}.click{color:#246465;text-decoration:underline;cursor:pointer}.note{font-size:13px;background:#fff8e8;border-radius:9px;padding:11px;margin-top:15px}@media(max-width:850px){aside{position:static;width:100%;min-height:0;padding:16px}nav{display:flex;overflow:auto;margin-top:14px}nav button{white-space:nowrap}main{margin:0;padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}table{display:block;overflow-x:auto}}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:15px}.weekday{text-align:center;font-size:12px;font-weight:700;color:#71807d;padding:8px 0}.cal-day{min-height:108px;border:1px solid #e4eae6;border-radius:9px;padding:7px;background:#fff;overflow:hidden}.cal-day.other{opacity:.35}.cal-day.off{background:#f4f2ed}.cal-day.today{border:2px solid #2b6868}.cal-number{font-size:12px;font-weight:700}.cal-event{display:block;width:100%;border:0;text-align:left;border-radius:5px;background:#e8f2ef;color:#27504c;font-size:11px;padding:5px;margin-top:5px;overflow-wrap:anywhere}.cal-event.overdue{background:#fbe7e1;color:#9c4832}.cal-holiday{font-size:10px;color:#946b3e;margin-top:4px}.cal-legend{font-size:12px;color:#65736d;margin-top:10px}.cal-controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.cal-controls select{max-width:180px}@media(max-width:650px){.cal-day{min-height:78px;padding:3px}.cal-event{font-size:9px;padding:3px}.cal-number{font-size:11px}.calendar-grid{gap:2px}.cal-holiday{font-size:9px}} </style></head><body><aside><h2>SANTRELLE</h2><small>ARQUITETURA · Gestão</small><nav id="nav"><button data-page="painel" class="active">▦ Painel geral</button><button data-page="projetos">▤ Projetos</button><button data-page="equipe">♙ Equipe</button><button data-page="modelos">⚙ Etapas e modelos</button></nav></aside><main><div class="top"><div><h1 id="title">Painel geral</h1><div class="muted">Acompanhe projetos, responsáveis e prazos em um só lugar.</div></div><button class="primary" onclick="newProject()">+ Novo projeto</button></div><div id="content"></div><div class="note">Protótipo demonstrativo: os dados desta versão são exemplos e ficam somente neste navegador. Ainda não há conexão com Supabase nem autenticação.</div></main><script>
const seed=[{id:1,name:'Residência Jardim',client:'Cliente exemplo A',owner:'Ana',status:'Em andamento',phase:'Anteprojeto',deadline:'2026-11-12'},{id:2,name:'Apartamento Praia',client:'Cliente exemplo B',owner:'Joyce',status:'Atrasado',phase:'Briefing',deadline:'2026-10-19'},{id:3,name:'Loja Conceito',client:'Cliente exemplo C',owner:'Leonardo',status:'Aguardando aprovação',phase:'Projeto executivo',deadline:'2026-11-02'}];
const initial=[{name:'Briefing',days:3,subs:[{name:'Conversa com cliente',days:1},{name:'Levantamento de necessidades e materiais',days:1},{name:'Consolidar briefing e encaminhar para projeto',days:1}]},{name:'Levantamento',days:2,subs:[{name:'Medição no local',days:1},{name:'Organizar levantamento',days:1}]},{name:'Anteprojeto',days:10,subs:[{name:'Desenvolver proposta',days:7},{name:'Revisão interna',days:3}]},{name:'Projeto executivo',days:20,subs:[{name:'Compatibilizar medidas',days:4},{name:'Detalhamentos técnicos',days:16}]},{name:'Acompanhamento de obra',days:60,subs:[{name:'Planejamento da obra',days:5},{name:'Acompanhamento e visitas',days:55}]}];
let projects=JSON.parse(localStorage.getItem('santrelle_projects')||'null')||seed;let phases=JSON.parse(localStorage.getItem('santrelle_phases')||'null')||initial;let page='painel',filter='Todos',selected=null;let calendarMonth=new Date().getMonth(),calendarYear=new Date().getFullYear(),calendarOwner='Todos';let deliveries=JSON.parse(localStorage.getItem('santrelle_deliveries')||'[]');let extraHolidays=JSON.parse(localStorage.getItem('santrelle_holidays')||'[]');const el=document.getElementById('content');function save(){localStorage.setItem('santrelle_projects',JSON.stringify(projects));localStorage.setItem('santrelle_phases',JSON.stringify(phases));localStorage.setItem('santrelle_deliveries',JSON.stringify(deliveries));localStorage.setItem('santrelle_holidays',JSON.stringify(extraHolidays))}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tag(s){return '<span class="tag '+(s==='Atrasado'?'late':s==='Aguardando aprovação'?'waiting':'good')+'">'+esc(s)+'</span>'}function go(p){page=p;selected=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));function rows(list){return '<table><thead><tr><th>Projeto</th><th>Etapa</th><th>Responsável</th><th>Prazo</th><th>Situação</th></tr></thead><tbody>'+list.map(p=>'<tr><td><a class="click" onclick="openProject('+p.id+')">'+esc(p.name)+'</a><div class="muted">'+esc(p.client)+'</div></td><td>'+esc(p.phase)+'</td><td>'+esc(p.owner)+'</td><td>'+esc(p.deadline)+'</td><td>'+tag(p.status)+'</td></tr>').join('')+'</tbody></table>'}function render(){document.getElementById('title').textContent=selected?'Detalhes do projeto':({painel:'Painel geral',projetos:'Projetos',equipe:'Equipe',modelos:'Etapas e modelos'})[page];if(selected){detail();return}if(page==='painel'){const metrics=[['Projetos ativos',projects.length,'Todos'],['Etapas atrasadas',projects.filter(p=>p.status==='Atrasado').length,'Atrasado'],['Dentro do prazo',projects.filter(p=>p.status==='Em andamento').length,'Em andamento'],['Aguardando aprovação',projects.filter(p=>p.status==='Aguardando aprovação').length,'Aguardando aprovação']];el.innerHTML='<div class="cards">'+metrics.map(m=>'<button class="card" onclick="filter=\''+m[2]+'\';go(\'projetos\')"><span>'+m[0]+'</span><strong>'+m[1]+'</strong><span class="muted">Ver projetos →</span></button>').join('')+'</div><section class="panel"><h3>Projetos que precisam de atenção</h3>'+rows(projects.filter(p=>p.status!=='Em andamento'))+'</section>'+calendarHTML()}if(page==='projetos'){let list=projects.filter(p=>filter==='Todos'||p.status===filter);el.innerHTML='<section class="panel"><div class="inline"><strong>Filtrar por situação</strong><select id="filter" onchange="filter=this.value;render()">'+['Todos','Em andamento','Atrasado','Aguardando aprovação'].map(x=>'<option '+(filter===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'+rows(list)+'</section>'}if(page==='equipe'){let owners=[...new Set(projects.map(p=>p.owner))];el.innerHTML='<div class="grid2">'+owners.map(o=>'<section class="panel"><h3>'+esc(o)+'</h3>'+projects.filter(p=>p.owner===o).map(p=>'<p><a class="click" onclick="openProject('+p.id+')">'+esc(p.name)+'</a> · '+tag(p.status)+'</p>').join('')+'</section>').join('')+'</div>'}if(page==='modelos')models()}
function iso(y,m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function parseISO(s){let a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)}
function easter(y){let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k+7)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=(h+l-7*m+114)%31+1;return new Date(y,month-1,day,12)}
function offsetDay(dt,n){let x=new Date(dt);x.setDate(x.getDate()+n);return iso(x.getFullYear(),x.getMonth()+1,x.getDate())}
function holidays(y){let h={'01-01':'Confraternização Universal','04-21':'Tiradentes','05-01':'Dia do Trabalho','09-07':'Independência','10-12':'Nossa Senhora Aparecida','11-02':'Finados','11-15':'Proclamação da República','11-20':'Consciência Negra','12-25':'Natal'};let eas=easter(y);let goodFriday=offsetDay(eas,-2).slice(5);h[goodFriday]='Sexta-feira Santa';for(let x of extraHolidays){if(x.date.startsWith(String(y)))h[x.date.slice(5)]=x.name}return h}
function holidayName(date){return holidays(+date.slice(0,4))[date.slice(5)]||''}
function businessDay(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return false;let d=parseISO(date);return d.getDay()!==0&&d.getDay()!==6&&!holidayName(date)}
function nextBusiness(date){let d=date;for(let i=0;i<370&&!businessDay(d);i++)d=offsetDay(parseISO(d),1);return d}
function addBusinessDays(start,count){let d=start;for(let i=0;i<count;i++){d=offsetDay(parseISO(d),1);d=nextBusiness(d)}return d}
function calendarEntries(){let fromProjects=projects.filter(p=>/^\d{4}-\d{2}-\d{2}$/.test(p.deadline)).map(p=>({id:'p'+p.id,name:'Prazo: '+p.name,owner:p.owner,date:p.deadline,projectId:p.id,completed:p.status==='Concluído',status:p.status}));return fromProjects.concat(deliveries.map(d=>({...d,id:'d'+d.id})))}
function calendarHTML(){let first=new Date(calendarYear,calendarMonth,1),offset=(first.getDay()+6)%7,total=new Date(calendarYear,calendarMonth+1,0).getDate();let owners=['Todos',...new Set([...projects.map(p=>p.owner),...deliveries.map(d=>d.owner)].filter(Boolean))];let entries=calendarEntries().filter(e=>calendarOwner==='Todos'||e.owner===calendarOwner);let today=new Date(),todayISO=iso(today.getFullYear(),today.getMonth()+1,today.getDate());let days='';for(let i=0;i<Math.ceil((offset+total)/7)*7;i++){let date=offsetDay(first,i-offset),n=parseISO(date).getDate(),outside=parseISO(date).getMonth()!==calendarMonth,holiday=holidayName(date),off=!businessDay(date),items=entries.filter(e=>e.date===date);days+='<div class="cal-day '+(outside?'other ':'')+(off?'off ':'')+(date===todayISO?'today':'')+'"><div class="cal-number">'+n+'</div>'+(holiday?'<div class="cal-holiday" title="'+esc(holiday)+'">'+esc(holiday)+'</div>':'')+items.map(e=>'<button class="cal-event '+(!e.completed&&e.date<todayISO?'overdue':'')+'" title="'+esc(e.name+' · '+e.owner)+'" onclick="calendarOpen(\''+e.id+'\')">'+esc(e.name)+'<br><small>'+esc(e.owner||'Sem responsável')+'</small></button>').join('')+'</div>'}
return '<section class="panel"><div class="calendar-head"><div><h3 style="margin-bottom:4px">Calendário de entregas</h3><div class="muted">Prazos por responsável · feriados e fins de semana destacados</div></div><div class="cal-controls"><button class="secondary" onclick="shiftMonth(-1)">‹</button><strong>'+first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'</strong><button class="secondary" onclick="shiftMonth(1)">›</button><select onchange="calendarOwner=this.value;render()">'+owners.map(o=>'<option '+(o===calendarOwner?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select><button class="primary" onclick="addDelivery()">+ Entrega</button><button class="secondary" onclick="addHoliday()">+ Feriado/folga</button></div></div><div class="calendar-grid">'+['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>'<div class="weekday">'+x+'</div>').join('')+days+'</div><div class="cal-legend">Dias em cinza: não úteis. Datas de entrega em vermelho: vencidas. Feriados nacionais incluídos; adicione feriados locais e folgas pelo botão acima. Entregas em dias não úteis são transferidas para o próximo dia útil ao cadastrar.</div></section>'}
function shiftMonth(n){let d=new Date(calendarYear,calendarMonth+n,1);calendarYear=d.getFullYear();calendarMonth=d.getMonth();render()}
function addDelivery(){let name=prompt('O que precisa ser entregue?');if(!name?.trim())return;let owner=prompt('Responsável pela entrega:','')||'Não definido';let project=prompt('Número do projeto (opcional):\n'+projects.map(p=>p.id+' - '+p.name).join('\n'),'')||'';let raw=prompt('Data prevista (AAAA-MM-DD):',iso(calendarYear,calendarMonth+1,Math.min(new Date().getDate(),28)));if(!raw||!/^\d{4}-\d{2}-\d{2}$/.test(raw)||isNaN(parseISO(raw).getTime())){alert('Informe uma data válida no formato AAAA-MM-DD.');return}let date=nextBusiness(raw);if(date!==raw)alert('O dia escolhido não é útil. A entrega foi ajustada para '+date+'.');deliveries.push({id:Date.now(),name:name.trim(),owner,date,projectId:projects.some(p=>String(p.id)===project)?+project:null,completed:false});save();calendarYear=+date.slice(0,4);calendarMonth=+date.slice(5,7)-1;render()}
function addHoliday(){let date=prompt('Data do feriado municipal, estadual ou folga (AAAA-MM-DD):');if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date)||isNaN(parseISO(date).getTime()))return;let name=prompt('Nome do feriado ou folga:');if(!name?.trim())return;extraHolidays.push({date,name:name.trim()});for(let d of deliveries){if(!d.completed&&!businessDay(d.date))d.date=nextBusiness(d.date)}save();render()}
function calendarOpen(id){let e=calendarEntries().find(x=>x.id===id);if(!e)return;if(id[0]==='p'){openProject(e.projectId);return}let choice=prompt(e.name+'\nResponsável: '+e.owner+'\nPrazo: '+e.date+'\n\nDigite 1 para concluir, 2 para reagendar, 3 para abrir projeto ou 4 para excluir:');let d=deliveries.find(x=>x.id===+id.slice(1));if(choice==='1')d.completed=true;else if(choice==='2'){let date=prompt('Nova data (AAAA-MM-DD):',d.date);if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date)||isNaN(parseISO(date).getTime()))return;d.date=nextBusiness(date)}else if(choice==='3'&&d.projectId){openProject(d.projectId);return}else if(choice==='4'&&confirm('Excluir esta entrega?'))deliveries=deliveries.filter(x=>x!==d);save();render()}
function models(){el.innerHTML='<section class="panel"><h3>Modelo padrão de etapas e subetapas</h3><p class="muted">Durações de exemplo, editáveis. Dias úteis; o prazo de cada etapa é independente da soma das subetapas.</p>'+phases.map((p,i)=>'<div class="phase"><div class="inline"><strong>'+esc(p.name)+'</strong><label>Prazo da etapa <input type="number" min="1" style="width:85px" value="'+p.days+'" onchange="setDays('+i+',this.value)"> dias</label><button class="secondary" onclick="renamePhase('+i+')">Renomear</button><button class="secondary" onclick="movePhase('+i+',-1)">↑</button><button class="secondary" onclick="movePhase('+i+',1)">↓</button><button class="secondary" onclick="removePhase('+i+')">Excluir</button></div>'+p.subs.map((s,j)=>'<div class="sub"><span>'+esc(s.name)+'</span><div class="inline"><input aria-label="Dias úteis" type="number" min="1" style="width:75px" value="'+s.days+'" onchange="setSubDays('+i+','+j+',this.value)"> dias <button class="secondary" onclick="renameSub('+i+','+j+')">Editar</button><button class="secondary" onclick="moveSub('+i+','+j+')">Mover</button><button class="secondary" onclick="removeSub('+i+','+j+')">×</button></div></div>').join('')+'<button class="secondary" onclick="addSub('+i+')">+ Adicionar subetapa</button></div>').join('')+'<button class="primary" onclick="addPhase()">+ Adicionar etapa</button></section>'}function setDays(i,v){phases[i].days=Math.max(1,+v||1);save()}function setSubDays(i,j,v){phases[i].subs[j].days=Math.max(1,+v||1);save()}function addPhase(){let name=prompt('Nome da nova etapa:');if(!name?.trim())return;let days=+(prompt('Duração prevista em dias úteis:', '3')||3);phases.push({name:name.trim(),days:Math.max(1,days),subs:[]});save();render()}function addSub(i){let name=prompt('Nome da nova subetapa:');if(!name?.trim())return;let days=+(prompt('Duração prevista em dias úteis:', '1')||1);phases[i].subs.push({name:name.trim(),days:Math.max(1,days)});save();render()}function renamePhase(i){let v=prompt('Nome da etapa:',phases[i].name);if(v?.trim()){phases[i].name=v.trim();save();render()}}function renameSub(i,j){let v=prompt('Nome da subetapa:',phases[i].subs[j].name);if(v?.trim()){phases[i].subs[j].name=v.trim();save();render()}}function removePhase(i){if(confirm('Excluir etapa e todas as subetapas?')){phases.splice(i,1);save();render()}}function removeSub(i,j){phases[i].subs.splice(j,1);save();render()}function movePhase(i,d){let n=i+d;if(n<0||n>=phases.length)return;[phases[i],phases[n]]=[phases[n],phases[i]];save();render()}function moveSub(i,j){let to=prompt('Mover para qual etapa?\n'+phases.map((p,k)=>(k+1)+' - '+p.name).join('\n'),String(i+1));let k=+to-1;if(!phases[k])return;phases[k].subs.push(phases[i].subs.splice(j,1)[0]);save();render()}function newProject(){let name=prompt('Nome do projeto:');if(!name?.trim())return;let client=prompt('Cliente:','')||'';let owner=prompt('Responsável:','')||'Não definido';let p={id:Date.now(),name:name.trim(),client,owner,status:'Em andamento',phase:phases[0]?.name||'A definir',deadline:'A definir',steps:structuredClone(phases)};projects.push(p);save();openProject(p.id)}function openProject(id){selected=projects.find(p=>p.id===id);page='projetos';render()}function detail(){let p=selected,steps=p.steps||phases;el.innerHTML='<section class="panel"><button class="secondary" onclick="go(\'projetos\')">← Voltar</button><h2>'+esc(p.name)+'</h2><p class="muted">'+esc(p.client)+' · Responsável: '+esc(p.owner)+'</p><div class="inline"><label>Situação <select id="st">'+['Em andamento','Atrasado','Aguardando aprovação','Concluído'].map(s=>'<option '+(p.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label>Prazo <input id="dt" type="date" value="'+(p.deadline.match(/^\d{4}-/)?p.deadline:'')+'"></label><button class="primary" onclick="updateProject('+p.id+')">Salvar alterações</button></div></section><section class="panel"><h3>Etapas e subetapas</h3>'+steps.map(s=>'<div class="phase"><strong>'+esc(s.name)+'</strong> · '+s.days+' dias úteis'+s.subs.map(sub=>'<div class="sub">'+esc(sub.name)+' · '+sub.days+' dias úteis</div>').join('')+'</div>').join('')+'</section>'}function updateProject(id){let p=projects.find(x=>x.id===id),status=document.getElementById('st').value,dt=document.getElementById('dt').value;if(p.deadline!=='A definir'&&dt!==p.deadline){let reason=prompt('Motivo da alteração do prazo:');if(reason===null)return;p.history=p.history||[];p.history.push({previous:p.deadline,next:dt,reason,date:new Date().toISOString()})}p.status=status;p.deadline=dt||'A definir';save();render()}render();
</script></body></html>
