<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Santrelle Arquitetura</title><meta name="theme-color" content="#233d40"><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#24343a;background:#f5f6f3}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}aside{background:#203b3d;color:white;width:240px;min-height:100vh;padding:28px 18px;position:fixed}aside h2{font-size:21px;margin:0 0 5px}aside small{color:#c0d2ce}nav{margin-top:42px;display:grid;gap:9px}nav button{border:0;background:transparent;color:#dce8e4;text-align:left;padding:13px;border-radius:10px}nav button.active,nav button:hover{background:#36565a;color:white}main{margin-left:240px;padding:35px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.muted{color:#748084}.cards{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:15px;margin:25px 0}.card,.panel{background:white;border:1px solid #e3e9e5;border-radius:15px;padding:21px;box-shadow:0 4px 16px #203b3d09}.card{text-align:left}.card strong{display:block;font-size:32px;margin-top:9px}.card:hover{border-color:#86aaa4}.panel{margin:16px 0}h1{font-size:29px;margin:0 0 7px}h3{margin:0 0 17px}table{border-collapse:collapse;width:100%}td,th{padding:13px;text-align:left;border-bottom:1px solid #edf0ee}th{font-size:13px;color:#7c8989}.tag{padding:6px 9px;border-radius:20px;background:#edf3f1;font-size:12px;white-space:nowrap}.late{background:#fff0ec;color:#a04d35}.waiting{background:#fff6df;color:#876622}.good{background:#e9f5ee;color:#39734d}.primary{background:#254c4c;color:white;border:0;padding:11px 17px;border-radius:9px}.secondary{background:white;border:1px solid #cddbd6;padding:10px 13px;border-radius:9px}.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}input,select{border:1px solid #d5ded9;border-radius:8px;padding:10px;background:white;max-width:100%}.phase{border:1px solid #e3e9e5;border-radius:12px;margin:12px 0;padding:16px;background:#fbfcfb}.sub{padding:10px;margin:7px 0 7px 20px;border-left:3px solid #bdd0c9;background:white;display:flex;justify-content:space-between;gap:10px;align-items:center}.hidden{display:none}.click{color:#246465;text-decoration:underline;cursor:pointer}.note{font-size:13px;background:#fff8e8;border-radius:9px;padding:11px;margin-top:15px}@media(max-width:850px){aside{position:static;width:100%;min-height:0;padding:16px}nav{display:flex;overflow:auto;margin-top:14px}nav button{white-space:nowrap}main{margin:0;padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}table{display:block;overflow-x:auto}}
</style></head><body><aside><h2>SANTRELLE</h2><small>ARQUITETURA · Gestão</small><nav id="nav"><button data-page="painel" class="active">▦ Painel geral</button><button data-page="projetos">▤ Projetos</button><button data-page="equipe">♙ Equipe</button><button data-page="modelos">⚙ Etapas e modelos</button></nav></aside><main><div class="top"><div><h1 id="title">Painel geral</h1><div class="muted">Acompanhe projetos, responsáveis e prazos em um só lugar.</div></div><button class="primary" onclick="newProject()">+ Novo projeto</button></div><div id="content"></div><div class="note">Protótipo demonstrativo: os dados desta versão são exemplos e ficam somente neste navegador. Ainda não há conexão com Supabase nem autenticação.</div></main><script>
const seed=[{id:1,name:'Residência Jardim',client:'Cliente exemplo A',owner:'Ana',status:'Em andamento',phase:'Anteprojeto',deadline:'2026-11-12'},{id:2,name:'Apartamento Praia',client:'Cliente exemplo B',owner:'Joyce',status:'Atrasado',phase:'Briefing',deadline:'2026-10-19'},{id:3,name:'Loja Conceito',client:'Cliente exemplo C',owner:'Leonardo',status:'Aguardando aprovação',phase:'Projeto executivo',deadline:'2026-11-02'}];
const initial=[{name:'Briefing',days:3,subs:[{name:'Conversa com cliente',days:1},{name:'Levantamento de necessidades e materiais',days:1},{name:'Consolidar briefing e encaminhar para projeto',days:1}]},{name:'Levantamento',days:2,subs:[{name:'Medição no local',days:1},{name:'Organizar levantamento',days:1}]},{name:'Anteprojeto',days:10,subs:[{name:'Desenvolver proposta',days:7},{name:'Revisão interna',days:3}]},{name:'Projeto executivo',days:20,subs:[{name:'Compatibilizar medidas',days:4},{name:'Detalhamentos técnicos',days:16}]},{name:'Acompanhamento de obra',days:60,subs:[{name:'Planejamento da obra',days:5},{name:'Acompanhamento e visitas',days:55}]}];
let projects=JSON.parse(localStorage.getItem('santrelle_projects')||'null')||seed;let phases=JSON.parse(localStorage.getItem('santrelle_phases')||'null')||initial;let page='painel',filter='Todos',selected=null;const el=document.getElementById('content');function save(){localStorage.setItem('santrelle_projects',JSON.stringify(projects));localStorage.setItem('santrelle_phases',JSON.stringify(phases))}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tag(s){return '<span class="tag '+(s==='Atrasado'?'late':s==='Aguardando aprovação'?'waiting':'good')+'">'+esc(s)+'</span>'}function go(p){page=p;selected=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));function rows(list){return '<table><thead><tr><th>Projeto</th><th>Etapa</th><th>Responsável</th><th>Prazo</th><th>Situação</th></tr></thead><tbody>'+list.map(p=>'<tr><td><a class="click" onclick="openProject('+p.id+')">'+esc(p.name)+'</a><div class="muted">'+esc(p.client)+'</div></td><td>'+esc(p.phase)+'</td><td>'+esc(p.owner)+'</td><td>'+esc(p.deadline)+'</td><td>'+tag(p.status)+'</td></tr>').join('')+'</tbody></table>'}function render(){document.getElementById('title').textContent=selected?'Detalhes do projeto':({painel:'Painel geral',projetos:'Projetos',equipe:'Equipe',modelos:'Etapas e modelos'})[page];if(selected){detail();return}if(page==='painel'){const metrics=[['Projetos ativos',projects.length,'Todos'],['Etapas atrasadas',projects.filter(p=>p.status==='Atrasado').length,'Atrasado'],['Dentro do prazo',projects.filter(p=>p.status==='Em andamento').length,'Em andamento'],['Aguardando aprovação',projects.filter(p=>p.status==='Aguardando aprovação').length,'Aguardando aprovação']];el.innerHTML='<div class="cards">'+metrics.map(m=>'<button class="card" onclick="filter=\''+m[2]+'\';go(\'projetos\')"><span>'+m[0]+'</span><strong>'+m[1]+'</strong><span class="muted">Ver projetos →</span></button>').join('')+'</div><section class="panel"><h3>Projetos que precisam de atenção</h3>'+rows(projects.filter(p=>p.status!=='Em andamento'))+'</section>'}if(page==='projetos'){let list=projects.filter(p=>filter==='Todos'||p.status===filter);el.innerHTML='<section class="panel"><div class="inline"><strong>Filtrar por situação</strong><select id="filter" onchange="filter=this.value;render()">'+['Todos','Em andamento','Atrasado','Aguardando aprovação'].map(x=>'<option '+(filter===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'+rows(list)+'</section>'}if(page==='equipe'){let owners=[...new Set(projects.map(p=>p.owner))];el.innerHTML='<div class="grid2">'+owners.map(o=>'<section class="panel"><h3>'+esc(o)+'</h3>'+projects.filter(p=>p.owner===o).map(p=>'<p><a class="click" onclick="openProject('+p.id+')">'+esc(p.name)+'</a> · '+tag(p.status)+'</p>').join('')+'</section>').join('')+'</div>'}if(page==='modelos')models()}function models(){el.innerHTML='<section class="panel"><h3>Modelo padrão de etapas e subetapas</h3><p class="muted">Durações de exemplo, editáveis. Dias úteis; o prazo de cada etapa é independente da soma das subetapas.</p>'+phases.map((p,i)=>'<div class="phase"><div class="inline"><strong>'+esc(p.name)+'</strong><label>Prazo da etapa <input type="number" min="1" style="width:85px" value="'+p.days+'" onchange="setDays('+i+',this.value)"> dias</label><button class="secondary" onclick="renamePhase('+i+')">Renomear</button><button class="secondary" onclick="movePhase('+i+',-1)">↑</button><button class="secondary" onclick="movePhase('+i+',1)">↓</button><button class="secondary" onclick="removePhase('+i+')">Excluir</button></div>'+p.subs.map((s,j)=>'<div class="sub"><span>'+esc(s.name)+'</span><div class="inline"><input aria-label="Dias úteis" type="number" min="1" style="width:75px" value="'+s.days+'" onchange="setSubDays('+i+','+j+',this.value)"> dias <button class="secondary" onclick="renameSub('+i+','+j+')">Editar</button><button class="secondary" onclick="moveSub('+i+','+j+')">Mover</button><button class="secondary" onclick="removeSub('+i+','+j+')">×</button></div></div>').join('')+'<button class="secondary" onclick="addSub('+i+')">+ Adicionar subetapa</button></div>').join('')+'<button class="primary" onclick="addPhase()">+ Adicionar etapa</button></section>'}function setDays(i,v){phases[i].days=Math.max(1,+v||1);save()}function setSubDays(i,j,v){phases[i].subs[j].days=Math.max(1,+v||1);save()}function addPhase(){let name=prompt('Nome da nova etapa:');if(!name?.trim())return;let days=+(prompt('Duração prevista em dias úteis:', '3')||3);phases.push({name:name.trim(),days:Math.max(1,days),subs:[]});save();render()}function addSub(i){let name=prompt('Nome da nova subetapa:');if(!name?.trim())return;let days=+(prompt('Duração prevista em dias úteis:', '1')||1);phases[i].subs.push({name:name.trim(),days:Math.max(1,days)});save();render()}function renamePhase(i){let v=prompt('Nome da etapa:',phases[i].name);if(v?.trim()){phases[i].name=v.trim();save();render()}}function renameSub(i,j){let v=prompt('Nome da subetapa:',phases[i].subs[j].name);if(v?.trim()){phases[i].subs[j].name=v.trim();save();render()}}function removePhase(i){if(confirm('Excluir etapa e todas as subetapas?')){phases.splice(i,1);save();render()}}function removeSub(i,j){phases[i].subs.splice(j,1);save();render()}function movePhase(i,d){let n=i+d;if(n<0||n>=phases.length)return;[phases[i],phases[n]]=[phases[n],phases[i]];save();render()}function moveSub(i,j){let to=prompt('Mover para qual etapa?\n'+phases.map((p,k)=>(k+1)+' - '+p.name).join('\n'),String(i+1));let k=+to-1;if(!phases[k])return;phases[k].subs.push(phases[i].subs.splice(j,1)[0]);save();render()}function newProject(){let name=prompt('Nome do projeto:');if(!name?.trim())return;let client=prompt('Cliente:','')||'';let owner=prompt('Responsável:','')||'Não definido';let p={id:Date.now(),name:name.trim(),client,owner,status:'Em andamento',phase:phases[0]?.name||'A definir',deadline:'A definir',steps:structuredClone(phases)};projects.push(p);save();openProject(p.id)}function openProject(id){selected=projects.find(p=>p.id===id);page='projetos';render()}function detail(){let p=selected,steps=p.steps||phases;el.innerHTML='<section class="panel"><button class="secondary" onclick="go(\'projetos\')">← Voltar</button><h2>'+esc(p.name)+'</h2><p class="muted">'+esc(p.client)+' · Responsável: '+esc(p.owner)+'</p><div class="inline"><label>Situação <select id="st">'+['Em andamento','Atrasado','Aguardando aprovação','Concluído'].map(s=>'<option '+(p.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label>Prazo <input id="dt" type="date" value="'+(p.deadline.match(/^\d{4}-/)?p.deadline:'')+'"></label><button class="primary" onclick="updateProject('+p.id+')">Salvar alterações</button></div></section><section class="panel"><h3>Etapas e subetapas</h3>'+steps.map(s=>'<div class="phase"><strong>'+esc(s.name)+'</strong> · '+s.days+' dias úteis'+s.subs.map(sub=>'<div class="sub">'+esc(sub.name)+' · '+sub.days+' dias úteis</div>').join('')+'</div>').join('')+'</section>'}function updateProject(id){let p=projects.find(x=>x.id===id),status=document.getElementById('st').value,dt=document.getElementById('dt').value;if(p.deadline!=='A definir'&&dt!==p.deadline){let reason=prompt('Motivo da alteração do prazo:');if(reason===null)return;p.history=p.history||[];p.history.push({previous:p.deadline,next:dt,reason,date:new Date().toISOString()})}p.status=status;p.deadline=dt||'A definir';save();render()}render();
</script></body></html>
