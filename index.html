function syncProjectSubsteps(id){
 const p=projects.find(x=>x.id===id);if(!p)return;
 if(!confirm('Adicionar as subetapas que faltam, conforme a aba Etapas e modelos? As subetapas existentes e seus responsáveis não serão alterados.'))return;
 p.steps=p.steps||structuredClone(phases);
 const normalize=str=>String(str||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
 const model=defaultRegistrationSteps();
 let added=0;
 for(let i=0;i<model.length;i++){
  const source=model[i];
  let target=p.steps.find(s=>normalize(s.name)===normalize(source.name));
  if(!target){
   target=structuredClone(source);p.steps.push(target);added+=(target.subs||[]).length;continue;
  }
  target.subs=target.subs||[];
  const existing=new Set(target.subs.map(s=>normalize(s.name)));
  for(const sub of source.subs||[]){
   const key=normalize(sub.name);
   if(existing.has(key))continue;
   target.subs.push(structuredClone(sub));
   existing.add(key);added++;
  }
 }
 if(added)save();
 render();
 alert(added?added+' subetapa(s) do modelo adicionada(s) a este projeto. Os responsáveis anteriores foram preservados.':'Este projeto já possui todas as subetapas do modelo.');
}
function removeProjectSubstep(id,i,j){
 const p=projects.find(x=>x.id===id),subs=p?.steps?.[i]?.subs;if(!subs?.[j])return;
 if(subs.length<=1){alert('Mantenha pelo menos uma subetapa nesta etapa.');return}
 if(!confirm('Excluir a subetapa "'+subs[j].name+'" deste projeto?'))return;
 subs.splice(j,1);save();render()
}
function changeProjectClientDays(id,i,value){let p=projects.find(x=>x.id===id);p.steps=p.steps||structuredClone(phases);p.steps[i].clientExtraDays=Math.max(0,Math.floor(Number(value)||0));save();render()}function changeProjectSubDays(id,i,j,value){let p=projects.find(x=>x.id===id);p.steps=p.steps||structuredClone(phases);p.steps[i].subs[j].days=Math.max(1,Math.floor(Number(value)||1));save();render()}function changeProjectPhaseDays(id,i,value){let p=projects.find(x=>x.id===id);p.steps=p.steps||structuredClone(phases);p.steps[i].days=Math.max(1,Number(value)||1);save()}

/* Prévia não persistida de cronograma — usa o mesmo cálculo oficial do projeto. */
function getScheduleDraft(p){
 if(!p||!schedulePreviewState||schedulePreviewState.projectId!==p.id)return null;
 const clone=JSON.parse(JSON.stringify(p));
 clone.steps=clone.steps||JSON.parse(JSON.stringify(phases));
 buildScheduleForRegistration(clone,nextBusiness(schedulePreviewState.startDate));
 return clone;
}
function schedulePreviewMonth(delta){
 if(!schedulePreviewState)return;
 let d=new Date(schedulePreviewState.year,schedulePreviewState.month+delta,1);
 schedulePreviewState.year=d.getFullYear();schedulePreviewState.month=d.getMonth();render();
}
function schedulePreviewChooseDay(date){
 if(!schedulePreviewState||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
 schedulePreviewState.startDate=date;
 schedulePreviewState.year=Number(date.slice(0,4));schedulePreviewState.month=Number(date.slice(5,7))-1;
 render();
}
function schedulePreviewSetDate(value){
 if(!schedulePreviewState)return;
 const date=parseDateBR(value);
 if(!date){alert('Escolha uma data válida no formato DD/MM/AAAA.');return}
 if(date===schedulePreviewState.startDate)return;
 schedulePreviewChooseDay(date);
}
function closeSchedulePreview(){
 schedulePreviewState=null;render();
}
function schedulePreviewCalendar(p,draft){
 const shown=new Date(schedulePreviewState.year,schedulePreviewState.month,1);
 const year=shown.getFullYear(),month=shown.getMonth();
 const first=(shown.getDay()+6)%7,daysInMonth=new Date(year,month+1,0).getDate(),cells=Math.ceil((first+daysInMonth)/7)*7;
 let inner='';
 for(let i=0;i<cells;i++){
  const day=offsetDay(shown,i-first),parsed=parseISO(day),outside=parsed.getMonth()!==month;
  const info=holidayInfo(day),dayOff=!businessDay(day),isSelected=day===schedulePreviewState.startDate,starts=day===draft.startDate;
  const signals=[];
  if(starts)signals.push({type:'start',label:'Início do projeto'});
  for(let j=0;j<(draft.schedule||[]).length;j++){
   const step=draft.schedule[j];
   if(step.deadline===day)signals.push({type:'office',label:'Prazo interno: '+step.name});
   if(step.clientDeadline===day)signals.push({type:'client',label:'Apresentação/entrega ao cliente: '+step.name});
   if(step.revisionRequested&&step.revisionDeadline===day)signals.push({type:'review',label:'Revisão solicitada: '+step.name});
   const subs=draft.steps?.[j]?.subs||[];
   for(let k=0;k<subs.length;k++){
    if(substepDueDate(draft,j,k)===day)signals.push({type:'sub',label:'Subetapa: '+subs[k].name});
   }
  }
  const within=(draft.schedule||[]).some(step=>step.start&&day>=step.start&&day<=(step.revisionDeadline||step.clientDeadline||step.deadline));
  const title=[formatDateBR(day),...(info?[info.name,...info.other]:[]),...signals.map(x=>x.label)].join(' · ');
  const types=[...new Set(signals.map(x=>x.type))];
  inner+='<button type="button" class="sched-mini-day '+(outside?'sched-mini-outside ':'')+(dayOff?'sched-mini-off ':'')+(info?'sched-mini-holiday ':'')+(isSelected?'sched-mini-selected ':'')+(within&&!dayOff?'sched-mini-working ':'')+'" title="'+esc(title)+'" aria-label="'+esc(title)+(isSelected?' · Data selecionada':'')+'" aria-pressed="'+(isSelected?'true':'false')+'" onclick="schedulePreviewChooseDay(\''+day+'\')">'
  +'<span class="sched-mini-daynumber">'+parsed.getDate()+'</span>'
  +'<span class="sched-mini-marks">'+types.slice(0,4).map(k=>'<span class="sched-mini-mark sched-mini-'+k+'"></span>').join('')+'</span></button>';
 }
 return '<div class="sched-mini-calendar"><div class="sched-mini-toolbar"><strong>'+shown.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'</strong><div class="inline"><button type="button" class="secondary" aria-label="Mês anterior" onclick="schedulePreviewMonth(-1)">‹</button><button type="button" class="secondary" aria-label="Próximo mês" onclick="schedulePreviewMonth(1)">›</button></div></div>'
 +'<div class="sched-mini-grid">'+['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>'<span class="sched-mini-weekday">'+x+'</span>').join('')+inner+'</div>'
 +'<div class="sched-mini-legend"><span><i class="sched-legend-start"></i> Início</span><span><i class="sched-legend-office"></i> Interno</span><span><i class="sched-legend-client"></i> Cliente</span><span><i class="sched-legend-sub"></i> Subetapa</span><span><i class="sched-legend-holiday"></i> Feriado</span></div>'
 +'<p class="sched-mini-hint">Clique em um dia para alterar o início. Navegue pelos meses para conferir todas as entregas. Os dias úteis dentro do cronograma ficam realçados.</p></div>';
}
function schedulePreviewSummary(draft){
 const previewRows=(draft.schedule||[]).map((step,i)=>{
  const phase=draft.steps?.[i]||{};
  const subitems=(phase.subs||[]).map((sub,j)=>{
   const date=substepDueDate(draft,i,j),optional=subIsOptionalRevision(phase,sub);
   if(optional&&!step.revisionRequested)return '<div class="sched-preview-sub"><span>'+esc(sub.name)+' <em>(se solicitado)</em></span><span>Não previsto</span></div>';
   return '<div class="sched-preview-sub"><span>'+esc(sub.name)+'</span><span>'+esc(date?formatDateBR(date):'A definir')+'</span></div>';
  }).join('');
  const parts=registrationContractParts(phase);
  return '<div class="sched-preview-stage"><div class="sched-preview-stage-title"><strong>'+esc(step.name)+'</strong><span>'+registrationContractDays(phase)+' dias úteis</span></div>'
  +'<div class="sched-preview-dates"><div><span>Início da etapa</span><strong>'+(formatDateBR(step.start)||'A definir')+'</strong></div><div><span>Prazo interno</span><strong>'+(formatDateBR(step.deadline)||'A definir')+'</strong></div><div><span>Entrega ao cliente</span><strong>'+(formatDateBR(step.clientDeadline)||'A definir')+'</strong></div></div>'
  +(step.revisionRequested&&step.revisionDeadline?'<div class="sched-preview-review">Revisão solicitada: até <strong>'+formatDateBR(step.revisionDeadline)+'</strong></div>':registrationHasOptionalReview(phase)?'<div class="sched-preview-optional">Revisão opcional: '+parts.secondary+' dias úteis, não incluída.</div>':'')
  +'<div class="sched-preview-subitems">'+subitems+'</div></div>';
 }).join('');
 return '<div class="sched-preview-summary"><h3>Conferência das datas</h3><p class="muted">Prazos em dias úteis, considerando feriados nacionais, estaduais de SP, municipais de Santos e folgas cadastradas.</p>'+previewRows+'</div>';
}
function schedulePreviewHTML(p){
 let draft;
 try{draft=getScheduleDraft(p)}catch(err){return '<div class="sched-preview-backdrop"><section class="sched-preview-modal"><h3>Não foi possível calcular o cronograma</h3><p>'+esc(err.message||'Verifique os prazos cadastrados.')+'</p><button class="secondary" onclick="closeSchedulePreview()">Fechar</button></section></div>'}
 if(!draft)return '';
 const initial=schedulePreviewState.startDate,actual=draft.startDate,moved=initial!==actual;
 let projectEnd=draft.clientDate||draft.officeDate||'';
 const pendingRevisions=(draft.steps||[]).filter(s=>registrationHasOptionalReview(s)&&!s.revisionRequested).length;
 return '<div class="sched-preview-backdrop" role="presentation"><section class="sched-preview-modal" role="dialog" aria-modal="true" aria-labelledby="sched-preview-title">'
  +'<div class="sched-preview-top"><div><span class="sched-preview-kicker">CONFERÊNCIA ANTES DE SALVAR</span><h2 id="sched-preview-title">Prévia do cronograma</h2><p class="muted">'+esc(p.name)+' · Nenhuma data será alterada até a sua confirmação.</p></div><button class="sched-preview-close" type="button" aria-label="Cancelar prévia" onclick="closeSchedulePreview()">×</button></div>'
  +'<div class="sched-preview-inputrow"><label>Data de início desejada <input id="scheduleStartInput" class="br-date-input" type="text" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="DD/MM/AAAA" value="'+esc(formatDateBR(initial))+'" oninput="maskDateBR(this);if(this.value.length===10)schedulePreviewSetDate(this.value)" onchange="schedulePreviewSetDate(this.value)"></label>'
  +'<div><span class="muted">Início efetivo</span><strong>'+formatDateBR(actual)+'</strong></div><div><span class="muted">Última entrega prevista</span><strong>'+formatDateBR(projectEnd)+'</strong></div></div>'
  +(moved?'<div class="sched-preview-notice">A data escolhida ('+formatDateBR(initial)+') é fim de semana ou feriado. O cronograma começa no próximo dia útil: <strong>'+formatDateBR(actual)+'</strong>.</div>':'')
  +'<div class="sched-preview-columns">'+schedulePreviewCalendar(p,draft)+schedulePreviewSummary(draft)+'</div>'
  +'<div class="sched-preview-footer"><p class="muted">As revisões não solicitadas não entram no cálculo'+(pendingRevisions?' ('+pendingRevisions+' pendente'+(pendingRevisions===1?'':'s')+').':'.')+' Após R00, informe o início de cada revisão e etapa no cronograma do cliente; não haverá encadeamento automático.</p>'
  +'<div class="inline"><button class="secondary" type="button" onclick="closeSchedulePreview()">Voltar sem salvar</button><button class="primary" type="button" onclick="confirmSchedulePreview()">Conferi as datas — confirmar cronograma</button></div></div>'
  +'</section></div>';
}
function confirmSchedulePreview(){
 const state=schedulePreviewState;
 if(!state)return;
 const input=document.getElementById('scheduleStartInput');
 if(input){
  const typed=parseDateBR(input.value);
  if(!typed){alert('Informe uma data de início válida no formato DD/MM/AAAA antes de confirmar.');return}
  if(typed!==state.startDate){schedulePreviewChooseDay(typed);alert('Atualizei a prévia com a data digitada. Confira novamente todas as datas antes de confirmar.');return}
 }
 const p=projects.find(x=>x.id===state.projectId);
 if(!p){closeSchedulePreview();return}
 let draft;
 try{draft=getScheduleDraft(p)}catch(err){alert('Não foi possível calcular o cronograma: '+err.message);return}
 if(!draft||!draft.schedule.length){alert('Defina as etapas antes de confirmar o cronograma.');return}
 const currentCount=p.schedule?.length||0;
 let message='Você conferiu todas as datas deste cronograma?\n\nInício: '+formatDateBR(draft.startDate)+'\nÚltima entrega prevista: '+(formatDateBR(draft.clientDate)||'A definir');
 if(currentCount)message+='\n\nATENÇÃO: confirmar substituirá as datas do cronograma anterior.';
 message+='\n\nDeseja realmente confirmar e salvar?';
 if(!confirm(message))return;
 // Apenas a confirmação pode persistir. As subetapas e seus responsáveis
 // são mantidos; o cálculo usa exatamente a mesma versão exibida na prévia.
 p.steps=draft.steps;
 p.startDate=draft.startDate;
 p.schedule=draft.schedule;
 p.officeDate=draft.officeDate;
 p.clientDate=draft.clientDate;
 p.deadline=draft.deadline;
 p.phase=draft.phase;
 p.holidayCalendarVersion=draft.holidayCalendarVersion;
 p.scheduleVersion=3;
 schedulePreviewState=null;
 save();
 render();
}
function createSchedule(id){
 const p=projects.find(x=>x.id===id);
 if(!p)return;
 if(!p.steps?.length&&!phases.length){alert('Este projeto ainda não possui etapas para planejar.');return}
 const now=new Date(),today=iso(now.getFullYear(),now.getMonth()+1,now.getDate());
 const selected=/^\d{4}-\d{2}-\d{2}$/.test(p.startDate||'')?p.startDate:today;
 schedulePreviewState={projectId:id,startDate:selected,year:Number(selected.slice(0,4)),month:Number(selected.slice(5,7))-1};
 render()
}
function toggleProjectRevision(id,i){
 let p=projects.find(x=>x.id===id),step=p?.steps?.[i],current=p?.schedule?.[i];
 if(!p||!step||!registrationHasOptionalReview(step))return;
 if(!p.startDate){alert('Cadastre a data de início e gere o cronograma antes de solicitar revisão.');return}
 let parts=registrationContractParts(step);
 if(parts.secondary<1){alert('Defina o prazo da revisão na ficha cadastral antes de solicitá-la.');return}
 let enable=!(current?.revisionRequested??step.revisionRequested);
 let question=enable?'Solicitar revisão do '+step.name+'? Serão acrescentados '+parts.secondary+' dias úteis e as próximas datas serão recalculadas.':'Cancelar revisão do '+step.name+' e recalcular as datas seguintes?';
 if(!confirm(question))return;
 step.revisionRequested=enable;
 if(current)current.revisionRequested=enable;
 buildScheduleForRegistration(p,p.startDate);p.scheduleVersion=3;
 if(enable&&p.status==='Concluído')p.status='Em andamento';
 save();render()
}
function completeProjectRevision(id,i){
 let p=projects.find(x=>x.id===id),s=p?.schedule?.[i];
 if(!s?.revisionRequested)return;
 s.revisionCompleted=!s.revisionCompleted;save();render()
}
function addProjectStep(id){
 let p=projects.find(x=>x.id===id);if(!p)return;
 let name=prompt('Nome da entrega:');if(!name?.trim())return;
 let owner=prompt('Responsável:',p.owner)||p.owner;
 let now=new Date(),today=iso(now.getFullYear(),now.getMonth()+1,now.getDate());
 let date=promptDateBR('Prazo da entrega',today);if(!date)return;
 date=nextBusiness(date);p.schedule=p.schedule||[];
 p.schedule.push({name:name.trim(),owner,start:date,deadline:date,days:1,completed:false});
 save();render()
}
function editProjectStep(id,i){
 let p=projects.find(x=>x.id===id),s=p?.schedule?.[i];if(!s)return;
 let date=promptDateBR('Nova data da etapa',s.deadline);if(!date)return;
 let reason=prompt('Motivo da alteração (opcional):','');if(reason===null)return;
 s.history=s.history||[];s.history.push({old:s.deadline,new:nextBusiness(date),reason});
 s.deadline=nextBusiness(date);save();render()
}
function completeProjectStep(id,i){
 const p=projects.find(x=>x.id===id),s=p?.schedule?.[i];if(!s)return;
 if(s.completed&&p.status==='Concluído'){
  if(!confirm('Este projeto está arquivado. Deseja reabri-lo para modificar a etapa?'))return;
  changeProjectStatus(p,'Em andamento','Etapa reaberta');
 }
 s.completed=!s.completed;
 const next=p.schedule.find(x=>!x.completed);
 if(next){
  p.phase=next.name;
  if(p.status==='Concluído')changeProjectStatus(p,'Em andamento','Etapa reaberta');
 }else if(p.schedule.length&&p.status!=='Concluído'){
  if(confirm('Todas as etapas foram marcadas como concluídas. Deseja concluir e arquivar o projeto agora?'))
   changeProjectStatus(p,'Concluído','Todas as etapas concluídas');
 }
 save();render();
}
function updateProject(id){
 let p=projects.find(x=>x.id===id);if(!p)return;
 let status=document.getElementById('st').value;
 let startDate=getDateInputBR('startDate','início');if(startDate===null)return;
 let officeDate=getDateInputBR('officeDate','prazo do escritório');if(officeDate===null)return;
 let clientDate=getDateInputBR('clientDate','prazo do cliente');if(clientDate===null)return;
 if(startDate&&officeDate&&officeDate<startDate){alert('O prazo do escritório não pode ser anterior ao início.');return}
 if(officeDate&&clientDate&&clientDate<officeDate){alert('O prazo do cliente não pode ser anterior ao prazo do escritório.');return}
 if((officeDate&&!businessDay(officeDate))||(clientDate&&!businessDay(clientDate))){alert('Os prazos do escritório e do cliente devem ser dias úteis. Verifique as datas e feriados.');return}
 if(status==='Concluído'&&p.status!=='Concluído'&&!confirm('Concluir e arquivar este projeto? Ele sairá de Projetos ativos, mas todos os dados serão preservados.'))return;
 if(status!=='Concluído'&&p.status==='Concluído'&&!confirm('Reabrir o projeto? Ele voltará para Projetos ativos e o histórico será mantido.'))return;
 let previousClient=p.clientDate||(/^\d{4}-\d{2}-\d{2}$/.test(p.deadline||'')?p.deadline:'');
 let changed=p.officeDate!==officeDate||previousClient!==clientDate;
 if(changed&&(p.officeDate||previousClient)){
  let reason=prompt('Motivo da alteração dos prazos:');if(reason===null)return;
  p.history=p.history||[];
  p.history.push({previousOffice:p.officeDate,previousClient,nextOffice:officeDate,nextClient:clientDate,reason,date:new Date().toISOString()})
 }
 p.startDate=startDate;p.officeDate=officeDate;p.clientDate=clientDate;p.deadline=clientDate||'A definir';
 changeProjectStatus(p,status,status==='Concluído'?'Conclusão pelo cadastro do projeto':p.status==='Concluído'?'Projeto reaberto pelo cadastro':'Situação alterada');
 save();render()
}render();
