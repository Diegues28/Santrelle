.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:15px}.weekday{text-align:center;font-size:12px;font-weight:700;color:#71807d;padding:8px 0}.cal-day{min-height:108px;border:1px solid #e4eae6;border-radius:9px;padding:7px;background:#fff;overflow:hidden}.cal-day.other{opacity:.35}.cal-day.off{background:#f4f2ed}.cal-day.today{border:2px solid #2b6868}.cal-number{font-size:12px;font-weight:700}.cal-event{display:block;width:100%;border:0;text-align:left;border-radius:5px;background:#e8f2ef;color:#27504c;font-size:11px;padding:5px;margin-top:5px;overflow-wrap:anywhere}.cal-event.overdue{background:#fbe7e1;color:#9c4832}.cal-holiday{font-size:10px;color:#946b3e;margin-top:4px}.cal-legend{font-size:12px;color:#65736d;margin-top:10px}.cal-controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.cal-controls select{max-width:180px}@media(max-width:650px){.cal-day{min-height:78px;padding:3px}.cal-event{font-size:9px;padding:3px}.cal-number{font-size:11px}.calendar-grid{gap:2px}.cal-holiday{font-size:9px}} .cal-start{background:#e8edf8;color:#354f80}.cal-office{background:#fff1d9;color:#82571d}.cal-client{background:#e8f2ed;color:#245b42}.cal-event.overdue{background:#fbe7e1;color:#9c4832}.cal-day{min-height:132px}.cal-events{display:grid;gap:4px;margin-top:6px}.cal-event{margin-top:0}.cal-owner{font-weight:700;font-size:11px;display:block;margin-bottom:2px}.cal-count{font-size:10px;color:#5b6967;margin-top:4px}.cal-event.done{opacity:.65}.cal-day:has(.cal-events) {overflow:visible}@media(max-width:650px){.cal-day{min-height:100px}.cal-owner{font-size:9px}}.cal-day{min-width:0;min-height:116px;overflow:hidden!important}.cal-daytop{display:flex;justify-content:space-between;align-items:center}.cal-count{margin:0;font-size:10px;background:#e8efec;border-radius:20px;padding:2px 6px}.cal-more{background:none;border:0;color:#276b /* Santrelle | identidade visual premium */
:root{--marfim:#F1E5DC;--taupe:#8B7663;--areia:#E2D6CB;--fendi:#AF9E8E;--marrom:#625245;--offwhite:#FAF8F5;--grafite:#3F3832;--linha:#E8DED5;font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;color:var(--grafite);background:var(--offwhite);font-synthesis:none}
body{background:var(--offwhite);color:var(--grafite);line-height:1.5}
aside{background:var(--marrom);color:var(--offwhite);border-right:1px solid #79695C;padding:32px 19px}
aside h2{letter-spacing:.11em;font-size:20px;font-weight:700}
aside small{color:#F1E5DC;letter-spacing:.04em}
nav{gap:7px}
nav button{color:#F1E5DC;border-radius:9px;font-weight:500;transition:background .18s ease}
nav button.active,nav button:hover{background:#8B7663;color:#fff}
main{max-width:1700px;padding:36px 42px}
h1,h2,h3{color:var(--grafite);letter-spacing:-.025em}
h1{font-size:30px;font-weight:650}
h3{font-weight:650}
.muted{color:#807165}
.cards{gap:17px}
.card,.panel{background:#fff;border:1px solid var(--linha);border-radius:16px;box-shadow:0 5px 20px rgba(98,82,69,.045)}
.card{transition:box-shadow .2s ease,border-color .2s ease}
.card:hover{border-color:var(--fendi);box-shadow:0 8px 25px rgba(98,82,69,.09)}
.card strong{color:var(--marrom);font-weight:650}
.primary{background:var(--marrom);color:#fff;border:1px solid var(--marrom);border-radius:9px;font-weight:600;transition:background .18s ease}
.primary:hover{background:#493C32}
.secondary{background:#fff;color:var(--marrom);border:1px solid var(--areia);border-radius:9px}
.secondary:hover{background:var(--offwhite);border-color:var(--taupe)}
input,select,textarea{background:#fff;color:var(--grafite);border:1px solid var(--areia);border-radius:9px}
input:focus-visible,select:focus-visible,button:focus-visible,.click:focus-visible{outline:2px solid var(--taupe);outline-offset:2px}
.phase{background:var(--offwhite);border:1px solid var(--linha);border-radius:13px}
.sub{background:#fff;border-left:3px solid var(--fendi);border-radius:0 8px 8px 0}
table{border-collapse:separate;border-spacing:0}
th{background:var(--offwhite);color:var(--taupe);font-weight:650;letter-spacing:.015em}
td,th{border-bottom:1px solid #F0E9E3;padding:14px 13px}
tbody tr:hover{background:#FCFAF8}
.click{color:var(--marrom);text-decoration-color:var(--fendi);text-underline-offset:3px}
.tag{background:var(--marfim);color:var(--marrom);font-weight:600}
.tag.late,.late{background:#F5E5DF;color:#95584B}
.tag.waiting,.waiting{background:#F7EFDC;color:#806A42}
.tag.good,.good{background:#EAECE3;color:#5B6951}
.note{background:#F7F0E5;color:var(--marrom);border:1px solid #EEE1D0}
.weekday{color:var(--taupe);letter-spacing:.025em}
.cal-day{background:#fff;border:1px solid var(--linha);border-radius:9px}
.cal-day.off{background:#F4F0EB}
.cal-day.today{border:2px solid var(--taupe);background:#FFFCF9}
.cal-number{color:var(--grafite)}
.cal-holiday{color:#876C55}
.cal-start{background:#EFE7E0;color:#695443}
.cal-office{background:#E7D6C5;color:#584437}
.cal-client{background:#E7E7DE;color:#5B604E}
.cal-event.overdue{background:#F5E3DE;color:#95584B}
.cal-event{border:1px solid transparent;border-radius:6px;line-height:1.3}
.cal-event:hover{border-color:var(--taupe)}
.cal-count{background:var(--marfim);color:var(--marrom)}
.cal-more{color:var(--marrom)}
.cal-agenda{background:var(--offwhite);border:1px solid var(--areia)}
.cal-legend{color:#7C6D61}
.table-scroll{border-radius:9px}
@media(max-width:850px){aside{padding:18px 16px}main{padding:22px 17px}nav{gap:5px}.cards{gap:10px}.card,.panel{padding:17px}}
@media(max-width:520px){h1{font-size:25px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card strong{font-size:25px}.calendar-head{gap:14px}.cal-controls{gap:5px}.cal-controls .primary,.cal-controls .secondary{padding:8px 10px;font-size:12px}.cal-day{border-radius:5px}.cal-agenda{padding:12px}.inline{gap:8px}}

/* Ficha cadastral do novo projeto */
.reg-intro{color:var(--taupe);margin:14px 0 19px;max-width:840px}
.reg-card{margin:17px 0;padding:25px;background:white;border:1px solid var(--linha);border-radius:16px;box-shadow:0 4px 17px rgba(98,82,69,.04)}
.reg-heading{display:flex;gap:12px;align-items:center;margin:0 0 8px}
.reg-heading h2{font-size:19px;margin:0}
.reg-number{background:var(--marfim);color:var(--marrom);display:grid;place-items:center;border-radius:50%;height:32px;width:32px;flex:none;font-weight:700}
.reg-helper{color:var(--taupe);font-size:13px;margin:0 0 20px}
.reg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 20px}
.reg-field{display:flex;flex-direction:column;gap:6px;color:var(--marrom);font-size:13px;font-weight:600}
.reg-field input,.reg-field select,.reg-field textarea{width:100%;max-width:100%;font-size:14px;font-weight:400;min-height:43px;padding:10px;color:var(--grafite);background:white}
.reg-field textarea{min-height:81px;resize:vertical}
.reg-wide{grid-column:1/-1}
.reg-required{color:#9C6255}
.reg-stage{padding:16px 0;border-top:1px solid var(--linha)}
.reg-stage:first-of-type{border-top:0}
.reg-stage h3{font-size:16px;color:var(--marrom);margin:0 0 11px}
.reg-stage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.reg-stage-total{margin-top:13px;display:flex;gap:10px;flex-wrap:wrap}
.reg-stage-total span{background:var(--offwhite);border:1px solid var(--linha);padding:8px 11px;border-radius:8px;font-size:13px;color:var(--marrom)}
.reg-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin:21px 0}
.reg-warning{margin-top:15px;padding:13px 16px;background:#F7F0E5;border:1px solid #EBDFD3;color:var(--marrom);border-radius:10px;font-size:13px}
.reg-summary{background:var(--marfim);border-radius:9px;padding:12px 15px;margin:14px 0;color:var(--marrom);font-weight:650}
@media(max-width:700px){.reg-card{padding:16px}.reg-grid{grid-template-columns:1fr}.reg-stage-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.reg-actions button{flex:1}}
@media(max-width:420px){.reg-stage-grid{grid-template-columns:1fr}}

/* Ficha: prazos contratuais por etapa, sem coluna de dias adicionais */
.reg-contract-table{border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:#fff;margin-top:15px}
.reg-contract-header,.reg-contract-row{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;align-items:center;padding:13px 18px}
.reg-contract-header{background:var(--offwhite);font-size:12px;font-weight:700;color:var(--taupe);letter-spacing:.015em}
.reg-contract-row{border-top:1px solid var(--linha)}
.reg-contract-name{color:var(--marrom);font-weight:600}
.reg-contract-row .reg-field{display:grid;grid-template-columns:1fr 100px;align-items:center;gap:8px}
.reg-contract-row .reg-field input{min-width:0;text-align:center}
@media(max-width:640px){.reg-contract-header,.reg-contract-row{grid-template-columns:minmax(0,1fr) 160px;gap:9px;padding:11px 10px}.reg-contract-row .reg-field{grid-template-columns:1fr;gap:2px}.reg-contract-row .reg-field span{font-size:11px}.reg-contract-header{font-size:11px}}

.reg-contract-subrow{background:#FAF8F5}
.reg-contract-subrow .reg-contract-name{padding-left:19px;color:#8B7663;font-weight:500;position:relative}
.reg-contract-subrow .reg-contract-name::before{content:"↳";position:absolute;left:0;color:#AF9E8E}
.reg-contract-total{padding:9px 18px 12px;text-align:right;background:#F5EEE9;border-top:1px solid var(--linha);font-size:12px;color:#625245}
@media(max-width:640px){.reg-contract-total{padding:9px 10px}.reg-contract-subrow .reg-contract-name{padding-left:14px}}
.reg-optional-note{display:block;font-size:11px;font-weight:400;color:#8B7663;margin-top:3px;line-height:1.4}.br-date-input{font-variant-numeric:tabular-nums;letter-spacing:.025em;min-width:130px}.br-date-input::placeholder{color:#9A8A7D;opacity:1}
/* Equipe: diretório compacto e compromissos individuais em ordem cronológica. */
.tag.active{background:#E5EDF3;color:#456C86}
.team-directory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:17px 0}
.team-person{display:flex;align-items:center;gap:14px;min-width:0;width:100%;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:18px 19px;text-align:left;color:var(--grafite);transition:box-shadow .18s,border-color .18s,transform .18s}
.team-person:hover{border-color:var(--fendi);box-shadow:0 7px 23px rgba(98,82,69,.09);transform:translateY(-1px)}
.team-avatar{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--marfim);color:var(--marrom);font-size:14px;font-weight:750;letter-spacing:.02em}
.team-person-text{display:flex;flex-direction:column;min-width:0;flex:1;gap:3px}.team-person-text strong{font-size:15px;color:var(--grafite);overflow-wrap:anywhere}
.team-person-text .muted{font-size:12px}
.team-arrow{margin-left:auto;font-size:24px;line-height:1;color:var(--taupe);font-weight:350}
.team-overdue-count{font-size:11px;font-weight:700;color:#98554D;white-space:nowrap}
.team-member-heading{justify-content:space-between}
.team-summary{display:flex;flex-wrap:wrap;gap:10px;margin-top:17px}
.team-summary span{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid var(--linha);border-radius:9px;font-size:12px;background:#fff}
.team-summary span strong{font-size:17px}
.team-summary-late,.team-status-late{color:#A14E48!important}
.team-summary-active,.team-status-active{color:#466F8A!important}
.team-summary-good,.team-status-good{color:#4C765A!important}
.team-timeline-panel{padding-bottom:12px}
.team-timeline{display:flex;flex-direction:column;margin-top:16px}
.team-commitment{display:flex;align-items:center;gap:15px;width:100%;padding:16px 9px;background:transparent;border:0;border-bottom:1px solid var(--linha);text-align:left;border-radius:0;color:var(--grafite)}
.team-commitment:last-child{border-bottom:0}
.team-commitment:hover{background:var(--offwhite)}
.team-date{flex:none;width:108px;font-weight:650;font-size:13px;font-variant-numeric:tabular-nums;color:var(--marrom)}
.team-commitment-body{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.team-commitment-body strong{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.team-commitment-body .muted{font-size:12px}
.team-status{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;font-size:11px;font-weight:700;padding:7px 10px;border-radius:8px}
.team-status-late{background:#F5E5E2}
.team-status-active{background:#E7EFF4}
.team-status-good{background:#E8F0E9}
@media(max-width:780px){.team-directory{grid-template-columns:1fr}.team-person{padding:15px}.team-date{width:90px}.team-commitment{gap:10px}.team-summary{gap:6px}}
@media(max-width:520px){.team-commitment{display:grid;grid-template-columns:1fr auto;gap:7px 10px;padding:13px 4px}.team-date{grid-column:1;grid-row:1;width:auto;font-size:12px}.team-commitment-body{grid-column:1;grid-row:2}.team-status{grid-column:2;grid-row:1;white-space:nowrap;font-size:10px;padding:5px 7px}.team-commitment .team-arrow{grid-column:2;grid-row:2;justify-self:end}.team-person{gap:10px}.team-overdue-count{font-size:10px}.team-member-heading button{font-size:12px}}

/* Responsaveis por subetapa: painel do projeto */
.project-substage{margin-top:17px;padding:16px;border:1px solid var(--linha);border-radius:12px;background:var(--offwhite)}
.project-substage-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.project-substage-title strong{font-size:16px;color:var(--marrom)}
.project-subtask{padding:15px 16px;background:#fff;border:1px solid var(--linha);border-radius:10px;margin:10px 0}
.project-subtask-heading{display:flex;align-items:center;justify-content:space-between;gap:14px}
.project-subtask-heading strong{font-size:14px;color:var(--grafite)}
.project-subtask-heading .muted{font-size:12px;margin-top:5px}
.project-subtask-waiting{background:#F5EFDF;color:#7D6B43}
.project-subtask-controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-top:14px}
.project-subtask-controls label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--taupe);font-weight:600}
.project-subtask-controls label:first-child{flex:1 1 195px;min-width:160px}
.project-subtask-controls select{min-width:160px;max-width:100%}
.project-subtask-days{display:flex;gap:7px;align-items:center;color:var(--grafite);font-weight:400}
.project-subtask-days input{width:76px;padding:9px}
.project-subtask-buttons{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.project-subtask-buttons button{padding:9px 11px;font-size:12px}
.project-add-subtask{margin-top:10px}
@media(max-width:650px){.project-substage{padding:10px}.project-subtask{padding:12px}.project-subtask-controls{gap:10px}.project-subtask-controls label:first-child{flex:1 1 100%}.project-subtask-controls select{width:100%}.project-subtask-buttons{margin-left:0;width:100%}.project-subtask-buttons button{flex:1}.project-subtask-heading{align-items:flex-start}.project-subtask-heading .team-status{margin-top:3px}}

/* Subetapas no projeto: mesma linha compacta do modelo, com responsável por atividade. */
.project-subpanel-heading{justify-content:space-between;align-items:center;margin-bottom:20px}
.project-subpanel-intro{flex:1;min-width:240px}
.project-substage{padding:0;border:0;background:transparent;margin:24px 0 0}
.project-substage-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px;padding:0 3px}
.project-substage-title strong{font-size:15px}
.project-subrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:7px 0;padding:12px 13px;background:#fff;border:1px solid #F1E9E3;border-left:3px solid var(--fendi);border-radius:4px}
.project-subrow-name{min-width:190px;flex:1 1 34%;display:flex;flex-direction:column;gap:4px}
.project-subrow-name strong{font-size:13px;color:var(--grafite);font-weight:550;line-height:1.4}
.project-subrow-name .muted{font-size:11px}
.project-subrow-controls{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex:0 1 auto}
.project-subrow-controls select{width:185px;min-width:145px;padding:10px 9px;font-size:12px}
.project-sub-days{display:inline-flex;align-items:center;gap:8px;color:var(--grafite);white-space:nowrap;font-size:12px}
.project-sub-days input{width:72px;min-width:60px;padding:9px;font-size:13px}
.project-subrow-controls .secondary{padding:9px 10px;font-size:12px}
.project-completion{display:grid;place-items:center;flex:none;border:0;border-radius:8px;width:33px;height:34px;font-size:18px;cursor:pointer}
.project-completion:hover{filter:brightness(.95)}
.project-remove-sub{font-size:17px!important;min-width:33px}
.project-add-subtask{margin-top:7px;font-size:13px}

let projects=JSON.parse(localStorage.getItem('santrelle_projects')||'null')||seed;let phases=JSON.parse(localStorage.getItem('santrelle_phases')||'null')||initial;let page='painel',filter='Todos',selected=null,registrationEditId=null,teamSelectedOwner=null;let calendarMonth=new Date().getMonth(),calendarYear=new Date().getFullYear(),calendarOwner='Todos',expandedDay=null;let employees=JSON.parse(localStorage.getItem('santrelle_employees')||'null')||[{name:'Ana'},{name:'Joyce'},{name:'Leonardo'}];let deliveries=JSON.parse(localStorage.getItem('santrelle_deliveries')||'[]');let extraHolidays=JSON.parse(localStorage.getItem('santrelle_holidays')||'[]');const el=document.getElementById('content');function save(){localStorage.setItem('santrelle_projects',JSON.stringify(projects));localStorage.setItem('santrelle_phases',JSON.stringify(phases));localStorage.setItem('santrelle_deliveries',JSON.stringify(deliveries));localStorage.setItem('santrelle_holidays',JSON.stringify(extraHolidays));localStorage.setItem('santrelle_employees',JSON.stringify(employees))}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tag(s){return '<span class="tag '+(s==='Atrasado'?'late':s==='Em andamento'?'active':s==='Concluído'?'good':'waiting')+'">'+esc(s)+'</span>'}function go(p){page=p;selected=null;teamSelectedOwner=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));function rows(list){let fmt=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'')?x.split('-').reverse().join('/'):'—';return '<div class="table-scroll"><table><thead><tr><th>Projeto / cliente</th><th>Etapa</th><th>Equipe das subetapas</th><th>Início</th><th>Prazo escritório</th><th>Prazo cliente</th><th>Situação</th></tr></thead><tbody>'+list.map(p=>{let owners=projectAssignedOwners(p);return '<tr><td><a class="click" oncl /* Responsabilidade pertence a cada subetapa do projeto, nunca à etapa inteira. */
function projectSteps(p){return p.steps||phases}
function projectSubOwner(p,i,j){
 const sub=projectSteps(p)[i]?.subs?.[j];
 if(!sub)return 'Não definido';
 if(Object.prototype.hasOwnProperty.call(sub,'owner'))return sub.owner||'Não definido';
 // Preserva atribuições feitas antes da migração da etapa para as subetapas.
 return projectSteps(p)[i]?.owner||p.schedule?.[i]?.owner||'Não definido';
}
function subIsOptionalRevision(step,sub){
 if(!step||!sub||!registrationHasOptionalReview(step))return false;
 return sub.reviewOptional===true||(!Object.prototype.hasOwnProperty.call(sub,'reviewOptional')&&/revis/i.test((sub.name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')));
}
function subIsCompatibility(step,sub){
 if(!step||!sub||!registrationIsCompatibility(step))return false;
 return sub.compatibility===true||(!Object.prototype.hasOwnProperty.call(sub,'compatibility')&&/compatibil/i.test((sub.name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')));
}
function substepDueDate(p,i,j){
 const stage=p.schedule?.[i],step=projectSteps(p)[i],sub=step?.subs?.[j];
 if(!stage||!sub||!/^\d{4}-\d{2}-\d{2}$/.test(stage.start||''))return '';
 if(subIsOptionalRevision(step,sub))return stage.revisionRequested?stage.revisionDeadline||'':'';
 if(subIsCompatibility(step,sub))return stage.clientDeadline||stage.deadline||'';
 const eligible=(step.subs||[]).map((s,k)=>({s,k})).filter(x=>!subIsOptionalRevision(step,x.s)&&!subIsCompatibility(step,x.s));
 const position=eligible.findIndex(x=>x.k===j);if(position<0)return '';
 const total=eligible.reduce((sum,x)=>sum+Math.max(1,Math.floor(Number(x.s.days)||1)),0);
 const until=eligible.slice(0,position+1).reduce((sum,x)=>sum+Math.max(1,Math.floor(Number(x.s.days)||1)),0);
 const days=Math.max(1,Math.floor(Number(stage.days)||1));
 if(position===eligible.length-1&&/^\d{4}-\d{2}-\d{2}$/.test(stage.deadline||''))return stage.deadline;

}
function projectSubstepEntries(p){
 const entries=[],steps=projectSteps(p);
 for(let i=0;i<steps.length;i++){
  for(let j=0;j<(steps[i]?.subs||[]).length;j++){
   const sub=steps[i].subs[j],owner=projectSubOwner(p,i,j),date=substepDueDate(p,i,j),stage=p.schedule?.[i];
   if(!date||!owner||owner==='Não definido'||owner==='Sem responsável')continue;
   const isRevision=subIsOptionalRevision(steps[i],sub);
   const completed=sub.completed===true||(sub.completed===undefined&&(isRevision?!!stage?.revisionCompleted:!!stage?.completed));
   entries.push({id:'u'+p.id+'_'+i+'_'+j,name:(sub.name||'Subetapa')+' · '+steps[i].name+' · '+p.name,
    owner,date,projectId:p.id,stageIndex:i,subIndex:j,completed,kind:'suboffice'});
  }
 }
 return entries;
}
function projectAssignedOwners(p){
 const names=new Set();
 const steps=projectSteps(p);
 for(let i=0;i<steps.length;i++)for(let j=0;j<(steps[i].subs||[]).length;j++){
  const name=projectSubOwner(p,i,j);
  if(name&&name!=='Não definido'&&name!=='Sem responsável')names.add(name);
 }

}
function teamMembers(){

 const unique=new Map();

  if(typeof owner!=='string')continue;
  const clean=owner.trim();
  if(!clean||clean==='Não definido'||clean==='Sem responsável')continue;
  const key=clean.toLocaleLowerCase('pt-BR');
  if(!unique.has(key))unique.set(key,clean);

}
function teamCommitments(owner){

  if(e.kind!=='suboffice'&&e.kind!=='delivery')return false;

function teamCommitmentStatus(e,today){

function iso(y,m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function parseISO(s){let a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)}
/* Datas visíveis em DD/MM/AAAA; armazenamento e cálculos permanecem em AAAA-MM-DD. */
function formatDateBR(value){
 const v=String(value||'');
 if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v.slice(8,10)+'/'+v.slice(5,7)+'/'+v.slice(0,4);
 return v;
}
function parseDateBR(value){
 const v=String(value??'').trim();
 if(!v)return '';
 const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v);
 if(!m)return null;
 const day=Number(m[1]),month=Number(m[2]),year=Number(m[3]);
 if(year<1900||year>2100)return null;
 const d=new Date(year,month-1,day,12);
 if(d.getFullYear()!==year||d.getMonth()!==month-1||d.getDate()!==day)return null;
 return iso(year,month,day);
}

function easter(y){let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k+7)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=(h+l-7*m+114)%31+1;return new Date(y,month-1,day,12)}

function holidayInfo(date){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return null;
 const official=officialHolidays(Number(date.slice(0,4)))[date.slice(5)];
 const extra=extraHolidays.filter(x=>x.date===date);
 if(official)return {...official,other:extra.map(x=>x.name)};
 if(extra.length)return {name:extra.map(x=>x.name).join(' / '),type:'escritorio',other:[]};
 return null
}
function holidays(y){
 const byName=Object.fromEntries(Object.entries(officialHolidays(y)).map(([day,info])=>[day,info.name]));
 for(const folga of extraHolidays)if(folga.date.startsWith(String(y)))byName[folga.date.slice(5)]=[byName[folga.date.slice(5)],folga.name].filter(Boolean).join(' / ');
 return byName
}

function businessDay(date){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return false;

}

function addBusinessDays(start,count){let d=start;for(let i=0;i<count;i++){d=offsetDay(parseISO(d),1);d=nextBusiness(d)}return d}
function calendarEntries(){let entries=[];for(let p of projects){let completed=p.status==='Concluído';let valid=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'');if(valid(p.startDate))entries.push({id:'p'+p.id,name:'Início: '+p.name,owner:p.owner,date:p.startDate,projectId:p.id,completed:true,kind:'start'});if(valid(p.officeDate))entries.push({id:'p'+p.id,name:'Prazo escritório: '+p.name,owner:p.owner,date:p.officeDate,projectId:p.id,completed,kind:'office'});let client=p.clientDate||(valid(p.deadline)?p.deadline:'');if(valid(client))entries.push({id:'p'+p.id,name:'Entrega cliente: '+p.name,owner:p.owner,date:client,projectId:p.id,completed,kind:'client'});for(let [i,step] of (p.schedule||[]).entries()){if(valid(step.deadline))entries.push({id:'s'+p.id+'_'+i,name:'Etapa escritório: '+step.name+' · '+p.name,owner:projectSteps(p)?.length?'Equipe':(step.owner||p.owner),date:step.deadline,projectId:p.id,completed:!!step.completed,kind:'office'});if(valid(step.clientDeadline))entries.push({id:'s'+p.id+'_'+i,name:(registrationIsCompatibility(step)&&step.contractualParts?.secondary>0?'Entrega e compatibilização: '+step.name:'Apresentação ao cliente: '+step.name)+' · '+p.name,owner:projectSteps(p)?.length?'Equipe':(step.owner||p.owner),date:step.clientDeadline,projectId:p.id,completed:!!step.completed,kind:'client'});if(registrationHasOptionalReview(step)&&step.revisionRequested&&valid(step.revisionDeadline))entries.push({id:'r'+p.id+'_'+i,name:'Revisão solicitada: '+step.name+' · '+p.name,owner:projectSteps(p)?.length?'Equipe':(step.owner||p.owner),date:step.revisionDeadline,projectId:p.id,completed:!!step.revisionCompleted,kind:'client'})}entries.push(...projectSubstepEntries(p))}return entries.concat(deliveries.map(d=>({...d,id:'d'+d.id,kind:'delivery'})))}

function addEmployee(){let name=prompt('Nome do funcionário:');if(!name?.trim())return;name=name.trim();if(employees.some(e=>e.name.toLowerCase()===name.toLowerCase())){alert('Funcionário já cadastrado.');return}employees.push({name});save();render()}function removeEmployee(name){if(!confirm('Excluir '+name+' da lista da equipe? Os projetos e entregas existentes continuarão vinculados ao nome.'))return;employees=employees.filter(e=>e.name!==name);save();render()}function phaseOfficeDays(p){return (p.subs||[]).reduce((total,s)=>total+Math.max(1,Math.floor(Number(s.days)||1)),0)}function models(){el.innerHTML='<section class="panel"><h3>Modelo padrão de etapas e subetapas</h3><p class="muted">O prazo do escritório é a soma das subetapas. O prazo do cliente soma os dias adicionais ao prazo interno. Todos em dias úteis.</p>'+phases.map((p,i)=>'<div class="phase"><div class="inline"><strong>'+esc(p.name)+'</strong><span class="muted">Prazo do escritório: <strong>'+phaseOfficeDays(p)+' dias úteis</strong></span><label>Dias adicionais até entrega ao cliente <input type="number" min="0" style="width:75px" value="'+(p.clientExtraDays||0)+'" onchange="setClientExtraDays('+i+',this.value)"> dias</label><span class="muted">Total cliente: '+(phaseOfficeDays(p)+Number(p.clientExtraDays||0))+' dias úteis</span><button class="secondary" onclick="renamePhase('+i+')">Renomear</button><button class="secondary" onclick="movePhase('+i+',-1)">↑</button><button class="secondary" onclick="movePhase('+i+',1)">↓</button><button class="secondary" onclick="removePhase('+i+')">Excluir</button></div>'+p.subs.map((s,j)=>'<div class="sub"><span>'+esc(s.name)+'</span><div class="inline"><input aria-label="Dias úteis" type="number" min="1" style="width:75px" value="'+s.days+'" onchange="setSubDays('+i+','+j+',this.value)"> dias <button class="secondary" onclick="renameSub('+i+','+j+')">Editar</button><button class="secondary" onclick="moveSub('+i+','+j+')">Mover</button><button class="secondary" onclick="removeSub('+i+','+j+')">×</button></div></div>').join('')+'<button class="secondary" onclick="addSub('+i+')">+ Adicionar subetapa</button></div>').join('')+'<button class="primary" onclick="addPhase()">+ Adicionar etapa</button></section>'}function setClientExtraDays(i,v){phases[i].clientExtraDays=Math.max(0,Math.floor(Number(v)||0));save();render()}function setSubDays(i,j,v){phases[i].subs[j].days=Math.max(1,+v||1);save();render()}function addPhase(){let name=prompt('Nome da nova etapa:');if(!name?.trim())return;let days=+(prompt('Duração prevista em dias úteis:', '3')||3);phases.push({name:name.trim(),days:Math.max(1,days),clientExtraDays:0,subs:[]});save();render()}function addSub(i){let name=prompt('Nome da nova subetapa:');if(!name?.trim())return;let days=+(prompt('Duração prevista em dias úteis:', '1')||1);phases[i].subs.push({name:name.trim(),days:Math.max(1,days)});save();render()}function renamePhase(i){let v=prompt('Nome da etapa:',phases[i].name);if(v?.trim()){phases[i].name=v.trim();save();render()}}function renameSub(i,j){let v=prompt('Nome da subetapa:',phases[i].subs[j].name);if(v?.trim()){phases[i].subs[j].name=v.trim();save();render()}}function removePhase(i){if(confirm('Excluir etapa e todas as subetapas?')){phases.splice(i,1);save();render()}}function removeSub(i,j){phases[i].subs.splice(j,1);save();render()}function movePhase(i,d){let n=i+d;if(n<0||n>=phases.length)return;[phases[i],phases[n]]=[phases[n],phases[i]];save();render()}function moveSub(i,j){let to=prompt('Mover para qual etapa?\n'+phases.map((p,k)=>(k+1)+' - '+p.name).join('\n'),String(i+1));let k=+to-1;if(!phases[k])return;phases[k].subs.push(phases[i].subs.splice(j,1)[0]);save();render()}

function defaultRegistrationSteps(){
 // Cada cliente recebe uma cópia de todas as subetapas do modelo do escritório.
 // Responsáveis e estados ficam independentes por projeto.
 const normalize=name=>String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const definitions=[
  {name:'Levantamento',match:'levantamento',fallback:[{name:'Levantamento',days:2}]},
  {name:'Estudo preliminar',match:'estudo preliminar',fallback:[{name:'Desenvolvimento do estudo preliminar',days:7},{name:'Revisão',days:3}]},
  {name:'Anteprojeto',match:'anteprojeto',fallback:[{name:'Desenvolvimento do anteprojeto',days:7},{name:'Revisão',days:3}]},
  {name:'Projeto executivo',match:'executivo',fallback:[{name:'Desenvolvimento do executivo',days:16},{name:'Compatibilização com projeto dos móveis planejados',days:4}]}
 ];
 return definitions.map(def=>{
  const model=phases.find(p=>normalize(p.name).includes(def.match));
  const subs=(model?.subs?.length?model.subs:def.fallback).map(sub=>({
   name:String(sub.name||'Subetapa'),
   days:Math.max(1,Math.floor(Number(sub.days)||1)),
   owner:'Não definido',
   ...(sub.reviewOptional===true?{reviewOptional:true}:{}),
   ...(sub.compatibility===true?{compatibility:true}:{})
  }));
  return {name:def.name,subs,clientExtraDays:0};
 })
}
function registrationStageLabel(step){let n=(step?.name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();if(n.includes('estudo preliminar'))return 'Estudo preliminar';if(n.includes('anteprojeto'))return 'Anteprojeto';if(n.includes('executivo'))return 'Projeto executivo';return step?.name||'Etapa'}
function registrationHasSecondary(step){let n=registrationStageLabel(step).toLowerCase();return n.includes('estudo preliminar')||n.includes('anteprojeto')||n.includes('executivo')}
function registrationSecondaryLabel(step){let n=registrationStageLabel(step).toLowerCase();if(n.includes('estudo preliminar'))return 'Revisão do estudo preliminar';if(n.includes('anteprojeto'))return 'Revisão do anteprojeto';if(n.includes('executivo'))return 'Compatibilização com projeto dos móveis planejados';return ''}
function registrationContractParts(step){
 if(!step)return {main:1,secondary:0};
 let old=Number(step.contractualDays)>=1?Math.floor(Number(step.contractualDays)):Math.max(1,phaseOfficeDays(step)+Math.max(0,Number(step.clientExtraDays)||0));
 if(step.contractualParts&&Number(step.contractualParts.main)>=1){
   let main=Math.max(1,Math.floor(Number(step.contractualParts.main))),secondary=registrationHasSecondary(step)?Math.max(0,Math.floor(Number(step.contractualParts.secondary)||0)):0;
   return {main,secondary};
 }
 if(!registrationHasSecondary(step))return {main:old,secondary:0};
 let secondary=Math.min(Math.max(0,Math.floor(Number(step.subs?.at(-1)?.days)||0)),Math.max(0,old-1));
 return {main:old-secondary,secondary};
}
function registrationIsCompatibility(step){return registrationStageLabel(step).toLowerCase().includes('executivo')}
function registrationHasOptionalReview(step){return registrationHasSecondary(step)&&!registrationIsCompatibility(step)}
function registrationContractDays(step){let p=registrationContractParts(step);return p.main+(registrationIsCompatibility(step)?p.secondary:0)}

function buildScheduleForRegistration(p,start){
 let cursor=nextBusiness(start),previous=new Map((p.schedule||[]).map(s=>[s.name,s]));p.startDate=cursor;p.schedule=[];
 for(let step of p.steps){
  let parts=registrationContractParts(step),base=registrationContractDays(step),end=addBusinessDays(cursor,parts.main-1),clientDeadline=addBusinessDays(cursor,base-1),before=previous.get(step.name)||{};
  let revisionRequested=registrationHasOptionalReview(step)&&!!(step.revisionRequested??before.revisionRequested);
  let reviewDays=revisionRequested?parts.secondary:0;
  let revisionStart=reviewDays?nextBusiness(offsetDay(parseISO(clientDeadline),1)):null;
  let revisionDeadline=reviewDays?addBusinessDays(revisionStart,reviewDays-1):null;
  p.schedule.push({name:step.name,owner:step.owner||before.owner||'Não definido',start:cursor,deadline:end,clientDeadline,days:parts.main,contractualDays:base,contractualParts:parts,clientExtraDays:0,completed:!!before.completed,history:before.history||[],revisionRequested,revisionStart,revisionDeadline,revisionCompleted:revisionRequested?!!before.revisionCompleted:false});
  cursor=nextBusiness(offsetDay(parseISO(revisionDeadline||clientDeadline),1))
 }
 p.officeDate=p.schedule.at(-1)?.deadline||'';p.clientDate=p.schedule.at(-1)?.revisionDeadline||p.schedule.at(-1)?.clientDeadline||'';p.deadline=p.clientDate||'A definir';p.phase=p.schedule.find(s=>!s.completed)?.name||p.schedule[0]?.name||'A definir'

 if(selection===null)return;

  const position=prompt('Nova posição dentro desta etapa (1 a '+steps[i].subs.length+'): ',String(j+1));

function syncProjectSubsteps(id){
 const p=projects.find(x=>x.id===id);if(!p)return;
 if(!confirm('Adicionar as subetapas que faltam, conforme a aba Etapas e modelos? As subetapas existentes e seus responsáveis não serão alterados.'))return;
 p.steps=p.steps||structuredClone(phases);
 const normalize=str=>String(str||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
 const model=defaultRegistrationSteps();
 let added=0;
 for(let i=0;i<model.length;i++){
  const source=model[i];
  let target=p.steps.find(s=>normalize(s.name)===normalize(source.name));
  if(!target){
   target=structuredClone(source);p.steps.push(target);added+=(target.subs||[]).length;continue;
  }
  target.subs=target.subs||[];
  const existing=new Set(target.subs.map(s=>normalize(s.name)));
  for(const sub of source.subs||[]){
   const key=normalize(sub.name);
   if(existing.has(key))continue;
   target.subs.push(structuredClone(sub));
   existing.add(key);added++;
  }
 }
 if(added)save();
 render();
 alert(added?added+' subetapa(s) do modelo adicionada(s) a este projeto. Os responsáveis anteriores foram preservados.':'Este projeto já possui todas as subetapas do modelo.');
}

function completeProjectStep(id,i){let p=projects.find(x=>x.id===id),s=p.schedule[i];s.completed=!s.completed;let next=p.schedule.find(x=>!x.completed);if(next)p.phase=next.name;else if(p.schedule.length)p.status='Concluído';save();render()}function updateProject(id){
 let p=projects.find(x=>x.id===id);if(!p)return;
 let status=document.getElementById('st').value;
 let startDate=getDateInputBR('startDate','início');if(startDate===null)return;
 let officeDate=getDateInputBR('officeDate','prazo do escritório');if(officeDate===null)return;
 let clientDate=getDateInputBR('clientDate','prazo do cliente');if(clientDate===null)return;
 if(startDate&&officeDate&&officeDate<startDate){alert('O prazo do escritório não pode ser anterior ao início.');return}
 if(officeDate&&clientDate&&clientDate<officeDate){alert('O prazo do cliente não pode ser anterior ao prazo do escritório.');return}
 if((officeDate&&!businessDay(officeDate))||(clientDate&&!businessDay(clientDate))){alert('Os prazos do escritório e do cliente devem ser dias úteis. Verifique as datas e feriados.');return}
 let previousClient=p.clientDate||(/^\d{4}-\d{2}-\d{2}$/.test(p.deadline||'')?p.deadline:'');
 let changed=p.officeDate!==officeDate||previousClient!==clientDate;
 if(changed&&(p.officeDate||previousClient)){
  let reason=prompt('Motivo da alteração dos prazos:');if(reason===null)return;
  p.history=p.history||[];
  p.history.push({previousOffice:p.officeDate,previousClient,nextOffice:officeDate,nextClient:clientDate,reason,date:new Date().toISOString()})
 }
 p.startDate=startDate;p.officeDate=officeDate;p.clientDate=clientDate;p.deadline=clientDate||'A definir';p.status=status;
 save();render()
}render();
