0px;border-left:3px solid #bdd0c9;background:white;display:flex;justify-content:space-between;gap:10px;align-items:center}.hidden{display:none}.click{color:#246465;text-decoration:underline;cursor:pointer}.note{font-size:13px;background:#fff8e8;border-radius:9px;padding:11px;margin-top:15px}@media(max-width:850px){aside{position:static;width:100%;min-height:0;padding:16px}nav{display:flex;overflow:auto;margin-top:14px}nav button{white-space:nowrap}main{margin:0;padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}table{display:block;overflow-x:auto}}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:15px}.weekday{text-align:center;font-size:12px;font-weight:700;color:#71807d;padding:8px 0}.cal-day{min-height:108px;border:1px solid #e4eae6;border-radius:9px;padding:7px;background:#fff;overflow:hidden}.cal-day.other{opacity:.35}.cal-day.off{background:#f4f2ed}.cal-day.today{border:2px solid #2b6868}.cal-number{font-size:12px;font-weight:700}.cal-event{display:block;width:100%;border:0;text-align:left;border-radius:5px;background:#e8f2ef;color:#27504c;font-size:11px;padding:5px;margin-top:5px;overflow-wrap:anywhere}.cal-event.overdue{background:#fbe7e1;color:#9c4832}.cal-holiday{font-size:10px;color:#946b3e;margin-top:4px}.cal-legend{font-size:12px;color:#65736d;margin-top:10px}.cal-controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.cal-controls select{max-width:180px}@media(max-width:650px){.cal-day{min-height:78px;padding:3px}.cal-event{font-size:9px;padding:3px}.cal-number{font-size:11px}.calendar-grid{gap:2px}.cal-holiday{font-size:9px}} .cal-start{background:#e8edf8;color:#354f80}.cal-office{background:#fff1d9;color:#82571d}.cal-client{background:#e8f2ed;color:#245b42}.cal-event.overdue{background:#fbe7e1;color:#9c4832}.cal-day{min-height:132px}.cal-events{display:grid;gap:4px;margin-top:6px}.cal-event{margin-top:0}.cal-owner{font-weight:700;font-size:11px;display:block;margin-bottom:2px}.cal-count{font-size:10px;color:#5b6967;margin-top:4px}.cal-event.done{opacity:.65}.cal-day:has(.cal-events) {overflow:visible}@media(max-width:650px){.cal-day{min-height:100px}.cal-owner{font-size:9px}}.cal-day{min-width:0;min-height:116px;overflow:hidden!important}.cal-daytop{display:flex;justify-content:space-between;align-items:center}.cal-count{margin:0;font-size:10px;background:#e8efec;border-radius:20px;padding:2px 6px}.cal-more{background:none;border:0;color:#276b69;font-size:11px;font-weight:700;padding:6px 2px;text-align:left}.cal-event{display:flex;flex-direction:column;gap:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis}.cal-events{min-width:0}.cal-agenda{margin-top:15px;padding:16px;border-radius:12px;background:#f6f9f7;border:1px solid #d9e5df}.cal-agenda-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:12px}.cal-agenda-list .cal-event{padding:10px;font-size:13px}@media(max-width:700px){.calendar-grid{grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}.cal-day{min-height:75px;padding:3px}.cal-day .cal-event{display:none}.cal-day .cal-events{display:none}.cal-day .cal-more{font-size:9px;padding:3px 0}.cal-day .cal-count{font-size:9px;padding:1px 3px}.cal-holiday{font-size:8px;overflow-wrap:anywhere}.calendar-head{align-items:flex-start}.cal-controls{width:100%}.cal-agenda-list{grid-template-columns:1fr}.cal-day:has(.cal-count){cursor:pointer}} .table-scroll{overflow-x:auto;width:100%}.table-scroll table{min-width:850px}.table-scroll th{white-space:nowrap}.table-scroll td{white-space:nowrap}
/* Santrelle | identidade visual premium */
:root{--marfim:#F1E5DC;--taupe:#8B7663;--areia:#E2D6CB;--fendi:#AF9E8E;--marrom:#625245;--offwhite:#FAF8F5;--grafite:#3F3832;--linha:#E8DED5;font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;color:var(--grafite);background:var(--offwhite);font-synthesis:none}
body{background:var(--offwhite);color:var(--grafite);line-height:1.5}
aside{background:var(--marrom);color:var(--offwhite);border-right:1px solid #79695C;padding:32px 19px}
aside h2{letter-spacing:.11em;font-size:20px;font-weight:700}
aside small{color:#F1E5DC;letter-spacing:.04em}
nav{gap:7px}
nav button{color:#F1E5DC;border-radius:9px;font-weight:500;transition:background .18s ease}
nav button.active,nav button:hover{background:#8B7663;color:#fff}
main{max-width:1700px;padding:36px 42px}
h1,h2,h3{color:var(--grafite);letter-spacing:-.025em}
h1{font-size:30px;font-weight:650}
h3{font-weight:650}
.muted{color:#807165}
.cards{gap:17px}
.card,.panel{background:#fff;border:1px solid var(--linha);border-radius:16px;box-shadow:0 5px 20px rgba(98,82,69,.045)}
.card{transition:box-shadow .2s ease,border-color .2s ease}
.card:hover{border-color:var(--fendi);box-shadow:0 8px 25px rgba(98,82,69,.09)}
.card strong{color:var(--marrom);font-weight:650}
.primary{background:var(--marrom);color:#fff;border:1px solid var(--marrom);border-radius:9px;font-weight:600;transition:background .18s ease}
.primary:hover{background:#493C32}
.secondary{background:#fff;color:var(--marrom);border:1px solid var(--areia);border-radius:9px}
.secondary:hover{background:var(--offwhite);border-color:var(--taupe)}
input,select,textarea{background:#fff;color:var(--grafite);border:1px solid var(--areia);border-radius:9px}
input:focus-visible,select:focus-visible,button:focus-visible,.click:focus-visible{outline:2px solid var(--taupe);outline-offset:2px}
.phase{background:var(--offwhite);border:1px solid var(--linha);border-radius:13px}
.sub{background:#fff;border-left:3px solid var(--fendi);border-radius:0 8px 8px 0}
table{border-collapse:separate;border-spacing:0}
th{background:var(--offwhite);color:var(--taupe);font-weight:650;letter-spacing:.015em}
td,th{border-bottom:1px solid #F0E9E3;padding:14px 13px}
tbody tr:hover{background:#FCFAF8}
.click{color:var(--marrom);text-decoration-color:var(--fendi);text-underline-offset:3px}
.tag{background:var(--marfim);color:var(--marrom);font-weight:600}
.tag.late,.late{background:#F5E5DF;color:#95584B}
.tag.waiting,.waiting{background:#F7EFDC;color:#806A42}
.tag.good,.good{background:#EAECE3;color:#5B6951}
.note{background:#F7F0E5;color:var(--marrom);border:1px solid #EEE1D0}
.weekday{color:var(--taupe);letter-spacing:.025em}
.cal-day{background:#fff;border:1px solid var(--linha);border-radius:9px}
.cal-day.off{background:#F4F0EB}
.cal-day.today{border:2px solid var(--taupe);background:#FFFCF9}
.cal-number{color:var(--grafite)}
.cal-holiday{color:#876C55}
.cal-start{background:#EFE7E0;color:#695443}
.cal-office{background:#E7D6C5;color:#584437}
.cal-client{background:#E7E7DE;color:#5B604E}
.cal-event.overdue{background:#F5E3DE;color:#95584B}
.cal-event{border:1px solid transparent;border-radius:6px;line-height:1.3}
.cal-event:hover{border-color:var(--taupe)}
.cal-count{background:var(--marfim);color:var(--marrom)}
.cal-more{color:var(--marrom)}
.cal-agenda{background:var(--offwhite);border:1px solid var(--areia)}
.cal-legend{color:#7C6D61}
.table-scroll{border-radius:9px}
@media(max-width:850px){aside{padding:18px 16px}main{padding:22px 17px}nav{gap:5px}.cards{gap:10px}.card,.panel{padding:17px}}
@media(max-width:520px){h1{font-size:25px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card strong{font-size:25px}.calendar-head{gap:14px}.cal-controls{gap:5px}.cal-controls .primary,.cal-controls .secondary{padding:8px 10px;font-size:12px}.cal-day{border-radius:5px}.cal-agenda{padding:12px}.inline{gap:8px}}

/* Ficha cadastral do novo projeto */
.reg-intro{color:var(--taupe);margin:14px 0 19px;max-width:840px}
.reg-card{margin:17px 0;padding:25px;background:white;border:1px solid var(--linha);border-radius:16px;box-shadow:0 4px 17px rgba(98,82,69,.04)}
.reg-heading{display:flex;gap:12px;align-items:center;margin:0 0 8px}
.reg-heading h2{font-size:19px;margin:0}
.reg-number{background:var(--marfim);color:var(--marrom);display:grid;place-items:center;border-radius:50%;height:32px;width:32px;flex:none;font-weight:700}
.reg-helper{color:var(--taupe);font-size:13px;margin:0 0 20px}
.reg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 20px}
.reg-field{display:flex;flex-direction:column;gap:6px;color:var(--marrom);font-size:13px;font-weight:600}
.reg-field input,.reg-field select,.reg-field textarea{width:100%;max-width:100%;font-size:14px;font-weight:400;min-height:43px;padding:10px;color:var(--grafite);background:white}
.reg-field textarea{min-height:81px;resize:vertical}
.reg-wide{grid-column:1/-1}
.reg-required{color:#9C6255}
.reg-stage{padding:16px 0;border-top:1px solid var(--linha)}
.reg-stage:first-of-type{border-top:0}
.reg-stage h3{font-size:16px;color:var(--marrom);margin:0 0 11px}
.reg-stage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.reg-stage-total{margin-top:13px;display:flex;gap:10px;flex-wrap:wrap}
.reg-stage-total span{background:var(--offwhite);border:1px solid var(--linha);padding:8px 11px;border-radius:8px;font-size:13px;color:var(--marrom)}
.reg-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin:21px 0}
.reg-warning{margin-top:15px;padding:13px 16px;background:#F7F0E5;border:1px solid #EBDFD3;color:var(--marrom);border-radius:10px;font-size:13px}
.reg-summary{background:var(--marfim);border-radius:9px;padding:12px 15px;margin:14px 0;color:var(--marrom);font-weight:650}
@media(max-width:700px){.reg-card{padding:16px}.reg-grid{grid-template-columns:1fr}.reg-stage-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.reg-actions button{flex:1}}
@media(max-width:420px){.reg-stage-grid{grid-template-columns:1fr}}

/* Ficha: prazos contratuais por etapa, sem coluna de dias adicionais */
.reg-contract-table{border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:#fff;margin-top:15px}
.reg-contract-header,.reg-contract-row{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;align-items:center;padding:13px 18px}
.reg-contract-header{background:var(--offwhite);font-size:12px;font-weight:700;color:var(--taupe);letter-spacing:.015em}
.reg-contract-row{border-top:1px solid var(--linha)}
.reg-contract-name{color:var(--marrom);font-weight:600}
.reg-contract-row .reg-field{display:grid;grid-template-columns:1fr 100px;align-items:center;gap:8px}
.reg-contract-row .reg-field input{min-width:0;text-align:center}
@media(max-width:640px){.reg-contract-header,.reg-contract-row{grid-template-columns:minmax(0,1fr) 160px;gap:9px;padding:11px 10px}.reg-contract-row .reg-field{grid-template-columns:1fr;gap:2px}.reg-contract-row .reg-field span{font-size:11px}.reg-contract-header{font-size:11px}}

.reg-contract-subrow{background:#FAF8F5}
.reg-contract-subrow .reg-contract-name{padding-left:19px;color:#8B7663;font-weight:500;position:relative}
.reg-contract-subrow .reg-contract-name::before{content:"↳";position:absolute;left:0;color:#AF9E8E}
.reg-contract-total{padding:9px 18px 12px;text-align:right;background:#F5EEE9;border-top:1px solid var(--linha);font-size:12px;color:#625245}
@media(max-width:640px){.reg-contract-total{padding:9px 10px}.reg-contract-subrow .reg-contract-name{padding-left:14px}}
.reg-optional-note{display:block;font-size:11px;font-weight:400;color:#8B7663;margin-top:3px;line-height:1.4}</style></head><body><aside><h2>SANTRELLE</h2><small>ARQUITETURA · Gestão</small><nav id="nav"><button data-page="painel" class="active">▦ Painel geral</button><button data-page="projetos">▤ Projetos</button><button data-page="equipe">♙ Equipe</button><button data-page="modelos">⚙ Etapas e modelos</button></nav></aside><main><div class="top"><div><h1 id="title">Painel geral</h1><div class="muted">Acompanhe projetos, responsáveis e prazos em um só lugar.</div></div><button class="primary" onclick="newProject()">+ Novo projeto</button></div><div id="content"></div><div class="note">Protótipo demonstrativo: os dados desta versão são exemplos e ficam somente neste navegador. Ainda não há conexão com Supabase nem autenticação.</div></main><script>
const seed=[{id:1,name:'Residência Jardim',client:'Cliente exemplo A',owner:'Ana',status:'Em andamento',phase:'Anteprojeto',deadline:'2026-11-12'},{id:2,name:'Apartamento Praia',client:'Cliente exemplo B',owner:'Joyce',status:'Atrasado',phase:'Briefing',deadline:'2026-10-19'},{id:3,name:'Loja Conceito',client:'Cliente exemplo C',owner:'Leonardo',status:'Aguardando aprovação',phase:'Projeto executivo',deadline:'2026-11-02'}];
const initial=[{name:'Briefing',days:3,subs:[{name:'Conversa com cliente',days:1},{name:'Levantamento de necessidades e materiais',days:1},{name:'Consolidar briefing e encaminhar para projeto',days:1}]},{name:'Levantamento',days:2,subs:[{name:'Medição no local',days:1},{name:'Organizar levantamento',days:1}]},{name:'Anteprojeto',days:10,subs:[{name:'Desenvolver proposta',days:7},{name:'Revisão interna',days:3}]},{name:'Projeto executivo',days:20,subs:[{name:'Compatibilizar medidas',days:4},{name:'Detalhamentos técnicos',days:16}]},{name:'Acompanhamento de obra',days:60,subs:[{name:'Planejamento da obra',days:5},{name:'Acompanhamento e visitas',days:55}]}];
let projects=JSON.parse(localStorage.getItem('santrelle_projects')||'null')||seed;let phases=JSON.parse(localStorage.getItem('santrelle_phases')||'null')||initial;let page='painel',filter='Todos',selected=null,registrationEditId=null;let calendarMonth=new Date().getMonth(),calendarYear=new Date().getFullYear(),calendarOwner='Todos',expandedDay=null;let employees=JSON.parse(localStorage.getItem('santrelle_employees')||'null')||[{name:'Ana'},{name:'Joyce'},{name:'Leonardo'}];let deliveries=JSON.parse(localStorage.getItem('santrelle_deliveries')||'[]');let extraHolidays=JSON.parse(localStorage.getItem('santrelle_holidays')||'[]');const el=document.getElementById('content');function save(){localStorage.setItem('santrelle_projects',JSON.stringify(projects));localStorage.setItem('santrelle_phases',JSON.stringify(phases));localStorage.setItem('santrelle_deliveries',JSON.stringify(deliveries));localStorage.setItem('santrelle_holidays',JSON.stringify(extraHolidays));localStorage.setItem('santrelle_employees',JSON.stringify(employees))}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tag(s){return '<span class="tag '+(s==='Atrasado'?'late':s==='Aguardando aprovação'?'waiting':'good')+'">'+esc(s)+'</span>'}function go(p){page=p;selected=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));function rows(list){let fmt=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'')?x.split('-').reverse().join('/'):'—';return '<div class="table-scroll"><table><thead><tr><th>Projeto / cliente</th><th>Etapa</th><th>Equipe das etapas</th><th>Início</th><th>Prazo escritório</th><th>Prazo cliente</th><th>Situação</th></tr></thead><tbody>'+list.map(p=>{let owners=[...new Set((p.schedule?.length?p.schedule:p.steps||[]).map(s=>s.owner).filter(o=>o&&o!=='Não definido'))];return '<tr><td><a class="click" onclick="openProject('+p.id+')">'+esc(p.name)+'</a><div class="muted">'+esc(p.clientRegistration?.constructionAddress||p.client)+'</div></td><td>'+esc(p.phase)+'</td><td>'+esc(owners.join(', ')|| (p.owner&&p.owner!=='Não definido'?p.owner:'A definir'))+'</td><td>'+fmt(p.startDate)+'</td><td>'+fmt(p.officeDate)+'</td><td>'+fmt(p.clientDate||p.deadline)+'</td><td>'+tag(p.status)+'</td></tr>'}).join('')+'</tbody></table></div>'}
function render(){document.getElementById('title').textContent=page==='cadastro'?(registrationEditId===null?'Ficha cadastral do cliente':'Editar ficha cadastral'):selected?'Detalhes do projeto':({painel:'Painel geral',projetos:'Projetos',equipe:'Equipe',modelos:'Etapas e modelos'})[page];if(page==='cadastro'){registrationForm();return}if(selected){detail();return}if(page==='painel'){let entries=calendarEntries().filter(e=>!e.completed).sort((a,b)=>a.date.localeCompare(b.date));let today=iso(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate());let overdue=entries.filter(e=>e.date<today);let soon=entries.filter(e=>e.date>=today&&e.date<=offsetDay(parseISO(today),7));const metrics=[['Projetos ativos',projects.filter(p=>p.status!=='Concluído').length,'Todos'],['Entregas atrasadas',overdue.length,'Atrasado'],['Próximos 7 dias',soon.length,'Todos'],['Aguardando aprovação',projects.filter(p=>p.status==='Aguardando aprovação').length,'Aguardando aprovação']];el.innerHTML='<div class="cards">'+metrics.map(m=>'<button class="card" onclick="filter=\''+m[2]+'\';go(\'projetos\')"><span>'+m[0]+'</span><strong>'+m[1]+'</strong><span class="muted">Ver projetos →</span></button>').join('')+'</div>'+calendarHTML()+'<section class="panel"><div class="calendar-head"><div><h3 style="margin-bottom:5px">Entregas que precisam de atenção</h3><div class="muted">Atrasadas primeiro, depois as próximas entregas da equipe</div></div></div>'+attentionHTML(entries,today)+'</section>'}if(page==='projetos'){let list=projects.filter(p=>filter==='Todos'||p.status===filter);el.innerHTML='<section class="panel"><div class="inline"><strong>Filtrar por situação</strong><select id="filter" onchange="filter=this.value;render()">'+['Todos','Em andamento','Atrasado','Aguardando aprovação'].map(x=>'<option '+(filter===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'+rows(list)+'</section>'}if(page==='equipe'){let owners=[...new Set([...employees.map(e=>e.name),...projects.map(p=>p.owner)])];el.innerHTML='<section class="panel"><div class="inline"><h3 style="margin:0;flex:1">Equipe e entregas</h3><button class="primary" onclick="addEmployee()">+ Funcionário</button></div><p class="muted">Acompanhe as entregas de cada pessoa e gerencie os integrantes da equipe.</p></section><div class="grid2">'+owners.map(o=>'<section class="panel"><div class="inline"><h3 style="flex:1">'+esc(o)+'</h3><button class="secondary" onclick="removeEmployee('+JSON.stringify(o).replace(/"/g,'&quot;')+')">Excluir</button></div>'+calendarEntries().filter(e=>e.owner===o&&!e.completed).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>'<p><a class="click" onclick="calendarOpen(\''+e.id+'\')">'+esc(e.name)+'</a><br><small>'+esc(e.date)+' · '+(e.date<iso(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate())?'Atrasado':'Pendente')+'</small></p>').join('')+(calendarEntries().filter(e=>e.owner===o&&!e.completed).length?'':'<p class="muted">Sem entregas pendentes.</p>')+'</section>').join('')+'</div>'}if(page==='modelos')models()}
function iso(y,m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function parseISO(s){let a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)}
function easter(y){let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k+7)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=(h+l-7*m+114)%31+1;return new Date(y,month-1,day,12)}
function offsetDay(dt,n){let x=new Date(dt);x.setDate(x.getDate()+n);return iso(x.getFullYear(),x.getMonth()+1,x.getDate())}
function holidays(y){let h={'01-01':'Confraternização Universal','04-21':'Tiradentes','05-01':'Dia do Trabalho','09-07':'Independência','10-12':'Nossa Senhora Aparecida','11-02':'Finados','11-15':'Proclamação da República','11-20':'Consciência Negra','12-25':'Natal'};let eas=easter(y);let goodFriday=offsetDay(eas,-2).slice(5);h[goodFriday]='Sexta-feira Santa';for(let x of extraHolidays){if(x.date.startsWith(String(y)))h[x.date.slice(5)]=x.name}return h}

function businessDay(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return false;let d=parseISO(date);return d.getDay()!==0&&d.getDay()!==6&&!holidayName(date)}

function calendarEntries(){let entries=[];for(let p of projects){let completed=p.status==='Concluído';let valid=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'');if(valid(p.startDate))entries.push({id:'p'+p.id,name:'Início: '+p.name,owner:p.owner,date:p.startDate,projectId:p.id,completed:true,kind:'start'});if(valid(p.officeDate))entries.push({id:'p'+p.id,name:'Prazo escritório: '+p.name,owner:p.owner,date:p.officeDate,projectId:p.id,completed,kind:'office'});let client=p.clientDate||(valid(p.deadline)?p.deadline:'');if(valid(client))entries.push({id:'p'+p.id,name:'Entrega cliente: '+p.name,owner:p.owner,date:client,projectId:p.id,completed,kind:'client'});for(let [i,step] of (p.schedule||[]).entries()){if(valid(step.deadline))entries.push({id:'s'+p.id+'_'+i,name:'Etapa escritório: '+step.name+' · '+p.name,owner:step.owner||p.owner,date:step.deadline,projectId:p.id,completed:!!step.completed,kind:'office'});if(valid(step.clientDeadline))entries.push({id:'s'+p.id+'_'+i,name:(step.contractualParts?.secondary>0?'Prazo cliente · '+registrationSecondaryLabel(step):'Entrega cliente: '+step.name)+' · '+p.name,owner:step.owner||p.owner,date:step.clientDeadline,projectId:p.id,completed:!!step.completed,kind:'client'})}}return entries.concat(deliveries.map(d=>({...d,id:'d'+d.id,kind:'delivery'})))}
function calendarHTML(){let first=new Date(calendarYear,calendarMonth,1),offset=(first.getDay()+6)%7,total=new Date(calendarYear,calendarMonth+1,0).getDate();let owners=['Todos',...new Set([...employees.map(e=>e.name),...projects.map(p=>p.owner),...deliveries.map(d=>d.owner)].filter(Boolean))];let entries=calendarEntries().filter(e=>calendarOwner==='Todos'||e.owner===calendarOwner);let today=new Date(),todayISO=iso(today.getFullYear(),today.getMonth()+1,today.getDate());let days='';let kindClass=e=>e.kind==='start'?'cal-start':e.kind==='office'?'cal-office':e.kind==='client'?'cal-client':'';let eventHTML=e=>'<button class="cal-event '+kindClass(e)+(!e.completed&&e.date<todayISO?' overdue':'')+'" title="'+esc(e.name+' · '+e.owner)+'" onclick="calendarOpen(\''+e.id+'\')"><span class="cal-owner">'+esc(e.owner||'Sem responsável')+'</span><span>'+esc(e.name)+'</span></button>';for(let i=0;i<Math.ceil((offset+total)/7)*7;i++){let date=offsetDay(first,i-offset),n=parseISO(date).getDate(),outside=parseISO(date).getMonth()!==calendarMonth,holiday=holidayName(date),off=!businessDay(date),items=entries.filter(e=>e.date===date).sort((a,b)=>(a.owner||'').localeCompare(b.owner||'')||({start:0,stage:1,office:2,client:3,delivery:4}[a.kind]??5)-({start:0,stage:1,office:2,client:3,delivery:4}[b.kind]??5));let expanded=expandedDay===date,limit=2,visible=expanded?items:items.slice(0,limit);days+='<div class="cal-day '+(outside?'other ':'')+(off?'off ':'')+(date===todayISO?'today':'')+'"><div class="cal-daytop"><span class="cal-number">'+n+'</span>'+(items.length?'<span class="cal-count">'+items.length+'</span>':'')+'</div>'+(holiday?'<div class="cal-holiday" title="'+esc(holiday)+'">'+esc(holiday)+'</div>':'')+'<div class="cal-events">'+visible.map(eventHTML).join('')+'</div>'+(items.length>limit?'<button class="cal-more" onclick="toggleCalendarDay(\''+date+'\')">'+(expanded?'Mostrar menos':'+'+(items.length-limit)+' atividades')+'</button>':'')+'</div>'}let selected=expandedDay?entrie function addDelivery(){let name=prompt('O que precisa ser entregue?');if(!name?.trim())return;let owner=prompt('Responsável pela entrega:','')||'Não definido';let project=prompt('Número do projeto (opcional):\n'+projects.map(p=>p.id+' - '+p.name).join('\n'),'')||'';let raw=prompt('Data prevista (AAAA-MM-DD):',iso(calendarYear,calendarMonth+1,Math.min(new Date().getDate(),28)));if(!raw||!/^\d{4}-\d{2}-\d{2}$/.test(raw)||isNaN(parseISO(raw).getTime())){alert('Informe uma data válida no formato AAAA-MM-DD.');return}let date=nextBusiness(raw);if(date!==raw)alert('O dia escolhido não é útil. A entrega foi ajustada para '+date+'.');deliveries.push({id:Date.now(),name:name.trim(),owner,date,projectId:projects.some(p=>String(p.id)===project)?+project:null,completed:false});save();calendarYear=+date.slice(0,4);calendarMonth=+date.slice(5,7)-1;render()}

lick="removeSub('+i+','+j+')">×</button></div></div>').join('')+'<button class="secondary" onclick="addSub('+i+')">+ Adicionar subetapa</button></div>').join('')+'<button class="primary" onclick="addPhase()">+ Adicionar etapa</button></section>'}function setClientExtraDays(i,v){phases[i].clientExtraDays=Math.max(0,Math.floor(Number(v)||0));save();render()}function setSubDays(i,j,v){phases[i].subs[j].days=Math.max(1,+v||1);save();render()}function addPhase(){let name=prompt('Nome da nova etapa:');if(!name?.trim())return;let days=+(prompt('Duração prevista em dias úteis:', '3')||3);phases.push({name:name.trim(),days:Math.max(1,days),clientExtraDays:0,subs:[]});save();render()}function addSub(i){let name=prompt('Nome da nova subetapa:');if(!name?.trim())return;let days=+(prompt('Duração prevista em dias úteis:', '1')||1);phases[i].subs.push({name:name.trim(),days:Math.max(1,days)});save();render()}function renamePhase(i){let v=prompt('Nome da etapa:',phases[i].name);if(v?.trim()){phases[i].name=v.trim();save();render()}}function renameSub(i,j){let v=prompt('Nome da subetapa:',phases[i].subs[j].name);if(v?.trim()){phases[i].subs[j].name=v.trim();save();render()}}function removePhase(i){if(confirm('Excluir etapa e todas as subetapas?')){phases.splice(i,1);save();render()}}function removeSub(i,j){phases[i].subs.splice(j,1);save();render()}function movePhase(i,d){let n=i+d;if(n<0||n>=phases.length)return;[phases[i],phases[n]]=[phases[n],phases[i]];save();render()}function moveSub(i,j){let to=prompt('Mover para qual etapa?\n'+phases.map((p,k)=>(k+1)+' - '+p.name).join('\n'),String(i+1));let k=+to-1;if(!phases[k])return;phases[k].subs.push(phases[i].subs.splice(j,1)[0]);save();render()}

function defaultRegistrationSteps(){

{name:'Estudo preliminar',clientExtraDays:stud?.clientExtraDays||0,subs:[{name:'Desenvolvimento do estudo preliminar',days:stud?.subs?.[0]?.days||7},{name:'Revisão',days:stud?.subs?.[1]?.days||3}]},

function registrationSecondaryLabel(step){let n=registrationStageLabel(step).toLowerCase();if(n.includes('estudo preliminar'))return 'Revisão do estudo preliminar';if(n.includes('anteprojeto'))return 'Revisão do anteprojeto';if(n.includes('executivo'))return 'Compatibilização com projeto dos móveis planejados';return ''}
function registrationContractParts(step){
 if(!step)return {main:1,secondary:0};
 let old=Number(step.contractualDays)>=1?Math.floor(Number(step.contractualDays)):Math.max(1,phaseOfficeDays(step)+Math.max(0,Number(step.clientExtraDays)||0));

function buildScheduleForRegistration(p,start){

 for(let step of p.steps){

  let revisionStart=reviewDays?nextBusiness(offsetDay(parseISO(clientDeadline),1)):null;
  let revisionDeadline=reviewDays?addBusinessDays(revisionStart,reviewDays-1):null;
  p.schedule.push({name:step.name,owner:step.owner||before.owner||'Não definido',start:cursor,deadline:end,clientDeadline,days:parts.main,contractualDays:base,contractualParts:parts,clientExtraDays:0,completed:!!before.completed,history:before.history||[],revisionRequested,revisionStart,revisionDeadline,revisionCompleted:revisionRequested?!!before.revisionCompleted:false});
  cursor=nextBusiness(offsetDay(parseISO(revisionDeadline||clientDeadline),1))
 }
 p.officeDate=p.schedule.at(-1)?.deadline||'';p.clientDate=p.schedule.at(-1)?.revisionDeadline||p.schedule.at(-1)?.clientDeadline||'';p.deadline=p.clientDate||'A definir';p.phase=p.schedule.find(s=>!s.completed)?.name||p.schedule[0]?.name||'A definir'
}
function saveRegistration(event){
event.preventDefault();let form=document.getElementById('registrationForm');if(form&&!form.reportValidity())return;
let val=k=>document.getElementById('reg_'+k)?.value?.trim()||'';
let name=val('clientName');if(!name){alert('Informe o nome do cliente.');return}
let old=projects.find(x=>x.id===registrationEditId),steps=registrationSteps().map((step,i)=>{
 let main=Math.max(1,Math.floor(Number(val('contract_'+i+'_main'))||1));
 let secondary=registrationHasSecondary(step)?Math.max(0,Math.floor(Number(val('contract_'+i+'_secondary'))||0)):0;
 return {...step,contractualParts:{main,secondary},contractualDays:main+(registrationIsCompatibility(step)?secondary:0),clientExtraDays:0};
});
let contractChanged=!!old&&steps.some((step,i)=>{
 let previous=registrationContractParts((old.steps||[])[i]||step);
 return step.contractualParts.main!==previous.main||step.contractualParts.secondary!==previous.secondary;
});
let keys=['cpf','rg','phone','email','birthDate','profession','spouseName','maritalStatus','residentialAddress','constructionAddress','source'];
let clientRegistration={name};keys.forEach(k=>clientRegistration[k]=val(k));clientRegistration.children=Array.from({length:5},(_,i)=>val('child_'+i));
let condominium={};['managerName','managerContact','conciergeName','conciergeContact','hasRules','rulesNotes'].forEach(k=>condominium[k]=val(k));
let addressTitle=clientRegistration.constructionAddress.split(',')[0].trim();
let displayName=addressTitle?name+' · '+addressTitle:name+' · Projeto';
let startDate=val('startDate'),p=old||{id:Date.now(),status:'Em andamento',schedule:[],deadline:'A definir',owner:'Não definido',phase:'Levantamento'};
if(startDate&&!businessDay(startDate)){let adjusted=nextBusiness(startDate);if(!confirm('A data de início escolhida não é um dia útil. Usar '+adjusted.split('-').reverse().join('/')+'?'))return;startDate=adjusted}
let needsRecalculation=!!old&&!!startDate&&(!old.schedule?.length||old.startDate!==startDate||contractChanged);
if(needsRecalculation&&old.schedule?.length&&!confirm('A alteração dos prazos contratuais ou da data de início recalculará o cronograma. Continuar?'))return;
p.name=displayName;p.client=name;p.clientRegistration=clientRegistration;p.condominium=condominium;
p.steps=steps;
if(!old){p.startDate=startDate||'';if(startDate){buildScheduleForRegistration(p,startDate);p.scheduleVersion=2}projects.push(p)}
else if(needsRecalculation){
buildScheduleForRegistration(p,startDate);p.scheduleVersion=2
}else if(!startDate){p.startDate=''}
if(old){p.registrationUpdatedAt=new Date().toISOString()}
if(!p.manualCoverDate){let now=new Date();p.manualCoverDate=iso(now.getFullYear(),now.getMonth()+1,now.getDate())}save();registrationEditId=null;openProject(p.id);if(typeof maybeAutoGenerateManual==='function')maybeAutoGenerateManual(p.id)
}
function openProject(id){selected=projects.find(p=>p.id===id);page='projetos';render()}function detail(){let p=selected,steps=p.steps||phases;let schedule=p.schedule||[];el.innerHTML='<section class="panel"><div class="inline"><button class="secondary" onclick="go(\'projetos\')">← Voltar</button><button class="secondary" onclick="editRegistration('+p.id+')">Ver / editar ficha cadastral</button></div><h2>'+esc(p.name)+'</h2><p class="muted">'+esc(p.client)+'</p><div class="inline"><label>Situação <select id="st">'+['Em andamento','Atrasado','Aguardando aprovação','Concluído'].map(s=>'<option '+(p.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label>Início <input id="startDate" type="date" value="'+esc(p.startDate||'')+'"></label><label>Prazo do escritório <input id="officeDate" type="date" value="'+esc(p.officeDate||'')+'"></label><label>Prazo do cliente <input id="clientDate" type="date" value="'+esc(p.clientDate||(/^\d{4}-/.test(p.deadline)?p.deadline:''))+'"></label><button class="primary" onclick="updateProject('+p.id+')">Salvar alterações</button></div></section><section class="panel"><div class="calendar-head"><div><h3 style="margin-bottom:6px">Manual do cliente</h3><p class="muted">Manual individual em PDF com 16 páginas. Nome, data da capa e prazos são preenchidos automaticamente a partir da ficha do cliente.</p></div></div><div class="inline"><label>Data da capa <input type="date" value="'+esc(p.manualCoverDate||new Date().toISOString().slice(0,10))+'" onchange="manualSaveDate('+p.id+',this.value)"></label><button class="primary" onclick="generateManualPdf('+p.id+')">Gerar manual PDF</button><button class="secondary" onclick="document.getElementById(\'manualTemplateInput\').click()">Importar/atualizar modelo PDF</button><input type="file" id="manualTemplateInput" accept=".pdf,application/pdf" style="display:none" onchange="importManualTemplate(event,'+p.id+')"></div><div class="muted" style="margin-top:12px;font-size:13px" id="manualTemplateStatus">Verificando modelo...</div></section><section class="panel"><div class="calendar-head"><div><h3>Planejamento e prazos das etapas</h3><p class="muted">As etapas seguem em sequência e consideram dias úteis e feriados. O prazo de acompanhamento de obra pode ser ajustado individualmente.</p></div><div class="inline"><button class="primary" onclick="createSchedule('+p.id+')">Gerar cronograma</button><button class="secondary" onclick="addProjectStep('+p.id+')">+ Entrega avulsa</button></div></div>'+(!schedule.length?'<p class="muted">Nenhum cronograma gerado. Clique em Gerar cronograma para calcular as datas.</p>':'')+schedule.map((s,i)=>'<div class="phase"><div class="inline"><strong style="flex:1">'+esc(s.name)+'</strong><label class="form-field">Responsável <select onchange="setScheduleOwner('+p.id+','+i+',this.value)"><option value="Não definido">Não definido</option>'+employees.map(e=>'<option value="'+esc(e.name)+'"'+(s.owner===e.name?' selected':'')+'>'+esc(e.name)+'</option>').join('')+'</select></label><span class="tag '+(s.completed?'good':'')+'">'+(s.completed?'Concluída':'Pendente')+'</span><button class="secondary" onclick="editProjectStep('+p.id+','+i+')">Editar prazo</button><button class="secondary" onclick="completeProjectStep('+p.id+','+i+')">'+(s.completed?'Reabrir':'Concluir')+'</button></div><div class="muted">'+esc(s.owner||p.owner)+' · '+esc(s.start||'')+' até '+esc(s.deadline||'')+' · '+s.days+' dias úteis internos · Cliente: '+esc(s.clientDeadline||s.deadline||'')+(s.contractualDays?' · Prazo contratual total: '+s.contractualDays+' dias úteis'+(s.contractualParts?.secondary>0?' · '+esc(registrationSecondaryLabel(s))+': '+s.contractualParts.secondary+' dias úteis':''):' (+'+(s.clientExtraDays||0)+' dias úteis)')+'</div></div>').join('')+'</section><section class="panel"><h3>Modelo de etapas e subetapas deste projeto</h3><p class="muted">As durações abaixo podem ser ajustadas antes de gerar o cronograma.</p>'+steps.map((s,i)=>'<div class="phase"><div class="inline"><strong style="flex:1">'+esc(s.name)+'</strong><span class="muted">Prazo escritório: <strong>'+phaseOfficeDays(s)+' dias úteis</strong></span><label>Adicional cliente <input type="number" min="0" style="width:70px" value="'+(s.clientExtraDays||0)+'" onchange="changeProjectClientDays('+p.id+','+i+',this.value)"> dias</label></div>'+(s.subs||[]).map((sub,j)=>'<div class="sub">'+esc(sub.name)+' · <input aria-label="Dias úteis da subetapa" type="number" min="1" style="width:72px" value="'+sub.days+'" onchange="changeProjectSubDays('+p.id+','+i+','+j+',this.value)"> dias úteis</div>').join('')+'</div>').join('')+'</section>';if(typeof refreshManualTemplateStatus==='function')refreshManualTemplateStatus()}function attentionHTML(entries,today){let visible=entries.filter(e=>e.date<=offsetDay(parseISO(today),14)).slice(0,15);if(!visible.length)return '<p class="muted">Nenhuma entrega atrasada ou prevista para os próximos 14 dias.</p>';return '<table><thead><tr><th>Entrega / projeto</th><th>Responsável</th><th>Prazo</th><th>Situação</th></tr></thead><tbody>'+visible.map(e=>'<tr><td><a class="click" onclick="calendarOpen(\''+e.id+'\')">'+esc(e.name)+'</a></td><td>'+esc(e.owner||'Não definido')+'</td><td>'+esc(e.date.split('-').reverse().join('/'))+'</td><td><span class="tag '+(e.date<today?'late':'waiting')+'">'+(e.date<today?'Atrasada':'Próxima')+'</span></td></tr>').join('')+'</tbody></table>'}
function changeProjectClientDays(id,i,value){let p=projects.find(x=>x.id===id);p.steps=p.steps||structuredClone(phases);p.steps[i].clientExtraDays=Math.max(0,Math.floor(Number(value)||0));save();render()}function changeProjectSubDays(id,i,j,value){let p=projects.find(x=>x.id===id);p.steps=p.steps||structuredClone(phases);p.steps[i].subs[j].days=Math.max(1,Math.floor(Number(value)||1));save();render()}function changeProjectPhaseDays(id,i,value){let p=projects.find(x=>x.id===id);p.steps=p.steps||structuredClone(phases);p.steps[i].days=Math.max(1,Number(value)||1);save()}
function createSchedule(id){
 let p=projects.find(x=>x.id===id);
 if(!p)return;
 let today=iso(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate());
 let start=prompt('Data de início do cronograma (AAAA-MM-DD):',p.startDate||today);
 if(!start||!/^\d{4}-\d{2}-\d{2}$/.test(start))return;
 if((p.schedule||[]).length&&!confirm('Recalcular o cronograma? Os responsáveis, revisões solicitadas e etapas concluídas serão mantidos.'))return;
 p.steps=p.steps||structuredClone(phases);
 buildScheduleForRegistration(p,nextBusiness(start));
 p.scheduleVersion=2;save();render()
}
function toggleProjectRevision(id,i){
 let p=projects.find(x=>x.id===id),step=p?.steps?.[i],current=p?.schedule?.[i];
 if(!p||!step||!registrationHasOptionalReview(step))return;
 if(!p.startDate){alert('Cadastre a data de início e gere o cronograma antes de solicitar revisão.');return}
 let parts=registrationContractParts(step);
 if(parts.secondary<1){alert('Defina o prazo da revisão na ficha cadastral antes de solicitá-la.');return}
 let enable=!(current?.revisionRequested??step.revisionRequested);
 let question=enable?'Solicitar revisão do '+step.name+'? Serão acrescentados '+parts.secondary+' dias úteis e as próximas datas serão recalculadas.':'Cancelar revisão do '+step.name+' e recalcular as datas seguintes?';
 if(!confirm(question))return;
 step.revisionRequested=enable;
 if(current)current.revisionRequested=enable;
 buildScheduleForRegistration(p,p.startDate);p.scheduleVersion=2;
 if(enable&&p.status==='Concluído')p.status='Em andamento';
 save();render()
}
function completeProjectRevision(id,i){
 let p=projects.find(x=>x.id===id),s=p?.schedule?.[i];
 if(!s?.revisionRequested)return;
 s.revisionCompleted=!s.revisionCompleted;save();render()
}
function addProjectStep(id){let p=projects.find(x=>x.id===id),name=prompt('Nome da entrega:');if(!name?.trim())return;let owner=prompt('Responsável:',p.owner)||p.owner;let date=prompt('Prazo (AAAA-MM-DD):',iso(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate()));if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;date=nextBusiness(date);p.schedule=p.schedule||[];p.schedule.push({name:name.trim(),owner,start:date,deadline:date,days:1,completed:false});save();render()}function editProjectStep(id,i){let p=projects.find(x=>x.id===id),s=p.schedule[i];let owner=prompt('Responsável:',s.owner);if(owner===null)return;let date=prompt('Nova data da entrega (AAAA-MM-DD):',s.deadline);if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;let reason=prompt('Motivo da alteração (opcional):','');if(reason===null)return;s.history=s.history||[];s.history.push({old:s.deadline,new:nextBusiness(date),reason});s.owner=owner;s.deadline=nextBusiness(date);save();render()}function setScheduleOwner(id,i,owner){let p=projects.find(x=>x.id===id);if(!p?.schedule?.[i])return;p.schedule[i].owner=owner;if(p.steps?.[i]&&p.steps[i].name===p.schedule[i].name)p.steps[i].owner=owner;save();render()}function completeProjectStep(id,i){let p=projects.find(x=>x.id===id),s=p.schedule[i];s.completed=!s.completed;let next=p.schedule.find(x=>!x.completed);if(next)p.phase=next.name;else if(p.schedule.length)p.status='Concluído';save();render()}function updateProject(id){let p=projects.find(x=>x.id===id);let status=document.getElementById('st').value;let startDate=document.getElementById('startDate').value;let officeDate=document.getElementById('officeDate').value;let clientDate=document.getElementById('clientDate').value;if(startDate&&officeDate&&officeDate<startDate){alert('O prazo do escritório não pode ser anterior ao início.');return}if(officeDate&&clientDate&&clientDate<officeDate){alert('O prazo do cliente não pode ser anterior ao prazo do escritório.');return}if((officeDate&&!businessDay(officeDate))||(clientDate&&!businessDay(clientDate))){alert('O prazo do escritório e o do cliente precisam ser dias úteis. Ajuste a data considerando os feriados.');return}let changed=p.officeDate!==officeDate||(p.clientDate||(/^\\d{4}-/.test(p.deadline)?p.deadline:''))!==clientDate;if(changed&&(p.officeDate||p.clientDate)){let reason=prompt('Motivo da alteração dos prazos:');if(reason===null)return;p.history=p.history||[];p.history.push({previousOffice:p.officeDate,previousClient:p.clientDate,nextOffice:officeDate,nextClient:clientDate,reason,date:new Date().toISOString()})}p.startDate=startDate;p.officeDate=officeDate;p.clientDate=clientDate;p.deadline=clientDate||'A definir';p.status=status;save();render()}render();
